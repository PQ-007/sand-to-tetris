# Нэр томьёоны толь (монгол). id нь docs/glossary.yaml-тай ижил байх
# ёстой; `see` англи файлаас авна. Бүлгүүд [[харуулах үг|id]] хэлбэрээр
# холбоно. Нэр томьёоны сонголт: docs/mn/TERMS.md.

- id: computer
  term: "Компьютер"
  short: "Мэдээлэл хүлээн авч, хадгалж, зааврын жагсаалтын дагуу боловсруулж, үр дүнг гаргадаг машин."
  long: "Энэ хичээлийн компьютерууд [[ерөнхий зориулалттай|general-purpose]], [[програмчлах|program]] боломжтой бөгөөд програмаа бусад өгөгдлийн адил [[санах ой|memory]]-доо хадгалдаг ([[програмаа санах ойдоо хадгалах|stored-program]] санаа)."

- id: input
  term: "Оролт"
  short: "Компьютер руу орж буй мэдээлэл: товч дарах, мэдрэгчийн хэмжилт, файл гэх мэт."

- id: output
  term: "Гаралт"
  short: "Компьютерээс гарах үр дүн: дэлгэцийн цэг, дуу, тоо гэх мэт."

- id: memory
  term: "Санах ой"
  short: "Мэдээллийг дараа ашиглахаар хадгалдаг компьютерийн хэсэг."
  long: "Санах ой нь тус бүр нэг [[бит|bit]] хадгалдаг олон нүднээс бүтдэг. Та 3-р бүлэгт санах ойг [[логик хаалга|logic-gate]]-аас бүтээнэ."

- id: processor
  term: "Процессор"
  short: "Зааврыг нэг нэгээр нь гүйцэтгэж, арифметик, харьцуулалт, шийдвэр гаргалт хийдэг компьютерийн хэсэг."
  long: "Төв процессор (CPU) гэж бас нэрлэдэг. Нэг чип дээр бүтээсэн процессорыг [[микропроцессор|microprocessor]] гэнэ."

- id: program
  term: "Програм"
  short: "Компьютерт юу хийхийг алхам алхмаар заадаг зааврын жагсаалт."

- id: algorithm
  term: "Алгоритм"
  short: "Асуудлыг шийдэх нарийн, алхам алхмаар бичсэн арга: дагахад ямар ч ухаан шаардахгүй байхаар бичигдсэн."

- id: general-purpose
  term: "Ерөнхий зориулалттай"
  short: "Ганц тогтсон ажил биш, өгсөн програмаасаа хамаарч олон өөр ажил хийж чаддаг."

- id: stored-program
  term: "Програмаа санах ойдоо хадгалдаг компьютер"
  short: "Програмаа өгөгдөлтэйгөө нэг санах ойд хадгалдаг компьютер: шинэ програм ачаалах нь шинэ өгөгдөл ачаалахтай адил хялбар."

- id: punched-card
  term: "Punched card"
  short: "Тогтсон байрлалд нүх байгаа эсэхээр мэдээлэл тэмдэглэдэг хатуу карт."

- id: logarithm
  term: "Логарифм"
  short: "Тухайн утгыг гаргахын тулд суурь тоог хэдэн зэрэг дэвшүүлэхийг заах тоо; логарифм үржвэрийг нийлбэр болгодог."
  long: "log(a × b) = log(a) + log(b) учир [[slide rule|slide-rule]] дээр хоёр уртыг нэмэхэд тэдгээрийн илэрхийлэх тоонууд үржигддэг."

- id: slide-rule
  term: "Slide rule"
  short: "Бие биеэ дагуу гулсдаг логарифмын хуваарьтай шугам; хуваарийг тааруулж тоо үржүүлж, хуваадаг."

- id: analog
  term: "Аналог"
  short: "Хэмжигдэхүүнийг жигд өөрчлөгдөж болох зүйлээр илэрхийлэх: хүчдэл, тэнхлэгийн өнцөг, урт гэх мэт."

- id: digital
  term: "Цифрлэг"
  short: "Мэдээллийг цөөн тооны тодорхой утгаар, ихэвчлэн хоёрхон утгаар илэрхийлэх; ингэснээр жижиг алдааг засах боломжтой."

- id: bit
  term: "Бит"
  short: "Мэдээллийн хамгийн жижиг хэсэг: хоёр утгын нэгийг сонгох, 0 ба 1 гэж бичнэ."
  long: "Англиар «binary digit» (хоёртын орон)-ын товчлол. Хэлхээнд бит ихэвчлэн нам хүчдэл (0) эсвэл өндөр хүчдэл (1) байдаг."

- id: binary
  term: "Хоёртын тоолол"
  short: "Зөвхөн 0 ба 1 гэсэн хоёр цифрээр тоолох арга; орон бүр баруун талынхаасаа хоёр дахин их жинтэй."

- id: boolean-algebra
  term: "Булийн алгебр"
  short: "Утга бүр үнэн эсвэл худал (1 эсвэл 0) байх бөгөөд БА, ЭСВЭЛ, ҮГҮЙ үйлдлээр нийлдэг алгебр."

- id: logic-gate
  term: "Логик хаалга"
  short: "Битүүдийн энгийн функц (БА, ЭСВЭЛ, ҮГҮЙ гэх мэт) тооцдог жижиг хэлхээ."
  long: "Та анхны хаалгануудаа 1-р бүлэгт [[транзистор|transistor]]-оос бүтээнэ."

- id: turing-machine
  term: "Тьюрингийн машин"
  short: "Энгийн дүрмийн дагуу соронзон тууз дээр тэмдэгт уншиж, бичдэг төсөөллийн машин; алхам алхмаар хийгдэх ямар ч ажлыг гүйцэтгэж чадна."

- id: switch
  term: "Унтраалга"
  short: "Ямар нэг зүйлийг нэвтрүүлдэг (хаалттай, асаалттай) эсвэл хаадаг (нээлттэй, унтраалттай) төхөөрөмж."
  long: "Цифрлэг компьютер бүр бусад унтраалгыг удирддаг унтраалгуудаас бүтдэг. Тэд шүд араа, [[реле|relay]], [[вакуум чийдэн|vacuum-tube]], [[транзистор|transistor]] байсаар ирсэн."

- id: relay
  term: "Реле"
  short: "Цахилгаан соронзоор шилждэг унтраалга: ороомгоор гүйх гүйдэл төмөр контактыг татаж нээдэг эсвэл хаадаг."

- id: vacuum-tube
  term: "Вакуум чийдэн"
  short: "Битүү шилэн бүрхүүл дотор торон утсан дээрх хүчдэл вакуумаар урсах электроны урсгалыг удирддаг төхөөрөмж; хөдөлгөөнт хэсэггүй электрон унтраалга."

- id: transistor
  term: "Транзистор"
  short: "Хагас дамжуулагчаар хийсэн бяцхан электрон унтраалга: нэг гаргалгаан дээрх хүчдэл эсвэл гүйдэл нөгөө хоёрын хоорондох урсгалыг удирдана."

- id: semiconductor
  term: "Хагас дамжуулагч"
  short: "Цахилгаан дамжуулах чадвар нь металл ба тусгаарлагчийн хооронд байдаг, түүнийг нь удирдаж болдог материал: цахиур, германи гэх мэт."

- id: germanium
  term: "Германи"
  short: "Анхны транзисторуудад хэрэглэсэн хагас дамжуулагч элемент; эхэндээ цэвэршүүлэхэд хялбар байсан ч халахаараа гүйдэл алддаг, тогтвортой исэлгүй."

- id: silicon
  term: "Цахиур"
  short: "Өнөөгийн бараг бүх чипэнд хэрэглэдэг хагас дамжуулагч элемент; элс, чулуунд элбэг, гадаргуу дээрээ бат бөх тусгаарлагч исэл ургуулдаг."

- id: silicon-dioxide
  term: "Цахиурын давхар исэл"
  short: "Хүчилтөрөгчтэй нэгдсэн цахиур (SiO₂), кварц элсний үндсэн эрдэс; чип дээр түүний нимгэн үе маш сайн тусгаарлагч болдог."

- id: band-gap
  term: "Хориотой бүс"
  short: "Электрон чөлөөлөгдөж гүйдэл дамжуулахад шаардах энерги; энэ нь их байх тусам дулаанаар чөлөөлөгдөх электрон цөөн."
  long: "Электронвольтоор (эВ) хэмжинэ. Цахиурын хориотой бүс (ойролцоогоор 1.1 эВ) германийхаас (ойролцоогоор 0.66 эВ) их тул цахиур халахдаа хамаагүй бага гүйдэл алддаг."

- id: leakage-current
  term: "Алдагдлын гүйдэл"
  short: "Унтраалттай байх ёстой унтраалгаар урсах хүсээгүй гүйдэл."

- id: integrated-circuit
  term: "Интеграл схем"
  short: "Олон транзистор, тэдгээрийн холболтыг нэг хагас дамжуулагч дээр хамт хийсэн бүтэн хэлхээ; чип."

- id: microprocessor
  term: "Микропроцессор"
  short: "Ганц интеграл схем болгон бүтээсэн бүтэн процессор."

- id: moores-law
  term: "Мурын хууль"
  short: "Чип дээр багтах транзисторын тоо тогтмол хурдаар, 1975 оноос хойш ойролцоогоор хоёр жил тутам хоёр дахин өсдөг гэсэн Гордон Мурын ажиглалт."

- id: wafer
  term: "Wafer"
  short: "Цахиурын нэг талстаас зүсэж өнгөлсөн нимгэн дугуй хавтан; дээр нь олон чипийг зэрэг бүтээдэг."

- id: polysilicon
  term: "Олон талст цахиур"
  short: "Олон жижиг талст нийлсэн маш цэвэр цахиур; нэг талст ургуулах түүхий эд."

- id: single-crystal
  term: "Нэг талст"
  short: "Атомууд нь бүхэлдээ тасралтгүй, нэг жигд хэв маягаар эгнэсэн хатуу бие."

- id: czochralski-process
  term: "Чохральскийн арга"
  short: "Жижиг үр талстыг хайлсан материалд дүрж, эргүүлэнгээ аажмаар дээш татаж нэг талст ургуулах арга."

- id: doping
  term: "Хольцлох"
  short: "Хагас дамжуулагчид өөр элементийн маш бага, хянагдсан хэмжээг нэмж илүү чөлөөт электрон эсвэл нүх өгөх."

- id: dopant
  term: "Хольц"
  short: "Хольцлох үед зориуд нэмдэг элемент, жишээ нь цахиурт фосфор (n-төрөл) эсвэл бор (p-төрөл)."

- id: electron
  term: "Электрон"
  short: "Сөрөг цэнэгтэй бяцхан бөөмс; утсаар гүйдэл дамжуулдаг нь хөдөлж буй электронууд."

- id: hole
  term: "Нүх"
  short: "Талстын холбоонд дутуу байгаа электрон; хөрш электронууд түүн рүү үсрэхэд эерэг цэнэг шиг хөдөлдөг."

- id: n-type
  term: "n-төрөл"
  short: "Илүү чөлөөт электронтой (сөрөг зөөгчтэй) болгож хольцолсон цахиур, жишээ нь фосфороор."

- id: p-type
  term: "p-төрөл"
  short: "Илүү нүхтэй (эерэг зөөгчтэй) болгож хольцолсон цахиур, жишээ нь бороор."

- id: p-n-junction
  term: "p-n шилжилт"
  short: "p-төрөл ба n-төрөл цахиур нийлэх зааг; гүйдлийг зөвхөн нэг чиглэлд амархан нэвтрүүлдэг."

- id: depletion-region
  term: "Depletion region"
  short: "p-n шилжилт дэх нимгэн бүс, энд электрон ба нүх хоорондоо устаж, гүйдэл дамжуулах чөлөөт зөөгч үлдээгүй."

- id: diode
  term: "Диод"
  short: "Гүйдлийг нэг чиглэлд нэвтрүүлж, нөгөө чиглэлд хаадаг төхөөрөмж; p-n шилжилт нь диод юм."

- id: forward-bias
  term: "Forward bias"
  short: "p-n шилжилтэд depletion region-ийг нарийсгаж, гүйдэл урсгах чиглэлд өгсөн хүчдэл."

- id: reverse-bias
  term: "Reverse bias"
  short: "p-n шилжилтэд depletion region-ийг өргөсгөж, гүйдлийг хаах чиглэлд өгсөн хүчдэл."

- id: mosfet
  term: "MOSFET"
  short: "Металл-исэл-хагас дамжуулагч талбайн транзистор; бараг бүх чипэнд байдаг, gate-ийн хүчдэл сувгийг үүсгэж эсвэл арилгадаг."

- id: gate-terminal
  term: "Gate (транзисторын)"
  short: "MOSFET-ийн удирдах гаргалгаа; түүний хүчдэл унтраалга асаалттай эсвэл унтраалттай байхыг шийднэ."
  long: "Олон транзистороос бүтсэн бүтэн хэлхээ болох [[логик хаалга|logic-gate]]-тай андуурч болохгүй."

- id: source-and-drain
  term: "Source ба drain"
  short: "MOSFET-ийн унтраалга холбож эсвэл салгадаг хоёр гаргалгаа; суваг байх үед гүйдэл тэдгээрийн хооронд урсдаг."

- id: channel
  term: "Суваг"
  short: "Gate-ийн хүчдэл босгоос давахад MOSFET-ийн gate-ийн доор үүсдэг гүйдэл дамжуулах нимгэн үе."

- id: threshold-voltage
  term: "Босго хүчдэл"
  short: "MOSFET-ийн суваг үүсэж, транзистор асдаг gate-ийн хүчдэл."

- id: nmos
  term: "NMOS"
  short: "n-сувагтай MOSFET; gate нь өндөр (1) үед асдаг."

- id: pmos
  term: "PMOS"
  short: "p-сувагтай MOSFET; gate нь нам (0) үед асдаг, NMOS-ийн эсрэг."

- id: cmos
  term: "CMOS"
  short: "Нөхөх MOS: NMOS ба PMOS транзисторын хос бүрээс бүтсэн логик; хос бүрийн нэг нь унтарсан байх тул сул зогсох үед бараг гүйдэл урсдаггүй."

- id: voltage
  term: "Хүчдэл"
  short: "Хоёр цэгийн хоорондох цахилгаан «түлхэлт», вольтоор (В) хэмжинэ; хоолой дахь усны даралттай адил."

- id: current
  term: "Гүйдэл"
  short: "Нэг секундэд тухайн цэгээр өнгөрөх цахилгаан цэнэгийн хэмжээ, ампераар (А) хэмжинэ."

- id: noise
  term: "Шуугиан"
  short: "Дулаан, саад, хөрш утаснаас дохионд нэмэгдэх хүсээгүй санамсаргүй жижиг өөрчлөлт."

- id: logic-level
  term: "Логик түвшин"
  short: "Хэлхээ 0 эсвэл 1 гэж уншдаг хүчдэлийн муж."

- id: noise-margin
  term: "Noise margin"
  short: "Хүчинтэй 0 эсвэл 1 хэр их шуугиан авч ч дараагийн шатанд зөв уншигдах вэ гэдэг хэмжээ."

- id: transfer-curve
  term: "Transfer curve"
  short: "Хэлхээний гаралтын хүчдэлийг оролтын хүчдэлээс хамааруулсан график; эгц S хэлбэр нь цифрлэг логикт дохиог сэргээх боломж олгодог."

- id: series-and-parallel
  term: "Цуваа ба зэрэгцээ"
  short: "Цуваа холбосон унтраалгууд нэг нэгнийхээ араас байрлах тул гүйдэл урсахад бүгд хаалттай байх ёстой (БА); зэрэгцээ холбосон бол хажуу хажуудаа байх тул аль нэг нь хангалттай (ЭСВЭЛ)."

- id: truth-table
  term: "Үнэний хүснэгт"
  short: "Хэлхээний оролтуудын бүх хослол, тус бүрд өгөх ёстой гаралтыг жагсаасан хүснэгт."

- id: pull-up-network
  term: "Pull-up network"
  short: "CMOS хаалганы зөв оролтуудын үед гаралтыг VDD-тэй холбож (1 болгодог) PMOS транзисторууд."

- id: pull-down-network
  term: "Pull-down network"
  short: "CMOS хаалганы зөв оролтуудын үед гаралтыг GND-тэй холбож (0 болгодог) NMOS транзисторууд."

- id: floating
  term: "Floating"
  short: "VDD эсвэл GND-тэй юу ч холбоогүй утас, утга нь тодорхойгүй; simulator үүнийг Z гэж харуулна."

- id: short-circuit
  term: "Богино холболт"
  short: "Асаалттай унтраалгуудаар дамжин VDD-ээс GND руу шууд үүсэх зам; эрчим хүч үрж, чипийг халааж, гаралтыг урьдчилан таамаглах боломжгүй (X) болгоно."

- id: universal-gate
  term: "Universal gate"
  short: "Бусад бүх логик функцийг түүнээс бүтээж болох хаалга; NAND ба NOR хоёулаа universal."

- id: abstraction
  term: "Хийсвэрлэл"
  short: "Аливаа зүйлийн дотоод ажиллагааг нууж, юу хийдгээр нь ашиглах: NAND тань шалгалтыг давмагц та түүнийг дөрвөн транзистор биш, NAND хайрцаг гэж хардаг."

- id: gate-delay
  term: "Хаалганы саатал"
  short: "Оролт өөрчлөгдсөний дараа хаалга гаралтаа шинэчлэхэд зарцуулах богино хугацаа; simulator үүнийг алхмаар тоолно."

- id: multiplexer
  term: "Multiplexer (MUX)"
  short: "Сонголтын битүүдээр заасан нэг оролтыг сонгож гаралт руу дамжуулдаг хэлхээ."

- id: demultiplexer
  term: "Demultiplexer (DMUX)"
  short: "Нэг оролтыг сонголтын битүүдээр заасан нэг гаралт руу илгээдэг хэлхээ; бусад гаралт 0 хэвээр."

- id: bus
  term: "Bus"
  short: "Нэг тоог хамтдаа дамжуулдаг утасны багц, утас бүрд нэг бит; засварлагч үүнийг нэг зузаан утсаар зурдаг."

- id: splitter-and-joiner
  term: "Splitter ба joiner"
  short: "Splitter bus-ыг нэг битийн утсуудад салгадаг (0-р бит нь хамгийн бага жинтэй); joiner нэг битүүдийг буцааж bus болгодог."

- id: half-adder
  term: "Хагас нэмэгч"
  short: "Хоёр битийг нэмж, нийлбэрийн бит ба carry бит гаргадаг хэлхээ."

- id: full-adder
  term: "Бүтэн нэмэгч"
  short: "Гурван битийг (хоёр цифр ба орж ирэх carry) нэмж, нийлбэрийн бит ба гарах carry гаргадаг хэлхээ: нэмэх үйлдлийн нэг багана."

- id: carry
  term: "Carry"
  short: "Баганын нийлбэр нэг цифрт багтахгүй үед дараагийн багана руу шилжүүлэх нэмэлт 1."

- id: ripple-carry-adder
  term: "Ripple-carry adder"
  short: "Гинжилсэн бүтэн нэмэгчүүдээс бүтсэн нэмэгч, багана бүрийн carry дараагийнх руу ордог; энгийн боловч carry бүх баганыг дамжих шаардлагатай байж болно."

- id: twos-complement
  term: "Two's complement"
  short: "Компьютерууд сөрөг тоог хадгалдаг ердийн арга: −x-ийг NOT x + 1 гэж хадгалдаг тул нэг нэмэгч эерэг, сөрөг аль ч тоог боловсруулна."

- id: fast-model
  term: "Хурдан загвар"
  short: "Таны зохиосон бүрэлдэхүүний бэлэн, хурдан хувилбар; тохирлын шалгалтаар хоёулаа адил ажилладаг нь батлагдсаны дараа таны хаалгануудын оронд ашиглагдана."

- id: alu
  term: "ALU (arithmetic logic unit)"
  short: "Төв процессорын тооцоолдог хэсэг: хэдэн удирдах оролтоор үйлдлээ сонгож, нэмж, хасаж, битүүдийг нийлүүлдэг."

- id: flags
  term: "Flags"
  short: "ALU-гийн үр дүнгийн тухай нэг битийн баримтууд (тэг үү? сөрөг үү? carry гарсан уу?); төв процессор дараа нь юу хийхээ эдгээрээр шийддэг."

- id: sequential-circuit
  term: "Sequential circuit"
  short: "Гаралт нь зөвхөн одоогийн оролтоос бус, өмнө нь болсон зүйлээс хамаардаг хэлхээ: санах ойтой."
  long: "Хослолын хэлхээний эсрэг. Sequential circuit-ийг [[эргэх холбоо|feedback]]-оор бүтээдэг бөгөөд ихэнхийг нь [[clock|clock]] удирддаг."

- id: feedback
  term: "Эргэх холбоо"
  short: "Хэлхээний гаралтыг өөрийнх нь оролт руу буцааж холбох; ингэснээр дараа юу хийх нь одоо юу хийж байгаагаас хамаарна."
  long: "Эргэх холбоо нь [[latch|latch]]-д санах чадвар өгдөг. Мөн хэлхээг үүрд сэлгэсээр хэлбэлзэх болгож болно."

- id: latch
  term: "Latch"
  short: "Хамгийн энгийн санах ой: бие биеэ тэжээдэг хоёр хаалга, тэднийг тохируулсан дохио алга болсны дараа ч нэг бит хадгалдаг."
  long: "SR latch нь тохируулах (s) ба арилгах (r) оролттой. D latch нь нэг өгөгдлийн оролттой: идэвхжүүлэх оролт 1 үед түүнийг хуулж, 0 үед хадгалдаг."

- id: flip-flop
  term: "Flip-flop"
  short: "Clock 0-ээс 1 болох агшинд л өөрчлөгддөг нэг битийн санах ой."
  long: "Хэзээ ч зэрэг нээгддэггүй хоёр [[latch|latch]]-ээс бүтдэг (эзэн–дагагч). Clock edge-үүдийн хооронд оролтоо үл тоодог тул flip-flop-уудаас бүтсэн бүхэл компьютер нэг хэмнэлээр алхдаг."

- id: clock
  term: "Clock"
  short: "0 ба 1-ийн хооронд дахин дахин сэлгэж, flip-flop бүрд хэзээ дараагийн утгаа авахыг хэлдэг дохио."
  long: "0-ээс 1 рүү шилжих бүр нэг цохилт. Процессорын давтамж (жишээ нь 3 ГГц) нь секундэд хэдэн цохилт авдагийг илэрхийлнэ."

- id: clock-edge
  term: "Clock edge"
  short: "Clock өөрчлөгдөх агшин. Өсөх ирмэг нь 0-ээс 1 рүү, flip-flop-ууд хадгалах агшин."

- id: setup-time
  term: "Setup time"
  short: "Зөв утга хадгалагдахын тулд flip-flop-ын оролт clock edge-ээс өмнө хэр удаан тогтвортой байх ёстой хугацаа."
  long: "Оролт ирмэгт хэт ойр өөрчлөгдвөл flip-flop хуучин утгыг, шинэ утгыг, эсвэл хэсэг хугацаанд алийг нь ч биш хадгалж болно. Энэ хичээлийн шалгалтууд өсөх ирмэг бүрд оролтыг тогтвортой байлгадаг."

- id: register
  term: "Регистр"
  short: "Нэг тоо (энд 16 бит) хадгалдаг жижиг санах ой; ачаалах оролт нь 1 үед clock edge дээр бүхэлдээ зэрэг ачаалагдана."

- id: address
  term: "Хаяг"
  short: "Санах ойн аль үгийг унших эсвэл бичихийг заадаг тоо, гудамжны байшингийн дугаартай адил."

- id: ram
  term: "Шууд хандалтат санах ой (RAM)"
  short: "Тус бүр хаягтай олон регистр, аль ч үгийг бусадтай адил хурдан уншиж бичиж болно."
  long: "«Шууд хандалт» нь зөв байрлал хүртэл ороох шаардлагатай соронзон туузнаас ялгаатай нь аль ч хаяг руу шууд үсэрч болно гэсэн үг."

- id: program-counter
  term: "Програмын тоолуур"
  short: "Дараагийн зааврын хаягийг хадгалдаг регистр. Нэгээр нэмэгддэг, эсвэл хэлэхэд өөр хаяг руу үсэрдэг."

- id: waveform
  term: "Waveform"
  short: "Дохионуудыг цаг хугацааны дагуу харуулсан зураг: дохио бүр нэг мөр, цаг зүүнээс баруун тийш урсана. Timing diagram гэж бас нэрлэдэг."

- id: magnetic-core-memory
  term: "Соронзон цагирагт санах ой"
  short: "Утсанд сүвлэсэн бяцхан соронзон цагиргуудаас бүтсэн санах ой; цагираг бүр соронзлогдсон чиглэлээрээ нэг бит хадгална."
  long: "1950-аад оны дунд үеэс 1970-аад он хүртэл ихэнх компьютерийн үндсэн санах ой. Транзистор санах ойгоос ялгаатай нь цахилгаан тасарсан ч агуулгаа хадгалдаг байв."

- id: sram
  term: "SRAM"
  short: "Статик RAM: бит бүр нь ихэвчлэн зургаан транзистортой latch бөгөөд тэжээл байгаа цагт утгаа хадгална."
  long: "Хурдан боловч их зай эзэлдэг. Процессорууд үүнийг түр санах ойдоо (кэш) ашигладаг. Энэ хичээлд таны бүтээх RAM ч бас статик, flip-flop-уудаас бүтнэ."

- id: dram
  term: "DRAM"
  short: "Динамик RAM: бит бүр нь нэг транзистороор хамгаалагдсан бяцхан конденсатор дээрх цэнэг. Цэнэг алдагддаг тул байнга сэргээх шаардлагатай."
  long: "Нэг битэд ногдох зай [[SRAM|sram]]-аас хамаагүй бага тул компьютерийн үндсэн санах ойд хэрэглэдэг."

- id: capacitor
  term: "Конденсатор"
  short: "Тусгаарлагчаар зааглагдсан хоёр дамжуулагч; цахилгаан цэнэгийг бяцхан цэнэглэдэг хувин шиг хадгалдаг."

- id: instruction
  term: "Заавар"
  short: "Програмын нэг алхам: процессорын гүйцэтгэж чадах ганц тушаал, жишээ нь «эдгээр хоёр регистрийг нэм» эсвэл «тэг биш бол буцаж үсэр»."
  long: "Манай компьютерт заавар бүр нэг 16 битийн үг; түүний битүүд юу хийх, аль [[регистрүүдтэй|register]] гэдгийг хэлнэ."

- id: instruction-set
  term: "Instruction set (ISA)"
  short: "Процессорын ойлгодог бүх зааврын жагсаалт, тус бүр битээр яг хэрхэн бичигдэж, юу хийдэг нь."
  long: "Энэ бол техник хангамж ба програм хангамжийн гэрээ: [[төв процессор|processor]] амласнаа хийх ёстой, бүх програм үүн дээр бичигдэнэ. Манайх docs/ISA.md-д бий."

- id: machine-code
  term: "Машины код"
  short: "Процессорын уншдаг хэлбэрийн програм: зааврын үгс энгийн тоо хэлбэрээр."

- id: assembly-language
  term: "Ассемблер хэл"
  short: "Тооны оронд богино нэрээр, мөр бүрд нэг заавар бичсэн машины код, жишээ нь SET r1, 5."
  long: "Ассемблер үүнийг [[машины код|machine-code]] болгоно; та дараагийн бүлэгт нэгийг бичнэ."

- id: instruction-cycle
  term: "Fetch–decode–execute cycle"
  short: "Процессорын дахин дахин хийдэг зүйл: програмын тоолуур дээрх зааврыг уншиж, юу гэсэн үг болохыг тодорхойлж, гүйцэтгэнэ."
  long: "Манай төв процессор гурвыг нь нэг clock циклд хийнэ."

- id: control-unit
  term: "Control unit"
  short: "Зааврыг уншиж, удирдлагын бүх дохиог тохируулдаг төв процессорын хэсэг: аль регистрийг унших, ALU юу хийх, үр дүн хаашаа очих."

- id: datapath
  term: "Datapath"
  short: "Өгөгдлийг хадгалж, зөөдөг төв процессорын хэсгүүд: регистрүүд, ALU, shifter, тэдгээрийн хоорондох утас ба MUX-ууд."

- id: register-file
  term: "Register file"
  short: "Төв процессорын ерөнхий зориулалттай регистрүүдийн цуглуулга; нэг clock циклд хоёрыг нь уншиж, нэгийг бичих порттой."

- id: barrel-shifter
  term: "Barrel shifter"
  short: "Үгийн битүүдийг зүүн эсвэл баруун тийш хүссэн тоогоор нэг алхамд шилжүүлдэг хэлхээ; хоёрын зэрэг бүрд нэг шаттай."

- id: subroutine
  term: "Дэд програм"
  short: "Програмын хаанаас ч дуудаж болох, дуудсан газар руугаа буцдаг хэсэг."
  long: "Манай CALL буцах хаягийг r7-д ([[link register|link-register]]) хадгална; RET тэнд буцаж үсэрнэ."

- id: link-register
  term: "Link register"
  short: "Дуудах заавар буцах хаягаа хадгалдаг регистр. Манай төв процессорт энэ нь r7."

- id: harvard-architecture
  term: "Harvard architecture"
  short: "Програмаа өгөгдлөөс тусдаа санах ойд хадгалдаг компьютер; ингэснээр дараагийн зааврыг уншихын зэрэгцээ өгөгдөл уншиж бичиж чадна."
  long: "Програм ба өгөгдөл нэг санах ойг хуваалцдаг [[програмаа санах ойдоо хадгалах|stored-program]] загварын эсрэг."

- id: risc
  term: "RISC"
  short: "Reduced instruction set computer: олон регистр, энгийн, ижил хэмжээтэй заавартай, зөвхөн load ба store санах ойд хүрдэг загварын хэв маяг."

- id: memory-mapped-io
  term: "Memory-mapped I/O"
  short: "Дэлгэц, гар зэрэг төхөөрөмжид энгийн санах ойн хаягаар хандах: дэлгэцийн хаягт store хийвэл зурна, гарын хаягаас load хийвэл товч уншина."

- id: assembler
  term: "Ассемблер"
  short: "Ассемблер хэлийг машины код болгодог програм: нэр ба label оруулж, зааврын үгс гаргана."
  long: "Манайх хоёр давталтаар ажилладаг: эхнийх нь бүх зүйл хаана байрлах, [[label]] бүр юу гэсэн үг болохыг олж, хоёр дахь нь үгсийг бичнэ."

- id: label
  term: "Label"
  short: "Програмын хаягийн нэр, мөрийн өмнө `name:` гэж бичдэг; үсрэлт ба өгөгдөл түүнийг нэрээр нь заана."

- id: symbol-table
  term: "Symbol table"
  short: "Ассемблерийн бүх нэрийн (label эсвэл тогтмол) ба тэдгээрийн илэрхийлэх тооны жагсаалт."

- id: two-pass-assembler
  term: "Two-pass assembler"
  short: "Програмыг хоёр удаа уншдаг ассемблер: эхлээд label бүрийн хаягийг мэдэж, дараа нь тэдгээрийг ашигладаг зааврыг бичнэ."
  long: "Үсрэлт нь доор л гарч ирэх [[label]]-ийг заах тул хоёр давталт хэрэгтэй."

- id: pseudo-instruction
  term: "Pseudo-instruction"
  short: "Ассемблерийн хүлээн авдаг ч төв процессорт байхгүй тохиромжтой нэр; SET16, HALT шиг нэг эсвэл хэд хэдэн жинхэнэ заавар болно."

- id: directive
  term: "Directive"
  short: "Заавар болохын оронд ассемблерт ямар нэг зүйл хэлдэг мөр, жишээ нь `.equ` (тогтмол) эсвэл `.word` (өгөгдөл)."

- id: loader
  term: "Loader"
  short: "Програмыг ажиллахаас өмнө байранд нь тавьдаг зүйл: энд програмын өгөгдлийг RAM руу хуулна."

- id: virtual-machine
  term: "Виртуал машин"
  short: "Зөвхөн тодорхойлолт хэлбэрээр оршдог машин: түүний командуудыг interpreter гүйцэтгэх, эсвэл жинхэнэ төв процессорын заавар болгон хөрвүүлнэ."
  long: "Манайх бол дээд түвшний хэл ба ассемблерийн хоорондох [[stack machine|stack-machine]] (`docs/VM.md`)."

- id: stack
  term: "Stack"
  short: "Зөвхөн орой дээр нь нэмэх (push) эсвэл оройгоос нь авах (pop) боломжтой утгуудын овоо: хамгийн сүүлд орсон нь хамгийн түрүүнд гарна."

- id: stack-machine
  term: "Stack machine"
  short: "Заавар нь register нэрлэхийн оронд operand-уудаа stack-ийн оройгоос авч, үр дүнгээ push хийдэг машин."

- id: stack-pointer
  term: "Stack pointer"
  short: "Stack-ийн оройн хаягийг хадгалдаг регистр (SP); push нэг тийш, pop нөгөө тийш нь шилжүүлнэ."

- id: stack-frame
  term: "Stack frame"
  short: "Нэг функцийн дуудлагад хамаарах stack-ийн хэсэг: аргументууд, буцах хаяг, дуудагчийн frame pointer ба local хувьсагчид."

- id: calling-convention
  term: "Calling convention"
  short: "Дуудлага хэрхэн явагдах тухай тохиролцоо: аргумент ба үр дүн хаана очих, frame-д юу байх, функц аль регистрийг өөрчилж болох."

- id: recursion
  term: "Рекурс"
  short: "Функц өөрийгөө дуудах нь; дуудлага бүр өөрийн frame-тэй, жишээ нь factorial(n) = n × factorial(n − 1)."

- id: interpreter
  term: "Интерпретатор"
  short: "Өөр програмын командуудыг эхлээд машины код болгон хөрвүүлэхгүйгээр нэг нэгээр нь гүйцэтгэдэг програм."

- id: high-level-language
  term: "Дээд түвшний хэл"
  short: "Машины зааврын бус, бодлогын хэллэгээр (хувьсагч, илэрхийлэл, давталт, функц) бичдэг програмчлалын хэл."

- id: compiler
  term: "Хөрвүүлэгч"
  short: "Нэг хэл дээрх програмыг өөр, доод түвшний хэл рүү хөрвүүлдэг програм: энд C Shard-ыг VM код болгоно."

- id: token
  term: "Token"
  short: "Програмын бичвэрийн утгатай хамгийн жижиг хэсэг: нэр, тоо, түлхүүр үг эсвэл `<=` шиг тэмдэгт."

- id: syntax-tree
  term: "Syntax tree"
  short: "Програмыг мод хэлбэрээр: үйлдэл эсвэл statement бүр ажиллах хэсгүүдийнхээ дээр, тиймээс бүлэглэл нь тод харагдана."

- id: precedence
  term: "Үйлдлийн дараалал"
  short: "Аль үйлдэл түрүүлж бүлэглэх вэ: 2 + 3 * 4-д * нь +-ээс чанга тул хариу нь 14."

- id: recursive-descent
  term: "Recursive descent"
  short: "Дүрэм (эсвэл дарааллын түвшин) бүрд нэг функцтэй, тус бүр хэсгүүдийнхээ функцийг дууддаг parse хийх арга."

- id: type-checker
  term: "Type checker"
  short: "Код гаргахаас өмнө утга бүрийг төрлийнх нь зөвшөөрсөн ёсоор ашиглаж байгааг шалгадаг хөрвүүлэгчийн үе шат."

- id: short-circuit-evaluation
  term: "Short-circuit evaluation"
  short: "Эрт зогсох: `a and b`-д a худал бол b-г бодохгүй; `a or b`-д a үнэн бол бодохгүй."
