# Нэр томьёоны толь (монгол). id нь docs/glossary.yaml-тай ижил байх
# ёстой; `see` англи файлаас авна. Бүлгүүд [[харуулах үг|id]] хэлбэрээр
# холбоно. Нэр томьёоны сонголт: docs/mn/TERMS.md.

- id: computer
  term: "Компьютер"
  short: "Мэдээлэл хүлээн авч, хадгалж, зааврын жагсаалтын дагуу боловсруулж, үр дүнг гаргадаг машин."
  long: "Энэ хичээлийн компьютерууд [[ерөнхий зориулалттай|general-purpose]], [[програмчлах|program]] боломжтой бөгөөд програмаа бусад өгөгдлийн адил [[санах ой|memory]]-доо хадгалдаг ([[програмаа санах ойдоо хадгалах|stored-program]] санаа)."

- id: input
  term: "Оролт"
  short: "Компьютер руу орж буй мэдээлэл: товч дарах, мэдрэгчийн хэмжилт, файл гэх мэт."

- id: output
  term: "Гаралт"
  short: "Компьютерээс гарах үр дүн: дэлгэцийн цэг, дуу, тоо гэх мэт."

- id: memory
  term: "Санах ой"
  short: "Мэдээллийг дараа ашиглахаар хадгалдаг компьютерийн хэсэг."
  long: "Санах ой нь тус бүр нэг [[бит|bit]] хадгалдаг олон нүднээс бүтдэг. Та 3-р бүлэгт санах ойг [[логик хаалга|logic-gate]]-аас бүтээнэ."

- id: processor
  term: "Боловсруулагч (процессор)"
  short: "Зааврыг нэг нэгээр нь гүйцэтгэж, арифметик, харьцуулалт, шийдвэр гаргалт хийдэг компьютерийн хэсэг."
  long: "Төв процессор (CPU) гэж бас нэрлэдэг. Нэг чип дээр бүтээсэн боловсруулагчийг [[бичил процессор|microprocessor]] гэнэ."

- id: program
  term: "Програм"
  short: "Компьютерт юу хийхийг алхам алхмаар заадаг зааврын жагсаалт."

- id: algorithm
  term: "Алгоритм"
  short: "Асуудлыг шийдэх нарийн, алхам алхмаар бичсэн арга: дагахад ямар ч ухаан шаардахгүй байхаар бичигдсэн."

- id: general-purpose
  term: "Ерөнхий зориулалттай"
  short: "Ганц тогтсон ажил биш, өгсөн програмаасаа хамаарч олон өөр ажил хийж чаддаг."

- id: stored-program
  term: "Програмаа санах ойдоо хадгалдаг компьютер"
  short: "Програмаа өгөгдөлтэйгөө нэг санах ойд хадгалдаг компьютер: шинэ програм ачаалах нь шинэ өгөгдөл ачаалахтай адил хялбар."

- id: punched-card
  term: "Цоолбортой карт"
  short: "Тогтсон байрлалд нүх байгаа эсэхээр мэдээлэл тэмдэглэдэг хатуу карт."

- id: logarithm
  term: "Логарифм"
  short: "Тухайн утгыг гаргахын тулд суурь тоог хэдэн зэрэг дэвшүүлэхийг заах тоо; логарифм үржвэрийг нийлбэр болгодог."
  long: "log(a × b) = log(a) + log(b) учир [[гулсдаг шугам|slide-rule]] дээр хоёр уртыг нэмэхэд тэдгээрийн илэрхийлэх тоонууд үржигддэг."

- id: slide-rule
  term: "Гулсдаг шугам"
  short: "Бие биеэ дагуу гулсдаг логарифмын хуваарьтай шугам; хуваарийг тааруулж тоо үржүүлж, хуваадаг."

- id: analog
  term: "Аналог"
  short: "Хэмжигдэхүүнийг жигд өөрчлөгдөж болох зүйлээр илэрхийлэх: хүчдэл, тэнхлэгийн өнцөг, урт гэх мэт."

- id: digital
  term: "Цифрлэг"
  short: "Мэдээллийг цөөн тооны тодорхой утгаар, ихэвчлэн хоёрхон утгаар илэрхийлэх; ингэснээр жижиг алдааг засах боломжтой."

- id: bit
  term: "Бит"
  short: "Мэдээллийн хамгийн жижиг хэсэг: хоёр утгын нэгийг сонгох, 0 ба 1 гэж бичнэ."
  long: "Англиар «binary digit» (хоёртын орон)-ын товчлол. Хэлхээнд бит ихэвчлэн нам хүчдэл (0) эсвэл өндөр хүчдэл (1) байдаг."

- id: binary
  term: "Хоёртын тоолол"
  short: "Зөвхөн 0 ба 1 гэсэн хоёр цифрээр тоолох арга; орон бүр баруун талынхаасаа хоёр дахин их жинтэй."

- id: boolean-algebra
  term: "Булийн алгебр"
  short: "Утга бүр үнэн эсвэл худал (1 эсвэл 0) байх бөгөөд БА, ЭСВЭЛ, ҮГҮЙ үйлдлээр нийлдэг алгебр."

- id: logic-gate
  term: "Логик хаалга"
  short: "Битүүдийн энгийн функц (БА, ЭСВЭЛ, ҮГҮЙ гэх мэт) тооцдог жижиг хэлхээ."
  long: "Та анхны хаалгануудаа 1-р бүлэгт [[транзистор|transistor]]-оос бүтээнэ."

- id: turing-machine
  term: "Тьюрингийн машин"
  short: "Энгийн дүрмийн дагуу соронзон тууз дээр тэмдэгт уншиж, бичдэг төсөөллийн машин; алхам алхмаар хийгдэх ямар ч ажлыг гүйцэтгэж чадна."

- id: switch
  term: "Унтраалга"
  short: "Ямар нэг зүйлийг нэвтрүүлдэг (хаалттай, асаалттай) эсвэл хаадаг (нээлттэй, унтраалттай) төхөөрөмж."
  long: "Цифрлэг компьютер бүр бусад унтраалгыг удирддаг унтраалгуудаас бүтдэг. Тэд шүд араа, [[цахилгаан соронзон унтраалга|relay]], [[вакуум чийдэн|vacuum-tube]], [[транзистор|transistor]] байсаар ирсэн."

- id: relay
  term: "Цахилгаан соронзон унтраалга (реле)"
  short: "Цахилгаан соронзоор шилждэг унтраалга: ороомгоор гүйх гүйдэл төмөр контактыг татаж нээдэг эсвэл хаадаг."

- id: vacuum-tube
  term: "Вакуум чийдэн"
  short: "Битүү шилэн бүрхүүл дотор торон утсан дээрх хүчдэл вакуумаар урсах электроны урсгалыг удирддаг төхөөрөмж; хөдөлгөөнт хэсэггүй электрон унтраалга."

- id: transistor
  term: "Транзистор"
  short: "Хагас дамжуулагчаар хийсэн бяцхан электрон унтраалга: нэг гаргалгаан дээрх хүчдэл эсвэл гүйдэл нөгөө хоёрын хоорондох урсгалыг удирдана."

- id: semiconductor
  term: "Хагас дамжуулагч"
  short: "Цахилгаан дамжуулах чадвар нь металл ба тусгаарлагчийн хооронд байдаг, түүнийг нь удирдаж болдог материал: цахиур, германи гэх мэт."

- id: germanium
  term: "Германи"
  short: "Анхны транзисторуудад хэрэглэсэн хагас дамжуулагч элемент; эхэндээ цэвэршүүлэхэд хялбар байсан ч халахаараа гүйдэл алддаг, тогтвортой исэлгүй."

- id: silicon
  term: "Цахиур"
  short: "Өнөөгийн бараг бүх чипэнд хэрэглэдэг хагас дамжуулагч элемент; элс, чулуунд элбэг, гадаргуу дээрээ бат бөх тусгаарлагч исэл ургуулдаг."

- id: silicon-dioxide
  term: "Цахиурын давхар исэл"
  short: "Хүчилтөрөгчтэй нэгдсэн цахиур (SiO₂), кварц элсний үндсэн эрдэс; чип дээр түүний нимгэн үе маш сайн тусгаарлагч болдог."

- id: band-gap
  term: "Хориотой бүс"
  short: "Электрон чөлөөлөгдөж гүйдэл дамжуулахад шаардах энерги; энэ нь их байх тусам дулаанаар чөлөөлөгдөх электрон цөөн."
  long: "Электронвольтоор (эВ) хэмжинэ. Цахиурын хориотой бүс (ойролцоогоор 1.1 эВ) германийхаас (ойролцоогоор 0.66 эВ) их тул цахиур халахдаа хамаагүй бага гүйдэл алддаг."

- id: leakage-current
  term: "Алдагдлын гүйдэл"
  short: "Унтраалттай байх ёстой унтраалгаар урсах хүсээгүй гүйдэл."

- id: integrated-circuit
  term: "Нэгдмэл хэлхээ (интеграл схем)"
  short: "Олон транзистор, тэдгээрийн холболтыг нэг хагас дамжуулагч дээр хамт хийсэн бүтэн хэлхээ; чип."

- id: microprocessor
  term: "Бичил процессор"
  short: "Ганц нэгдмэл хэлхээ болгон бүтээсэн бүтэн боловсруулагч."

- id: moores-law
  term: "Мурын хууль"
  short: "Чип дээр багтах транзисторын тоо тогтмол хурдаар, 1975 оноос хойш ойролцоогоор хоёр жил тутам хоёр дахин өсдөг гэсэн Гордон Мурын ажиглалт."

- id: wafer
  term: "Ялтас"
  short: "Цахиурын нэг талстаас зүсэж өнгөлсөн нимгэн дугуй хавтан; дээр нь олон чипийг зэрэг бүтээдэг."

- id: polysilicon
  term: "Олон талст цахиур"
  short: "Олон жижиг талст нийлсэн маш цэвэр цахиур; нэг талст ургуулах түүхий эд."

- id: single-crystal
  term: "Нэг талст"
  short: "Атомууд нь бүхэлдээ тасралтгүй, нэг жигд хэв маягаар эгнэсэн хатуу бие."

- id: czochralski-process
  term: "Чохральскийн арга"
  short: "Жижиг үр талстыг хайлсан материалд дүрж, эргүүлэнгээ аажмаар дээш татаж нэг талст ургуулах арга."

- id: doping
  term: "Хольцлох"
  short: "Хагас дамжуулагчид өөр элементийн маш бага, хянагдсан хэмжээг нэмж илүү чөлөөт электрон эсвэл нүх өгөх."

- id: dopant
  term: "Хольц"
  short: "Хольцлох үед зориуд нэмдэг элемент, жишээ нь цахиурт фосфор (n-төрөл) эсвэл бор (p-төрөл)."

- id: electron
  term: "Электрон"
  short: "Сөрөг цэнэгтэй бяцхан бөөмс; утсаар гүйдэл дамжуулдаг нь хөдөлж буй электронууд."

- id: hole
  term: "Нүх"
  short: "Талстын холбоонд дутуу байгаа электрон; хөрш электронууд түүн рүү үсрэхэд эерэг цэнэг шиг хөдөлдөг."

- id: n-type
  term: "n-төрөл"
  short: "Илүү чөлөөт электронтой (сөрөг зөөгчтэй) болгож хольцолсон цахиур, жишээ нь фосфороор."

- id: p-type
  term: "p-төрөл"
  short: "Илүү нүхтэй (эерэг зөөгчтэй) болгож хольцолсон цахиур, жишээ нь бороор."

- id: p-n-junction
  term: "p-n шилжилт"
  short: "p-төрөл ба n-төрөл цахиур нийлэх зааг; гүйдлийг зөвхөн нэг чиглэлд амархан нэвтрүүлдэг."

- id: depletion-region
  term: "Хоосорсон муж"
  short: "p-n шилжилт дэх нимгэн бүс, энд электрон ба нүх хоорондоо устаж, гүйдэл дамжуулах чөлөөт зөөгч үлдээгүй."

- id: diode
  term: "Диод"
  short: "Гүйдлийг нэг чиглэлд нэвтрүүлж, нөгөө чиглэлд хаадаг төхөөрөмж; p-n шилжилт нь диод юм."

- id: forward-bias
  term: "Шууд хэвийлт"
  short: "p-n шилжилтэд хоосорсон мужийг нарийсгаж, гүйдэл урсгах чиглэлд өгсөн хүчдэл."

- id: reverse-bias
  term: "Урвуу хэвийлт"
  short: "p-n шилжилтэд хоосорсон мужийг өргөсгөж, гүйдлийг хаах чиглэлд өгсөн хүчдэл."

- id: mosfet
  term: "MOSFET"
  short: "Металл-исэл-хагас дамжуулагч талбайн транзистор; бараг бүх чипэнд байдаг, хаалтын хүчдэл сувгийг үүсгэж эсвэл арилгадаг."

- id: gate-terminal
  term: "Хаалт (транзисторын)"
  short: "MOSFET-ийн удирдах гаргалгаа; түүний хүчдэл унтраалга асаалттай эсвэл унтраалттай байхыг шийднэ."
  long: "Олон транзистороос бүтсэн бүтэн хэлхээ болох [[логик хаалга|logic-gate]]-тай андуурч болохгүй."

- id: source-and-drain
  term: "Эх ба цутгал"
  short: "MOSFET-ийн унтраалга холбож эсвэл салгадаг хоёр гаргалгаа; суваг байх үед гүйдэл тэдгээрийн хооронд урсдаг."

- id: channel
  term: "Суваг"
  short: "Хаалтын хүчдэл босгоос давахад MOSFET-ийн хаалтын доор үүсдэг гүйдэл дамжуулах нимгэн үе."

- id: threshold-voltage
  term: "Босго хүчдэл"
  short: "MOSFET-ийн суваг үүсэж, транзистор асдаг хаалтын хүчдэл."

- id: nmos
  term: "NMOS"
  short: "n-сувагтай MOSFET; хаалт нь өндөр (1) үед асдаг."

- id: pmos
  term: "PMOS"
  short: "p-сувагтай MOSFET; хаалт нь нам (0) үед асдаг, NMOS-ийн эсрэг."

- id: cmos
  term: "CMOS"
  short: "Нөхөх MOS: NMOS ба PMOS транзисторын хос бүрээс бүтсэн логик; хос бүрийн нэг нь унтарсан байх тул сул зогсох үед бараг гүйдэл урсдаггүй."

- id: voltage
  term: "Хүчдэл"
  short: "Хоёр цэгийн хоорондох цахилгаан «түлхэлт», вольтоор (В) хэмжинэ; хоолой дахь усны даралттай адил."

- id: current
  term: "Гүйдэл"
  short: "Нэг секундэд тухайн цэгээр өнгөрөх цахилгаан цэнэгийн хэмжээ, ампераар (А) хэмжинэ."

- id: noise
  term: "Шуугиан"
  short: "Дулаан, саад, хөрш утаснаас дохионд нэмэгдэх хүсээгүй санамсаргүй жижиг өөрчлөлт."

- id: logic-level
  term: "Логик түвшин"
  short: "Хэлхээ 0 эсвэл 1 гэж уншдаг хүчдэлийн муж."

- id: noise-margin
  term: "Шуугианы нөөц"
  short: "Хүчинтэй 0 эсвэл 1 хэр их шуугиан авч ч дараагийн шатанд зөв уншигдах вэ гэдэг хэмжээ."

- id: transfer-curve
  term: "Дамжуулах муруй"
  short: "Хэлхээний гаралтын хүчдэлийг оролтын хүчдэлээс хамааруулсан график; эгц S хэлбэр нь цифрлэг логикт дохиог сэргээх боломж олгодог."

- id: series-and-parallel
  term: "Цуваа ба зэрэгцээ"
  short: "Цуваа холбосон унтраалгууд нэг нэгнийхээ араас байрлах тул гүйдэл урсахад бүгд хаалттай байх ёстой (БА); зэрэгцээ холбосон бол хажуу хажуудаа байх тул аль нэг нь хангалттай (ЭСВЭЛ)."

- id: truth-table
  term: "Үнэний хүснэгт"
  short: "Хэлхээний оролтуудын бүх хослол, тус бүрд өгөх ёстой гаралтыг жагсаасан хүснэгт."

- id: pull-up-network
  term: "Дээш татах сүлжээ"
  short: "CMOS хаалганы зөв оролтуудын үед гаралтыг VDD-тэй холбож (1 болгодог) PMOS транзисторууд."

- id: pull-down-network
  term: "Доош татах сүлжээ"
  short: "CMOS хаалганы зөв оролтуудын үед гаралтыг GND-тэй холбож (0 болгодог) NMOS транзисторууд."

- id: floating
  term: "Хөвөгч"
  short: "VDD эсвэл GND-тэй юу ч холбоогүй утас, утга нь тодорхойгүй; загварчлагч үүнийг Z гэж харуулна."

- id: short-circuit
  term: "Богино холбоо"
  short: "Асаалттай унтраалгуудаар дамжин VDD-ээс GND руу шууд үүсэх зам; эрчим хүч үрж, чипийг халааж, гаралтыг урьдчилан таамаглах боломжгүй (X) болгоно."

- id: universal-gate
  term: "Бүх нийтийн хаалга"
  short: "Бусад бүх логик функцийг түүнээс бүтээж болох хаалга; NAND ба NOR хоёулаа бүх нийтийнх."

- id: abstraction
  term: "Хийсвэрлэл"
  short: "Аливаа зүйлийн дотоод ажиллагааг нууж, юу хийдгээр нь ашиглах: NAND тань шалгалтыг давмагц та түүнийг дөрвөн транзистор биш, NAND хайрцаг гэж хардаг."

- id: gate-delay
  term: "Хаалганы саатал"
  short: "Оролт өөрчлөгдсөний дараа хаалга гаралтаа шинэчлэхэд зарцуулах богино хугацаа; загварчлагч үүнийг алхмаар тоолно."

- id: multiplexer
  term: "Сонгогч (MUX)"
  short: "Сонголтын битүүдээр заасан нэг оролтыг сонгож гаралт руу дамжуулдаг хэлхээ."

- id: demultiplexer
  term: "Хуваарилагч (DMUX)"
  short: "Нэг оролтыг сонголтын битүүдээр заасан нэг гаралт руу илгээдэг хэлхээ; бусад гаралт 0 хэвээр."

- id: bus
  term: "Шугам (олон битийн)"
  short: "Нэг тоог хамтдаа дамжуулдаг утасны багц, утас бүрд нэг бит; засварлагч үүнийг нэг зузаан утсаар зурдаг."

- id: splitter-and-joiner
  term: "Салаалагч ба нийлүүлэгч"
  short: "Салаалагч шугамыг нэг битийн утсуудад салгадаг (0-р бит нь хамгийн бага жинтэй); нийлүүлэгч нэг битүүдийг буцааж шугам болгодог."

- id: half-adder
  term: "Хагас нэмэгч"
  short: "Хоёр битийг нэмж, нийлбэрийн бит ба шилжүүлгийн бит гаргадаг хэлхээ."

- id: full-adder
  term: "Бүтэн нэмэгч"
  short: "Гурван битийг (хоёр цифр ба орж ирэх шилжүүлэг) нэмж, нийлбэрийн бит ба гарах шилжүүлэг гаргадаг хэлхээ: нэмэх үйлдлийн нэг багана."

- id: carry
  term: "Шилжүүлэг"
  short: "Баганын нийлбэр нэг цифрт багтахгүй үед дараагийн багана руу шилжүүлэх нэмэлт 1."

- id: ripple-carry-adder
  term: "Дамжих шилжүүлэгтэй нэмэгч"
  short: "Гинжилсэн бүтэн нэмэгчүүдээс бүтсэн нэмэгч, багана бүрийн шилжүүлэг дараагийнх руу ордог; энгийн боловч шилжүүлэг бүх баганыг дамжих шаардлагатай байж болно."

- id: twos-complement
  term: "Хоёрын гүйцээлт"
  short: "Компьютерууд сөрөг тоог хадгалдаг ердийн арга: −x-ийг NOT x + 1 гэж хадгалдаг тул нэг нэмэгч эерэг, сөрөг аль ч тоог боловсруулна."

- id: fast-model
  term: "Хурдан загвар"
  short: "Таны зохиосон бүрэлдэхүүний бэлэн, хурдан хувилбар; тохирлын шалгалтаар хоёулаа адил ажилладаг нь батлагдсаны дараа таны хаалгануудын оронд ашиглагдана."

- id: alu
  term: "Арифметик-логикийн нэгж (АЛН)"
  short: "Төв процессорын тооцоолдог хэсэг: хэдэн удирдах оролтоор үйлдлээ сонгож, нэмж, хасаж, битүүдийг нийлүүлдэг."

- id: flags
  term: "Төлөвийн туг"
  short: "АЛН-ийн үр дүнгийн тухай нэг битийн баримтууд (тэг үү? сөрөг үү? шилжүүлэг гарсан уу?); төв процессор дараа нь юу хийхээ эдгээрээр шийддэг."

- id: sequential-circuit
  term: "Дараалсан хэлхээ"
  short: "Гаралт нь зөвхөн одоогийн оролтоос бус, өмнө нь болсон зүйлээс хамаардаг хэлхээ: санах ойтой."
  long: "Хослолын хэлхээний эсрэг. Дараалсан хэлхээг [[эргэх холбоо|feedback]]-оор бүтээдэг бөгөөд ихэнхийг нь [[цагийн дохио|clock]] удирддаг."

- id: feedback
  term: "Эргэх холбоо"
  short: "Хэлхээний гаралтыг өөрийнх нь оролт руу буцааж холбох; ингэснээр дараа юу хийх нь одоо юу хийж байгаагаас хамаарна."
  long: "Эргэх холбоо нь [[түгжээ|latch]]-нд санах чадвар өгдөг. Мөн хэлхээг үүрд сэлгэсээр хэлбэлзэх болгож болно."

- id: latch
  term: "Түгжээ"
  short: "Хамгийн энгийн санах ой: бие биеэ тэжээдэг хоёр хаалга, тэднийг тохируулсан дохио алга болсны дараа ч нэг бит хадгалдаг."
  long: "SR түгжээ нь тохируулах (s) ба арилгах (r) оролттой. D түгжээ нь нэг өгөгдлийн оролттой: идэвхжүүлэх оролт 1 үед түүнийг хуулж, 0 үед хадгалдаг."

- id: flip-flop
  term: "Сэлгүүр"
  short: "Цагийн дохио 0-ээс 1 болох агшинд л өөрчлөгддөг нэг битийн санах ой."
  long: "Хэзээ ч зэрэг нээгддэггүй хоёр [[түгжээ|latch]]-нээс бүтдэг (эзэн–дагагч). Цагийн ирмэгүүдийн хооронд оролтоо үл тоодог тул сэлгүүрүүдээс бүтсэн бүхэл компьютер нэг хэмнэлээр алхдаг."

- id: clock
  term: "Цагийн дохио"
  short: "0 ба 1-ийн хооронд дахин дахин сэлгэж, сэлгүүр бүрд хэзээ дараагийн утгаа авахыг хэлдэг дохио."
  long: "0-ээс 1 рүү шилжих бүр нэг цохилт. Процессорын давтамж (жишээ нь 3 ГГц) нь секундэд хэдэн цохилт авдагийг илэрхийлнэ."

- id: clock-edge
  term: "Цагийн дохионы ирмэг"
  short: "Цагийн дохио өөрчлөгдөх агшин. Өсөх ирмэг нь 0-ээс 1 рүү, сэлгүүрүүд хадгалах агшин."

- id: setup-time
  term: "Бэлтгэх хугацаа"
  short: "Зөв утга хадгалагдахын тулд сэлгүүрийн оролт цагийн ирмэгээс өмнө хэр удаан тогтвортой байх ёстой хугацаа."
  long: "Оролт ирмэгт хэт ойр өөрчлөгдвөл сэлгүүр хуучин утгыг, шинэ утгыг, эсвэл хэсэг хугацаанд алийг нь ч биш хадгалж болно. Энэ хичээлийн шалгалтууд өсөх ирмэг бүрд оролтыг тогтвортой байлгадаг."

- id: register
  term: "Хадгалуур (регистр)"
  short: "Нэг тоо (энд 16 бит) хадгалдаг жижиг санах ой; ачаалах оролт нь 1 үед цагийн ирмэг дээр бүхэлдээ зэрэг ачаалагдана."

- id: address
  term: "Хаяг"
  short: "Санах ойн аль үгийг унших эсвэл бичихийг заадаг тоо, гудамжны байшингийн дугаартай адил."

- id: ram
  term: "Шууд хандалтат санах ой (RAM)"
  short: "Тус бүр хаягтай олон хадгалуур, аль ч үгийг бусадтай адил хурдан уншиж бичиж болно."
  long: "«Шууд хандалт» нь зөв байрлал хүртэл ороох шаардлагатай соронзон туузнаас ялгаатай нь аль ч хаяг руу шууд үсэрч болно гэсэн үг."

- id: program-counter
  term: "Програмын тоолуур"
  short: "Дараагийн зааврын хаягийг хадгалдаг хадгалуур. Нэгээр нэмэгддэг, эсвэл хэлэхэд өөр хаяг руу үсэрдэг."

- id: waveform
  term: "Долгионы зураглал"
  short: "Дохионуудыг цаг хугацааны дагуу харуулсан зураг: дохио бүр нэг мөр, цаг зүүнээс баруун тийш урсана. Цагийн диаграм гэж бас нэрлэдэг."

- id: magnetic-core-memory
  term: "Соронзон цагирагт санах ой"
  short: "Утсанд сүвлэсэн бяцхан соронзон цагиргуудаас бүтсэн санах ой; цагираг бүр соронзлогдсон чиглэлээрээ нэг бит хадгална."
  long: "1950-аад оны дунд үеэс 1970-аад он хүртэл ихэнх компьютерийн үндсэн санах ой. Транзистор санах ойгоос ялгаатай нь цахилгаан тасарсан ч агуулгаа хадгалдаг байв."

- id: sram
  term: "SRAM"
  short: "Статик RAM: бит бүр нь ихэвчлэн зургаан транзистортой түгжээ бөгөөд тэжээл байгаа цагт утгаа хадгална."
  long: "Хурдан боловч их зай эзэлдэг. Процессорууд үүнийг түр санах ойдоо (кэш) ашигладаг. Энэ хичээлд таны бүтээх RAM ч бас статик, сэлгүүрүүдээс бүтнэ."

- id: dram
  term: "DRAM"
  short: "Динамик RAM: бит бүр нь нэг транзистороор хамгаалагдсан бяцхан цэнэг хураагуур дээрх цэнэг. Цэнэг алдагддаг тул байнга сэргээх шаардлагатай."
  long: "Нэг битэд ногдох зай [[SRAM|sram]]-аас хамаагүй бага тул компьютерийн үндсэн санах ойд хэрэглэдэг."

- id: capacitor
  term: "Цэнэг хураагуур (конденсатор)"
  short: "Тусгаарлагчаар зааглагдсан хоёр дамжуулагч; цахилгаан цэнэгийг бяцхан цэнэглэдэг хувин шиг хадгалдаг."
