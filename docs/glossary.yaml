# Glossary. Chapters link terms with [[term]] or [[shown text|id]].
# `short` is one plain-language sentence (shown in hover cards);
# `long` adds precision. Both may link other terms.

- id: computer
  term: "Computer"
  short: "A machine that takes in information, stores it, transforms it by following a list of instructions, and gives back results."
  long: "The computers in this course are [[general-purpose|general-purpose]] and [[programmable|program]], and they keep their program in [[memory]] like any other data (the [[stored-program|stored-program]] idea)."
  see: [program, stored-program]

- id: input
  term: "Input"
  short: "Information going into a computer, such as key presses, sensor readings or a file."
  see: [output]

- id: output
  term: "Output"
  short: "Results coming out of a computer, such as pixels on a screen, sound, or a number."
  see: [input]

- id: memory
  term: "Memory"
  short: "The part of a computer that holds information so it can be used later."
  long: "Memory is built from many cells that each hold one [[bit]]. You will build memory from [[logic gates|logic-gate]] in Chapter 3."

- id: processor
  term: "Processor"
  short: "The part of a computer that carries out instructions one after another, doing arithmetic, comparisons and decisions."
  long: "Also called the CPU (central processing unit). A processor on a single chip is a [[microprocessor]]."
  see: [microprocessor]

- id: program
  term: "Program"
  short: "A list of instructions that tells a computer what to do, step by step."
  see: [algorithm, stored-program]

- id: algorithm
  term: "Algorithm"
  short: "A precise, step-by-step method for solving a problem, written so that following it needs no cleverness."

- id: general-purpose
  term: "General-purpose"
  short: "Able to do many different jobs, depending on the program it is given, rather than one fixed job."

- id: stored-program
  term: "Stored-program computer"
  short: "A computer that keeps its program in the same memory as its data, so a new program can be loaded as easily as new data."
  see: [program, memory]

- id: punched-card
  term: "Punched card"
  short: "A stiff card where the presence or absence of holes in set positions records information."

- id: logarithm
  term: "Logarithm"
  short: "The power you must raise a base number to in order to get a value; logarithms turn multiplication into addition."
  long: "Because log(a × b) = log(a) + log(b), adding two lengths on a [[slide rule]] multiplies the numbers they stand for."

- id: slide-rule
  term: "Slide rule"
  short: "A ruler with logarithmic scales that slide against each other; lining them up multiplies or divides numbers."
  see: [logarithm]

- id: analog
  term: "Analog"
  short: "Representing a quantity by something that can vary smoothly, like a voltage, a shaft angle or a length."
  see: [digital]

- id: digital
  term: "Digital"
  short: "Representing information with a small set of distinct values, usually just two, so small errors can be corrected."
  see: [analog, bit]

- id: bit
  term: "Bit"
  short: "The smallest piece of information, a single choice between two values, written 0 and 1."
  long: 'Short for "binary digit". In a circuit a bit is usually a low voltage (0) or a high voltage (1).'
  see: [binary, logic-level]

- id: binary
  term: "Binary"
  short: "Counting with only two digits, 0 and 1; each place is worth twice the one to its right."

- id: boolean-algebra
  term: "Boolean algebra"
  short: "Algebra where every value is true or false (1 or 0), combined with AND, OR and NOT."
  see: [logic-gate]

- id: logic-gate
  term: "Logic gate"
  short: "A small circuit that computes a simple function of bits, such as AND, OR or NOT."
  long: "You will build your first gates from [[transistors|transistor]] in Chapter 1."
  see: [boolean-algebra]

- id: turing-machine
  term: "Turing machine"
  short: "An imaginary machine that reads and writes symbols on a tape by following simple rules; it can carry out any step-by-step procedure."

- id: switch
  term: "Switch"
  short: "A device that either lets something flow (closed, on) or blocks it (open, off)."
  long: "Every digital computer is built from switches that control other switches. They have been gears, [[relays|relay]], [[vacuum tubes|vacuum-tube]] and [[transistors|transistor]]."

- id: relay
  term: "Relay"
  short: "A switch flipped by an electromagnet: current in a coil pulls a metal contact open or closed."

- id: vacuum-tube
  term: "Vacuum tube"
  short: "A sealed glass tube in which a voltage on a wire grid controls a flow of electrons through a vacuum; an electronic switch with no moving parts."

- id: transistor
  term: "Transistor"
  short: "A tiny electronic switch made of a semiconductor: a voltage or current on one terminal controls the flow between two others."
  see: [mosfet]

- id: semiconductor
  term: "Semiconductor"
  short: "A material, like silicon or germanium, whose ability to conduct electricity sits between a metal and an insulator and can be controlled."
  see: [doping, band-gap]

- id: germanium
  term: "Germanium"
  short: "A semiconductor element used in the first transistors; easier to purify early on, but leaky when warm and without a stable oxide."
  see: [silicon]

- id: silicon
  term: "Silicon"
  short: "The semiconductor element used in almost all chips today; abundant in sand and rock, and it grows a tough insulating oxide."
  see: [germanium, silicon-dioxide]

- id: silicon-dioxide
  term: "Silicon dioxide"
  short: "Silicon combined with oxygen (SiO₂), the main mineral in quartz sand; on a chip, a thin layer of it is an excellent insulator."

- id: band-gap
  term: "Band gap"
  short: "The energy an electron needs to break free and conduct; a bigger gap means fewer electrons freed by heat alone."
  long: "Measured in electronvolts (eV). Silicon's gap (about 1.1 eV) is larger than germanium's (about 0.66 eV), so silicon leaks far less current when warm."

- id: leakage-current
  term: "Leakage current"
  short: "Unwanted current that flows through a switch that is supposed to be off."

- id: integrated-circuit
  term: "Integrated circuit"
  short: "A complete circuit, many transistors and their wiring, made together on one piece of semiconductor; a chip."

- id: microprocessor
  term: "Microprocessor"
  short: "A whole processor built as a single integrated circuit."
  see: [processor, integrated-circuit]

- id: moores-law
  term: "Moore's law"
  short: "Gordon Moore's observation that the number of transistors that fit on a chip doubled at a steady rate, about every two years since 1975."

- id: wafer
  term: "Wafer"
  short: "A thin, polished disc sliced from a single crystal of silicon, on which many chips are built at once."

- id: polysilicon
  term: "Polysilicon"
  short: "Very pure silicon made of many small crystals stuck together, the raw material for growing a single crystal."

- id: single-crystal
  term: "Single crystal"
  short: "A solid in which the atoms are lined up in one unbroken, regular pattern all the way through."

- id: czochralski-process
  term: "Czochralski process"
  short: "Growing a single crystal by dipping a small seed crystal into molten material and slowly pulling it up while turning."

- id: doping
  term: "Doping"
  short: "Adding a tiny, controlled amount of another element to a semiconductor to give it extra free electrons or extra holes."
  see: [n-type, p-type]

- id: dopant
  term: "Dopant"
  short: "An element added on purpose during doping, such as phosphorus (n-type) or boron (p-type) in silicon."

- id: electron
  term: "Electron"
  short: "A tiny particle with negative charge; moving electrons are what carry current in a wire."

- id: hole
  term: "Hole"
  short: "A missing electron in a crystal's bonds; it moves like a positive charge as neighbouring electrons hop into it."

- id: n-type
  term: "n-type"
  short: "Silicon doped to have extra free electrons (negative carriers), for example with phosphorus."

- id: p-type
  term: "p-type"
  short: "Silicon doped to have extra holes (positive carriers), for example with boron."

- id: p-n-junction
  term: "p-n junction"
  short: "The boundary where p-type and n-type silicon meet; it lets current through easily in one direction only."
  see: [depletion-region, diode]

- id: depletion-region
  term: "Depletion region"
  short: "A thin zone at a p-n junction where electrons and holes have cancelled out, leaving no free carriers to conduct."

- id: diode
  term: "Diode"
  short: "A device that lets current flow in one direction but not the other; a p-n junction is one."

- id: forward-bias
  term: "Forward bias"
  short: "Voltage applied across a p-n junction in the direction that shrinks the depletion region and lets current flow."

- id: reverse-bias
  term: "Reverse bias"
  short: "Voltage applied across a p-n junction in the direction that widens the depletion region and blocks current."

- id: mosfet
  term: "MOSFET"
  short: "Metal-oxide-semiconductor field-effect transistor, the transistor in almost every chip, where gate voltage creates or removes a channel."
  see: [nmos, pmos, gate-terminal]

- id: gate-terminal
  term: "Gate (of a transistor)"
  short: "The control terminal of a MOSFET; its voltage decides whether the switch is on or off."
  long: "Not to be confused with a [[logic gate|logic-gate]], which is a whole circuit built from several transistors."

- id: source-and-drain
  term: "Source and drain"
  short: "The two terminals of a MOSFET that the switch connects or disconnects; current flows between them when the channel exists."

- id: channel
  term: "Channel"
  short: "A thin conducting layer that forms under a MOSFET's gate when the gate voltage is past the threshold."

- id: threshold-voltage
  term: "Threshold voltage"
  short: "The gate voltage at which a MOSFET's channel forms and the transistor switches on."

- id: nmos
  term: "NMOS"
  short: "An n-channel MOSFET; it turns on when its gate is high."
  see: [pmos, cmos]

- id: pmos
  term: "PMOS"
  short: "A p-channel MOSFET; it turns on when its gate is low, the opposite of NMOS."
  see: [nmos, cmos]

- id: cmos
  term: "CMOS"
  short: "Complementary MOS, logic built from matched pairs of NMOS and PMOS transistors, so that one of each pair is off and almost no current flows while idle."
  see: [nmos, pmos]

- id: voltage
  term: "Voltage"
  short: 'The electrical "push" between two points, measured in volts (V); like water pressure in a pipe.'

- id: current
  term: "Current"
  short: "The amount of electric charge flowing past a point each second, measured in amperes (A)."

- id: noise
  term: "Noise"
  short: "Small unwanted random changes added to a signal, from heat, interference or neighbouring wires."

- id: logic-level
  term: "Logic level"
  short: "The range of voltages a circuit reads as 0 or as 1."
  see: [noise-margin]

- id: noise-margin
  term: "Noise margin"
  short: "How much noise a valid 0 or 1 can pick up and still be read correctly by the next stage."
  see: [logic-level, transfer-curve]

- id: transfer-curve
  term: "Transfer curve"
  short: "A graph of a circuit's output voltage against its input voltage; a steep S-shape is what makes digital logic restore signals."

- id: series-and-parallel
  term: "Series and parallel"
  short: "Switches in series sit one after another, so all must be closed for current to flow (AND); in parallel they sit side by side, so any one is enough (OR)."

- id: truth-table
  term: "Truth table"
  short: "A table listing every combination of a circuit's inputs and the output it should give for each."

- id: pull-up-network
  term: "Pull-up network"
  short: "The PMOS transistors in a CMOS gate that connect the output to VDD (making it 1) for the right inputs."
  see: [pull-down-network, cmos]

- id: pull-down-network
  term: "Pull-down network"
  short: "The NMOS transistors in a CMOS gate that connect the output to GND (making it 0) for the right inputs."
  see: [pull-up-network, cmos]

- id: floating
  term: "Floating"
  short: "A wire that nothing connects to VDD or GND, so its value is undefined; the simulator shows it as Z."

- id: short-circuit
  term: "Short circuit"
  short: "A path straight from VDD to GND through switches that are on; it wastes power, heats the chip, and the output is unpredictable (X)."

- id: universal-gate
  term: "Universal gate"
  short: "A gate from which every other logic function can be built; NAND and NOR are both universal."

- id: abstraction
  term: "Abstraction"
  short: "Hiding how something works inside so you can use it by what it does: once your NAND passes, you treat it as a NAND box, not four transistors."

- id: gate-delay
  term: "Gate delay"
  short: "The short time a gate takes to update its output after an input changes; the simulator counts it in steps."

- id: multiplexer
  term: "Multiplexer (MUX)"
  short: "A circuit that picks one of several inputs and passes it to the output, chosen by select bits."
  see: [demultiplexer]

- id: demultiplexer
  term: "Demultiplexer (DMUX)"
  short: "A circuit that sends one input to one of several outputs, chosen by select bits; the others stay 0."
  see: [multiplexer]

- id: bus
  term: "Bus"
  short: "A bundle of wires that together carry one number, one bit per wire; the editor draws it as one thick wire."

- id: splitter-and-joiner
  term: "Splitter and joiner"
  short: "A splitter separates a bus into single-bit wires (bit 0 is the least significant); a joiner gathers single bits back into a bus."
  see: [bus]

- id: half-adder
  term: "Half adder"
  short: "A circuit that adds two bits, giving a sum bit and a carry bit."
  see: [full-adder]

- id: full-adder
  term: "Full adder"
  short: "A circuit that adds three bits (two digits and a carry in), giving a sum bit and a carry out: one column of addition."
  see: [half-adder, carry]

- id: carry
  term: "Carry"
  short: "The extra 1 passed to the next column when a column's sum is too big for one digit."

- id: ripple-carry-adder
  term: "Ripple-carry adder"
  short: "An adder made of full adders in a chain, each column's carry feeding the next; simple, but the carry may have to pass through every column."
  see: [carry, gate-delay]

- id: twos-complement
  term: "Two's complement"
  short: "The usual way computers store negative numbers: −x is stored as NOT x + 1, so the same adder handles positive and negative numbers."

- id: fast-model
  term: "Fast model"
  short: "A built-in, quick version of a component you designed, used instead of your gates once a match check shows the two behave the same."
  see: [abstraction]

- id: alu
  term: "ALU (arithmetic logic unit)"
  short: "The part of a CPU that calculates: it adds, subtracts and combines bits, choosing the operation from a few control inputs."

- id: flags
  term: "Flags"
  short: "Single-bit facts about an ALU result (is it zero? negative? was there a carry?) that the CPU uses to decide what to do next."
  see: [alu]

# ---- Chapter 3: memory -------------------------------------------------------------

- id: sequential-circuit
  term: "Sequential circuit"
  short: "A circuit whose outputs depend on what happened before, not just on its inputs right now: it has memory."
  long: "The opposite of a combinational circuit. Sequential circuits are built with [[feedback]], and most are driven by a [[clock]]."
  see: [feedback, latch, flip-flop]

- id: feedback
  term: "Feedback"
  short: "Wiring a circuit's output back into its own input, so what it does next depends on what it is doing now."
  long: "Feedback is what lets a [[latch]] remember. It can also make a circuit oscillate, flipping forever."
  see: [latch]

- id: latch
  term: "Latch"
  short: "The simplest memory: two gates feeding each other, which hold one bit after the signal that set it has gone."
  long: "An SR latch has set and reset inputs. A D latch has one data input that it copies while its enable is 1 and holds while enable is 0."
  see: [feedback, flip-flop]

- id: flip-flop
  term: "Flip-flop"
  short: "A one-bit memory that changes only at the moment its clock rises from 0 to 1."
  long: "Built from two [[latches|latch]] that are never open at the same time (master–slave). Because it ignores its input between clock edges, a whole computer of flip-flops moves in lockstep."
  see: [latch, clock, clock-edge]

- id: clock
  term: "Clock"
  short: "A signal that switches between 0 and 1 over and over, telling every flip-flop when to take its next value."
  long: "Each 0-to-1 transition is a tick. A processor's clock speed (say, 3 GHz) is how many ticks it gets per second."
  see: [clock-edge, flip-flop]

- id: clock-edge
  term: "Clock edge"
  short: "The instant the clock changes. A rising edge is 0 to 1, the moment flip-flops store."
  see: [clock, setup-time]

- id: setup-time
  term: "Setup time"
  short: "How long a flip-flop's input must stay steady before the clock edge so the right value is stored."
  long: "If the input changes too close to the edge, the flip-flop may store the old value, the new one, or briefly neither. The tests in this course keep inputs steady at every rising edge."
  see: [clock-edge]

- id: register
  term: "Register"
  short: "A small memory holding one number (here, 16 bits), loaded all at once on a clock edge when its load input is 1."
  see: [flip-flop, ram]

- id: address
  term: "Address"
  short: "A number saying which word of memory to read or write, like a house number on a street."
  see: [ram]

- id: ram
  term: "RAM"
  short: "Random-access memory: many registers, each with an address, where any word can be read or written as quickly as any other."
  long: '"Random access" means you can jump straight to any address, unlike a tape that must be wound to the right place.'
  see: [address, register, sram, dram]

- id: program-counter
  term: "Program counter"
  short: "The register holding the address of the next instruction. It counts up by one, or jumps when told to."
  see: [register]

- id: waveform
  term: "Waveform"
  short: "A picture of signals over time: one row per signal, time running left to right. Also called a timing diagram."

- id: magnetic-core-memory
  term: "Magnetic-core memory"
  short: "Memory made of tiny magnetic rings threaded on wires, each ring storing one bit in the direction it's magnetized."
  long: "The main memory of most computers from the mid-1950s to the 1970s. Unlike transistor memory, it kept its contents with the power off."
  see: [ram, dram]

- id: sram
  term: "SRAM"
  short: "Static RAM: each bit is a latch, usually six transistors, which holds its value as long as there is power."
  long: "Fast but large. Processors use it for their caches. The RAM you build in this course is static too, made of flip-flops."
  see: [dram, latch]

- id: dram
  term: "DRAM"
  short: "Dynamic RAM: each bit is a charge on a tiny capacitor, guarded by one transistor. It must be refreshed constantly because the charge leaks away."
  long: "Much smaller per bit than [[SRAM|sram]], so it's used for a computer's main memory."
  see: [sram, capacitor]

- id: capacitor
  term: "Capacitor"
  short: "Two conductors separated by an insulator, which hold electric charge, like a tiny rechargeable bucket."
  see: [dram]

- id: instruction
  term: "Instruction"
  short: 'One step of a program: a single command the processor can carry out, like "add these two registers" or "jump back if not zero".'
  long: "In our computer every instruction is one 16-bit word; its bits say what to do and with which [[registers|register]]."
  see: [instruction-set, machine-code]

- id: instruction-set
  term: "Instruction set (ISA)"
  short: "The full list of instructions a processor understands, and exactly how each is written in bits and what it does."
  long: "It is the contract between hardware and software: the [[CPU|processor]] must do what it promises, and every program is written in it. Ours is in docs/ISA.md."
  see: [instruction, assembly-language]

- id: machine-code
  term: "Machine code"
  short: "A program as the processor reads it: the instruction words as plain numbers."
  see: [assembly-language]

- id: assembly-language
  term: "Assembly language"
  short: "Machine code written with short names instead of numbers, one line per instruction, like SET r1, 5."
  long: "An assembler turns it into [[machine code|machine-code]]; you'll write one in the next chapter."
  see: [machine-code, instruction]

- id: instruction-cycle
  term: "Fetch–decode–execute cycle"
  short: "What a processor does over and over: read the instruction at the program counter, work out what it means, and carry it out."
  long: "Our CPU does all three in a single clock cycle."
  see: [program-counter, control-unit]

- id: control-unit
  term: "Control unit"
  short: "The part of a CPU that reads an instruction and sets every control signal: which registers to read, what the ALU does, where the result goes."
  see: [datapath, instruction]

- id: datapath
  term: "Datapath"
  short: "The parts of a CPU that hold and move the data: registers, ALU, shifter and the wires and multiplexers between them."
  see: [control-unit, register-file]

- id: register-file
  term: "Register file"
  short: "A CPU's set of general-purpose registers, with ports to read two of them and write one in the same clock cycle."
  see: [register]

- id: barrel-shifter
  term: "Barrel shifter"
  short: "A circuit that slides a word's bits left or right by any number of places in one step, using a stage per power of two."
  see: [multiplexer]

- id: subroutine
  term: "Subroutine"
  short: "A piece of a program that can be called from anywhere and returns to where it was called from."
  long: "Our CALL saves the return address in r7 (a [[link register|link-register]]); RET jumps back to it."
  see: [link-register]

- id: link-register
  term: "Link register"
  short: "A register where a call instruction saves the address to come back to. In our CPU it is r7."
  see: [subroutine]

- id: harvard-architecture
  term: "Harvard architecture"
  short: "A computer that keeps its program in a separate memory from its data, so it can fetch the next instruction and read or write data at the same time."
  long: "The opposite of the [[stored-program|stored-program]] design, where program and data share one memory."
  see: [stored-program]

- id: risc
  term: "RISC"
  short: "Reduced instruction set computer: a design style with many registers and simple, same-size instructions, where only loads and stores touch memory."
  see: [instruction-set]

- id: memory-mapped-io
  term: "Memory-mapped I/O"
  short: "Reaching devices like the screen and keyboard through ordinary memory addresses: storing to the screen's addresses draws, loading from the keyboard's address reads a key."
  see: [address]

- id: assembler
  term: "Assembler"
  short: "The program that turns assembly language into machine code: names and labels in, instruction words out."
  long: "Ours works in two passes: the first finds where everything goes and what each [[label]] means, the second writes the words."
  see: [assembly-language, two-pass-assembler]

- id: label
  term: "Label"
  short: "A name for an address in a program, written as `name:` before a line, so jumps and data can refer to it by name."
  see: [symbol-table]

- id: symbol-table
  term: "Symbol table"
  short: "The assembler's list of every name (label or constant) and the number it stands for."
  see: [label, two-pass-assembler]

- id: two-pass-assembler
  term: "Two-pass assembler"
  short: "An assembler that reads the program twice: once to learn every label's address, once to write the instructions that use them."
  long: "Two passes are needed because a jump can name a [[label]] that only appears further down."
  see: [assembler, symbol-table]

- id: pseudo-instruction
  term: "Pseudo-instruction"
  short: "A handy name the assembler accepts but the CPU doesn't have; it becomes one or more real instructions, like SET16 or HALT."
  see: [assembler]

- id: directive
  term: "Directive"
  short: "A line that tells the assembler something instead of becoming an instruction, like `.equ` (a constant) or `.word` (data)."
  see: [assembler]

- id: loader
  term: "Loader"
  short: "What puts a program in place before it runs: here, it copies the program's data into RAM."
  see: [assembler]

- id: virtual-machine
  term: "Virtual machine"
  short: "A machine that exists only as a definition: its commands are carried out by an interpreter, or translated into a real CPU's instructions."
  long: "Ours is a [[stack machine|stack-machine]] between the high-level language and assembly (`docs/VM.md`)."
  see: [stack-machine, interpreter]

- id: stack
  term: "Stack"
  short: "A pile of values where you can only add on top (push) or take the top one off (pop): the last one in is the first one out."
  see: [stack-machine, stack-pointer]

- id: stack-machine
  term: "Stack machine"
  short: "A machine whose instructions take their operands from the top of a stack and push their result, instead of naming registers."
  see: [stack, virtual-machine]

- id: stack-pointer
  term: "Stack pointer"
  short: "A register holding the address of the top of the stack (SP); a push moves it one way, a pop the other."
  see: [stack, stack-frame]

- id: stack-frame
  term: "Stack frame"
  short: "The part of the stack that belongs to one function call: its arguments, the return address, the caller's frame pointer and its local variables."
  see: [stack-pointer, calling-convention, recursion]

- id: calling-convention
  term: "Calling convention"
  short: "The agreement on how a call works: where arguments and the result go, what goes in a frame, and which registers a function may change."
  see: [stack-frame, subroutine]

- id: recursion
  term: "Recursion"
  short: "A function calling itself, each call with its own frame, like factorial(n) = n × factorial(n − 1)."
  see: [stack-frame]

- id: interpreter
  term: "Interpreter"
  short: "A program that runs another program's commands one by one, instead of translating them into machine code first."
  see: [virtual-machine]

- id: high-level-language
  term: "High-level language"
  short: "A programming language written in terms of the problem (variables, expressions, loops, functions) rather than the machine's instructions."
  see: [compiler]

- id: compiler
  term: "Compiler"
  short: "A program that turns a program in one language into another, lower-level one: here, C Shard into VM code."
  see: [high-level-language, token, syntax-tree, type-checker]

- id: token
  term: "Token"
  short: "The smallest meaningful piece of program text: a name, a number, a keyword or a symbol like `<=`."
  see: [compiler]

- id: syntax-tree
  term: "Syntax tree"
  short: "A program as a tree: each operator or statement above the parts it works on, so the grouping is plain to see."
  see: [precedence, recursive-descent]

- id: precedence
  term: "Precedence"
  short: "Which operators group first: in 2 + 3 * 4, * binds tighter than +, so the result is 14."
  see: [syntax-tree]

- id: recursive-descent
  term: "Recursive descent"
  short: "A way of parsing with one function per grammar rule (or precedence level), each calling the functions for its parts."
  see: [syntax-tree, precedence]

- id: type-checker
  term: "Type checker"
  short: "The stage of a compiler that makes sure every value is used as its type allows, before any code is made."
  see: [compiler]

- id: short-circuit-evaluation
  term: "Short-circuit evaluation"
  short: "Stopping early: in `a and b`, b isn't evaluated when a is false; in `a or b`, not when a is true."
  see: [high-level-language]
