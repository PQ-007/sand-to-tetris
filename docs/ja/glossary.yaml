# 用語集(日本語)。id は docs/glossary.yaml と同じでなければならない。
# `see` は英語のファイルから取る。章からは [[表示する語|id]] でリンクする。
# 用語の選び方: docs/ja/TERMS.md。
# `reading`: 漢字で始まる用語の読み(ひらがな)。五十音順に並べ、
# 「あ」「か」…の見出しに分けるのに使い、検索でも当たる。

- id: computer
  term: "コンピュータ"
  short: "情報を受け取って蓄え、命令の並びに従って変換し、結果を返す機械。"
  long: "このコースで扱うコンピュータは[[汎用|general-purpose]]で、[[プログラム|program]]によって動き、そのプログラムをほかのデータと同じく[[メモリ|memory]]に置く([[プログラム内蔵方式|stored-program]]という考え方)。"

- id: input
  term: "入力"
  reading: "にゅうりょく"
  short: "コンピュータに入っていく情報。キーの押下、センサーの読み取り値、ファイルなど。"

- id: output
  term: "出力"
  reading: "しゅつりょく"
  short: "コンピュータから出てくる結果。画面のピクセル、音、数値など。"

- id: memory
  term: "メモリ"
  short: "情報をあとで使えるように保持しておく、コンピュータの部分。"
  long: "メモリは、それぞれ 1 [[ビット|bit]]を保持する多数のセルからできている。第 3 章では[[論理ゲート|logic-gate]]からメモリを作る。"

- id: processor
  term: "プロセッサ"
  short: "命令を一つずつ順に実行し、算術、比較、判断を行うコンピュータの部分。"
  long: "CPU(中央処理装置)とも呼ぶ。一つのチップに収めたプロセッサを[[マイクロプロセッサ|microprocessor]]という。"

- id: program
  term: "プログラム"
  short: "コンピュータに何をするかを一歩ずつ指示する命令の並び。"

- id: algorithm
  term: "アルゴリズム"
  short: "問題を解くための正確な手順。従うだけで済み、ひらめきがいらないように書かれている。"

- id: general-purpose
  term: "汎用"
  reading: "はんよう"
  short: "決まった一つの仕事だけでなく、与えるプログラム次第でさまざまな仕事ができること。"

- id: stored-program
  term: "プログラム内蔵方式"
  short: "プログラムをデータと同じメモリに置くコンピュータの方式。新しいプログラムを、新しいデータと同じ手軽さで読み込める。"

- id: punched-card
  term: "パンチカード"
  short: "決まった位置に穴があるかないかで情報を記録する、厚手のカード。"

- id: logarithm
  term: "対数"
  reading: "たいすう"
  short: "基準の数(底)を何乗するとその値になるかを表す数。対数を使うと、掛け算が足し算になる。"
  long: "log(a × b) = log(a) + log(b) なので、[[計算尺|slide-rule]]で二つの長さを足すと、それらが表す数の積が得られる。"

- id: slide-rule
  term: "計算尺"
  reading: "けいさんじゃく"
  short: "対数目盛りを刻んだ尺どうしを滑らせる道具。目盛りを合わせると、掛け算や割り算ができる。"

- id: analog
  term: "アナログ"
  short: "電圧、軸の角度、長さのように連続的に変わる量で、ある量を表すこと。"

- id: digital
  term: "デジタル"
  short: "はっきり区別できる少数の値(たいていは二つだけ)で情報を表すこと。小さな誤差を訂正できる。"

- id: bit
  term: "ビット"
  short: "最小の情報の単位。二つの値のどちらかを選ぶもので、0 と 1 で書く。"
  long: "「binary digit」(2 進数の桁)の略。回路では、ふつう低い電圧(0)か高い電圧(1)で表す。"

- id: binary
  term: "2 進数"
  reading: "にしんすう"
  short: "0 と 1 の二つの数字だけで数える方法。各桁の重みは、右隣の桁の 2 倍になる。"

- id: boolean-algebra
  term: "ブール代数"
  short: "すべての値が真か偽(1 か 0)で、それらを AND、OR、NOT で組み合わせる代数。"

- id: logic-gate
  term: "論理ゲート"
  reading: "ろんりげーと"
  short: "AND、OR、NOT のような、ビットの簡単な関数を計算する小さな回路。"
  long: "第 1 章で、最初のゲートを[[トランジスタ|transistor]]から作る。"

- id: turing-machine
  term: "チューリングマシン"
  short: "簡単な規則に従って、テープ上の記号を読み書きする想像上の機械。どんな手順でも実行できる。"

- id: switch
  term: "スイッチ"
  short: "何かを流す(閉じている、オン)か、止める(開いている、オフ)かのどちらかになる装置。"
  long: "デジタルコンピュータはすべて、ほかのスイッチを制御するスイッチでできている。その正体は歯車、[[リレー|relay]]、[[真空管|vacuum-tube]]、[[トランジスタ|transistor]]と移り変わってきた。"

- id: relay
  term: "リレー"
  short: "電磁石で切り替えるスイッチ。コイルに電流が流れると、金属の接点が引かれて開いたり閉じたりする。"

- id: vacuum-tube
  term: "真空管"
  reading: "しんくうかん"
  short: "密閉したガラス管。格子状の電極(グリッド)にかけた電圧が、真空中を流れる電子を制御する。動く部品のない電子的なスイッチ。"

- id: transistor
  term: "トランジスタ"
  short: "半導体でできた小さな電子スイッチ。一つの端子の電圧または電流が、ほかの二つの端子の間の流れを制御する。"

- id: semiconductor
  term: "半導体"
  reading: "はんどうたい"
  short: "シリコンやゲルマニウムのように、電気の通しやすさが金属と絶縁体の中間にあり、それを制御できる物質。"

- id: germanium
  term: "ゲルマニウム"
  short: "最初のトランジスタに使われた半導体元素。初期には精製しやすかったが、温まると電流が漏れやすく、安定した酸化膜もできない。"

- id: silicon
  term: "シリコン"
  short: "現在ほぼすべてのチップに使われる半導体元素。砂や岩に豊富に含まれ、丈夫な絶縁性の酸化膜ができる。"

- id: silicon-dioxide
  term: "二酸化ケイ素"
  reading: "にさんかけいそ"
  short: "ケイ素(シリコン)と酸素の化合物(SiO₂)で、石英の砂の主成分。チップの上では、その薄い層が優れた絶縁体になる。"

- id: band-gap
  term: "バンドギャップ"
  short: "電子が束縛を離れて電気を運べるようになるのに必要なエネルギー。ギャップが大きいほど、熱だけで自由になる電子は少ない。"
  long: "単位は電子ボルト(eV)。シリコンのギャップ(約 1.1 eV)はゲルマニウム(約 0.66 eV)より大きいので、温まってもシリコンの漏れ電流ははるかに少ない。"

- id: leakage-current
  term: "漏れ電流"
  reading: "もれでんりゅう"
  short: "オフのはずのスイッチを流れてしまう、望まない電流。"

- id: integrated-circuit
  term: "集積回路"
  reading: "しゅうせきかいろ"
  short: "多数のトランジスタとその配線からなる回路一式を、一つの半導体のかけらの上にまとめて作ったもの。チップ。"

- id: microprocessor
  term: "マイクロプロセッサ"
  short: "一つの集積回路として作られた、プロセッサ全体。"

- id: moores-law
  term: "ムーアの法則"
  short: "1 枚のチップに載るトランジスタの数は一定の割合で倍になる、というゴードン・ムーアの観察。1975 年以降はおよそ 2 年ごと。"

- id: wafer
  term: "ウエハ"
  short: "シリコンの単結晶から薄く切り出して磨いた円盤。その上に多数のチップを一度に作る。"

- id: polysilicon
  term: "多結晶シリコン"
  reading: "たけっしょうしりこん"
  short: "小さな結晶が多数くっついてできた、非常に純粋なシリコン。単結晶を育てる原料になる。"

- id: single-crystal
  term: "単結晶"
  reading: "たんけっしょう"
  short: "原子が全体にわたって、途切れのない一つの規則正しい並びをしている固体。"

- id: czochralski-process
  term: "チョクラルスキー法"
  short: "溶かした材料に小さな種結晶を浸し、回しながらゆっくり引き上げて単結晶を育てる方法。"

- id: doping
  term: "ドーピング"
  short: "半導体に別の元素をごく少量、量を制御しながら加え、自由電子や正孔を増やすこと。"

- id: dopant
  term: "ドーパント"
  short: "ドーピングでわざと加える元素。シリコンならリン(n 型)やホウ素(p 型)など。"

- id: electron
  term: "電子"
  reading: "でんし"
  short: "負の電荷をもつ小さな粒子。導線の中で電流を運ぶのは、動いている電子である。"

- id: hole
  term: "正孔"
  reading: "せいこう"
  short: "結晶の結合から電子が一つ抜けた場所。隣の電子が次々に移ってくるので、正の電荷のように動く。"

- id: n-type
  term: "n 型"
  short: "例えばリンをドープして、自由電子(負のキャリア)を増やしたシリコン。"

- id: p-type
  term: "p 型"
  short: "例えばホウ素をドープして、正孔(正のキャリア)を増やしたシリコン。"

- id: p-n-junction
  term: "pn 接合"
  short: "p 型と n 型のシリコンが接する境界。電流を一方向にだけ流しやすい。"

- id: depletion-region
  term: "空乏層"
  reading: "くうぼうそう"
  short: "pn 接合にできる薄い領域。電子と正孔が打ち消し合い、電気を運ぶ自由なキャリアがない。"

- id: diode
  term: "ダイオード"
  short: "電流を一方向には流すが、逆方向には流さない素子。pn 接合はその一つ。"

- id: forward-bias
  term: "順方向バイアス"
  reading: "じゅんほうこうばいあす"
  short: "空乏層を狭めて電流を流す向きに、pn 接合へかける電圧。"

- id: reverse-bias
  term: "逆方向バイアス"
  reading: "ぎゃくほうこうばいあす"
  short: "空乏層を広げて電流を止める向きに、pn 接合へかける電圧。"

- id: mosfet
  term: "MOSFET"
  short: "金属・酸化膜・半導体の電界効果トランジスタ。ほぼすべてのチップに使われ、ゲート電圧がチャネルを作ったり消したりする。"

- id: gate-terminal
  term: "ゲート(トランジスタの)"
  short: "MOSFET の制御端子。その電圧で、スイッチがオンかオフかが決まる。"
  long: "[[論理ゲート|logic-gate]]と混同しないこと。論理ゲートは、複数のトランジスタで作った回路全体のことである。"

- id: source-and-drain
  term: "ソースとドレイン"
  short: "MOSFET がつないだり切り離したりする二つの端子。チャネルがあるとき、その間を電流が流れる。"

- id: channel
  term: "チャネル"
  short: "ゲート電圧がしきい値を超えると、MOSFET のゲートの下にできる薄い導電層。"

- id: threshold-voltage
  term: "しきい値電圧"
  short: "MOSFET のチャネルができ、トランジスタがオンになるゲート電圧。"

- id: nmos
  term: "NMOS"
  short: "n チャネルの MOSFET。ゲートが高い(1)ときにオンになる。"

- id: pmos
  term: "PMOS"
  short: "p チャネルの MOSFET。ゲートが低い(0)ときにオンになる。NMOS とは逆。"

- id: cmos
  term: "CMOS"
  short: "相補型 MOS。NMOS と PMOS を組にして作る論理回路で、各組のどちらかが必ずオフなので、何もしていない間はほとんど電流が流れない。"

- id: voltage
  term: "電圧"
  reading: "でんあつ"
  short: "2 点の間の電気的な「押す力」。単位はボルト(V)。パイプの中の水圧のようなもの。"

- id: current
  term: "電流"
  reading: "でんりゅう"
  short: "ある点を 1 秒間に通過する電荷の量。単位はアンペア(A)。"

- id: noise
  term: "ノイズ"
  short: "熱、干渉、隣の配線などによって信号に加わる、望まない小さなランダムな変動。"

- id: logic-level
  term: "論理レベル"
  reading: "ろんりれべる"
  short: "回路が 0 または 1 として読み取る電圧の範囲。"

- id: noise-margin
  term: "ノイズマージン"
  short: "正しい 0 や 1 がどれだけノイズを拾っても、次の段で正しく読み取れるかという余裕。"

- id: transfer-curve
  term: "伝達特性"
  reading: "でんたつとくせい"
  short: "回路の出力電圧を入力電圧に対して描いたグラフ。急な S 字形をしていることが、デジタル論理が信号を回復させる理由である。"

- id: series-and-parallel
  term: "直列と並列"
  reading: "ちょくれつとへいれつ"
  short: "直列のスイッチは一つずつ順に並ぶので、電流が流れるには全部が閉じている必要がある(AND)。並列では横に並ぶので、どれか一つで足りる(OR)。"

- id: truth-table
  term: "真理値表"
  reading: "しんりちひょう"
  short: "回路の入力のすべての組み合わせと、それぞれで出すべき出力を並べた表。"

- id: pull-up-network
  term: "プルアップ回路網"
  short: "CMOS ゲートの中で、必要な入力のときに出力を VDD につなぐ(1 にする)PMOS トランジスタの集まり。"

- id: pull-down-network
  term: "プルダウン回路網"
  short: "CMOS ゲートの中で、必要な入力のときに出力を GND につなぐ(0 にする)NMOS トランジスタの集まり。"

- id: floating
  term: "フローティング"
  short: "VDD にも GND にもつながっておらず、値が決まらない配線の状態。シミュレータでは Z と表示する。"

- id: short-circuit
  term: "ショート"
  short: "オンになったスイッチを通って VDD から GND へ直接つながる経路。電力を浪費してチップを熱くし、出力は予測できない(X)。"

- id: universal-gate
  term: "万能ゲート"
  reading: "ばんのうげーと"
  short: "ほかのすべての論理関数を作れるゲート。NAND と NOR はどちらも万能である。"

- id: abstraction
  term: "抽象化"
  reading: "ちゅうしょうか"
  short: "内部の仕組みを隠し、何をするかだけで使えるようにすること。NAND が合格したら、4 個のトランジスタではなく NAND という箱として扱う。"

- id: gate-delay
  term: "ゲート遅延"
  short: "入力が変わってから、ゲートが出力を更新するまでの短い時間。シミュレータではステップ数で数える。"

- id: multiplexer
  term: "マルチプレクサ(MUX)"
  short: "選択ビットに従って複数の入力から一つを選び、出力へ通す回路。"

- id: demultiplexer
  term: "デマルチプレクサ(DMUX)"
  short: "一つの入力を、選択ビットで選んだ出力の一つへ送る回路。ほかの出力は 0 のまま。"

- id: bus
  term: "バス"
  short: "1 本に 1 ビットずつ、合わせて一つの数を運ぶ配線の束。エディタでは 1 本の太い線で描く。"

- id: splitter-and-joiner
  term: "スプリッタとジョイナ"
  short: "スプリッタはバスを 1 ビットずつの配線に分け(ビット 0 が最下位)、ジョイナは 1 ビットずつの配線をまとめてバスに戻す。"

- id: half-adder
  term: "半加算器"
  reading: "はんかさんき"
  short: "2 ビットを足して、和のビットとキャリーのビットを出す回路。"

- id: full-adder
  term: "全加算器"
  reading: "ぜんかさんき"
  short: "3 ビット(二つの桁とキャリー入力)を足して、和のビットとキャリー出力を出す回路。足し算の 1 桁分。"

- id: carry
  term: "キャリー"
  short: "ある桁の和が 1 桁に収まらないとき、次の桁へ送る余分な 1。桁上げ。"

- id: ripple-carry-adder
  term: "リップルキャリー加算器"
  short: "全加算器を鎖のようにつなぎ、各桁のキャリーを次の桁へ送る加算器。単純だが、キャリーがすべての桁を通り抜けなければならないことがある。"

- id: twos-complement
  term: "2 の補数"
  reading: "にのほすう"
  short: "コンピュータが負の数を表すふつうの方法。−x を NOT x + 1 として表すので、同じ加算器で正の数も負の数も扱える。"

- id: fast-model
  term: "高速モデル"
  reading: "こうそくもでる"
  short: "自分で設計した部品の、組み込みの速い版。両者が同じ動きをすると一致チェックで確かめられたら、自分のゲートの代わりに使う。"

- id: alu
  term: "ALU(算術論理演算装置)"
  short: "CPU の中で計算をする部分。足し算、引き算、ビットの組み合わせを行い、どの演算をするかを少数の制御入力で選ぶ。"

- id: flags
  term: "フラグ"
  short: "ALU の結果についての 1 ビットの事実(ゼロか? 負か? キャリーが出たか?)。CPU はこれを見て、次に何をするかを決める。"

# ---- 第 3 章: メモリ ----------------------------------------------------------

- id: sequential-circuit
  term: "順序回路"
  reading: "じゅんじょかいろ"
  short: "今の入力だけでなく、それまでに起きたことにも出力が左右される回路。つまり記憶をもつ。"
  long: "組み合わせ回路の反対。順序回路は[[フィードバック|feedback]]で作られ、多くは[[クロック|clock]]で動く。"

- id: feedback
  term: "フィードバック"
  short: "回路の出力を自分自身の入力へ戻す配線。次の動作が、今の動作によって決まるようになる。"
  long: "[[ラッチ|latch]]が記憶できるのはフィードバックのおかげである。回路が発振して、いつまでも反転し続ける原因にもなる。"

- id: latch
  term: "ラッチ"
  short: "最も単純な記憶。互いの出力を入力にし合う二つのゲートで、セットした信号が消えたあとも 1 ビットを保持する。"
  long: "SR ラッチにはセットとリセットの入力がある。D ラッチにはデータ入力が一つあり、イネーブルが 1 の間はそれを写し取り、0 の間は保持する。"

- id: flip-flop
  term: "フリップフロップ"
  short: "クロックが 0 から 1 に上がる瞬間にだけ変わる、1 ビットの記憶。"
  long: "同時には開かない二つの[[ラッチ|latch]]で作る(マスター・スレーブ)。クロックエッジの間は入力を無視するので、フリップフロップでできたコンピュータ全体が足並みをそろえて動く。"

- id: clock
  term: "クロック"
  short: "0 と 1 を繰り返し行き来し、すべてのフリップフロップに次の値を取り込むタイミングを伝える信号。"
  long: "0 から 1 への変化の一つ一つが 1 拍である。プロセッサのクロック周波数(例えば 3 GHz)は、1 秒あたりの拍の数である。"

- id: clock-edge
  term: "クロックエッジ"
  short: "クロックが変わる瞬間。立ち上がりエッジは 0 から 1 への変化で、フリップフロップが値を取り込む瞬間である。"

- id: setup-time
  term: "セットアップ時間"
  short: "正しい値を記憶させるために、クロックエッジの前にフリップフロップの入力を安定させておくべき時間。"
  long: "エッジの直前に入力が変わると、フリップフロップは古い値、新しい値、あるいは一瞬どちらでもない状態を記憶することがある。このコースのテストでは、どの立ち上がりエッジでも入力を安定させている。"

- id: register
  term: "レジスタ"
  short: "一つの数(ここでは 16 ビット)を保持する小さな記憶。load 入力が 1 のとき、クロックエッジで全ビットを一度に読み込む。"

- id: address
  term: "アドレス"
  short: "メモリのどのワードを読み書きするかを示す番号。通りに並ぶ家の番地のようなもの。"

- id: ram
  term: "RAM"
  short: "ランダムアクセスメモリ。アドレス付きの多数のレジスタからなり、どのワードもほかと同じ速さで読み書きできる。"
  long: "「ランダムアクセス」とは、どのアドレスにもすぐ飛べるという意味である。目的の位置まで巻かなければならないテープとは違う。"

- id: program-counter
  term: "プログラムカウンタ"
  short: "次の命令のアドレスを保持するレジスタ。1 ずつ増えるか、指示されたときにジャンプする。"

- id: waveform
  term: "波形"
  reading: "はけい"
  short: "時間とともに変わる信号の図。信号ごとに 1 行で、時間は左から右へ進む。タイミング図とも呼ぶ。"

- id: magnetic-core-memory
  term: "磁気コアメモリ"
  reading: "じきこあめもり"
  short: "配線に通した小さな磁性体のリングでできたメモリ。各リングは磁化の向きで 1 ビットを記憶する。"
  long: "1950 年代半ばから 1970 年代まで、ほとんどのコンピュータの主記憶だった。トランジスタのメモリと違い、電源を切っても内容が消えなかった。"

- id: sram
  term: "SRAM"
  short: "スタティック RAM。各ビットがラッチ(ふつうは 6 個のトランジスタ)で、電源がある限り値を保持する。"
  long: "速いが大きい。プロセッサはキャッシュに使う。このコースで作る RAM も、フリップフロップでできたスタティックなものである。"

- id: dram
  term: "DRAM"
  short: "ダイナミック RAM。各ビットは小さなコンデンサにためた電荷で、1 個のトランジスタがその出入りを守る。電荷は漏れていくので、絶えずリフレッシュしなければならない。"
  long: "1 ビットあたりの大きさが[[SRAM|sram]]よりずっと小さいので、コンピュータの主記憶に使われる。"

- id: capacitor
  term: "コンデンサ"
  short: "絶縁体をはさんだ二つの導体で、電荷をためておける。小さな充電式のバケツのようなもの。"

- id: instruction
  term: "命令"
  reading: "めいれい"
  short: "プログラムの 1 ステップ。「この二つのレジスタを足せ」「ゼロでなければ戻れ」のような、プロセッサが実行できる一つの指令。"
  long: "私たちのコンピュータでは、どの命令も 16 ビットのワード一つで、そのビットが何をどの[[レジスタ|register]]で行うかを表す。"

- id: instruction-set
  term: "命令セット(ISA)"
  reading: "めいれいせっと"
  short: "プロセッサが理解する命令の一覧と、それぞれがビットでどう書かれ、何をするかの厳密な定め。"
  long: "ハードウェアとソフトウェアの間の契約である。[[CPU|processor]]は約束どおりに動かなければならず、どのプログラムもこれで書かれる。私たちのものは docs/ISA.md にある。"

- id: machine-code
  term: "機械語"
  reading: "きかいご"
  short: "プロセッサが読む形のプログラム。命令ワードを、ただの数として並べたもの。"

- id: assembly-language
  term: "アセンブリ言語"
  short: "数の代わりに短い名前で書いた機械語。1 行に 1 命令で、SET r1, 5 のように書く。"
  long: "アセンブラがこれを[[機械語|machine-code]]に変換する。次の章では、そのアセンブラを自分で書く。"

- id: instruction-cycle
  term: "フェッチ・デコード・実行サイクル"
  short: "プロセッサが繰り返し行うこと。プログラムカウンタが指す命令を読み、その意味を解き、実行する。"
  long: "私たちの CPU は、この三つを 1 クロックサイクルで行う。"

- id: control-unit
  term: "制御ユニット"
  reading: "せいぎょゆにっと"
  short: "命令を読み、すべての制御信号を決める CPU の部分。どのレジスタを読むか、ALU が何をするか、結果をどこへ送るかを決める。"

- id: datapath
  term: "データパス"
  short: "データを保持し、動かす CPU の部分。レジスタ、ALU、シフタと、その間の配線やマルチプレクサ。"

- id: register-file
  term: "レジスタファイル"
  short: "CPU の汎用レジスタの集まり。同じクロックサイクルで二つを読み、一つに書き込むためのポートをもつ。"

- id: barrel-shifter
  term: "バレルシフタ"
  short: "ワードのビットを、左右に何桁でも 1 ステップでずらす回路。2 のべき乗ごとに 1 段を使う。"

- id: subroutine
  term: "サブルーチン"
  short: "どこからでも呼び出せて、呼ばれた場所へ戻ってくるプログラムの一部。"
  long: "私たちの CALL は戻りアドレスを r7([[リンクレジスタ|link-register]])に保存し、RET はそこへジャンプして戻る。"

- id: link-register
  term: "リンクレジスタ"
  short: "呼び出し命令が、戻り先のアドレスを保存するレジスタ。私たちの CPU では r7。"

- id: harvard-architecture
  term: "ハーバード・アーキテクチャ"
  short: "プログラムをデータとは別のメモリに置くコンピュータ。次の命令の読み出しと、データの読み書きを同時にできる。"
  long: "プログラムとデータが一つのメモリを分け合う[[プログラム内蔵方式|stored-program]]の設計とは反対である。"

- id: risc
  term: "RISC"
  short: "縮小命令セットコンピュータ。多くのレジスタと、単純で長さのそろった命令をもち、メモリに触れるのはロードとストアだけ、という設計の流儀。"

- id: memory-mapped-io
  term: "メモリマップド I/O"
  short: "画面やキーボードのような装置を、ふつうのメモリアドレスを通して扱うこと。画面のアドレスにストアすると描かれ、キーボードのアドレスからロードするとキーが読める。"

- id: assembler
  term: "アセンブラ"
  short: "アセンブリ言語を機械語に変換するプログラム。名前とラベルを受け取り、命令ワードを出す。"
  long: "私たちのアセンブラは 2 パスで動く。1 回目でそれぞれの置き場所と各[[ラベル|label]]の意味を調べ、2 回目でワードを書き出す。"

- id: label
  term: "ラベル"
  short: "プログラム中のアドレスにつける名前。行の前に `name:` と書き、ジャンプやデータから名前で参照できるようにする。"

- id: symbol-table
  term: "シンボルテーブル"
  short: "アセンブラがもつ、すべての名前(ラベルや定数)と、それが表す数の一覧。"

- id: two-pass-assembler
  term: "2 パスアセンブラ"
  reading: "にぱすあせんぶら"
  short: "プログラムを 2 回読むアセンブラ。1 回目で各ラベルのアドレスを知り、2 回目でそれを使う命令を書く。"
  long: "ジャンプが、もっと下に出てくる[[ラベル|label]]を名指しすることがあるので、2 回読む必要がある。"

- id: pseudo-instruction
  term: "疑似命令"
  reading: "ぎじめいれい"
  short: "アセンブラは受け付けるが、CPU にはない便利な名前。SET16 や HALT のように、1 個以上の本物の命令になる。"

- id: directive
  term: "ディレクティブ"
  short: "命令にはならず、アセンブラに何かを伝える行。`.equ`(定数)や `.word`(データ)など。"

- id: loader
  term: "ローダ"
  short: "プログラムを実行の前に所定の場所へ置くもの。ここでは、プログラムのデータを RAM にコピーする。"

- id: virtual-machine
  term: "仮想マシン"
  reading: "かそうましん"
  short: "定義としてだけ存在する機械。そのコマンドは、インタプリタが実行するか、本物の CPU の命令に変換される。"
  long: "私たちのものは、高水準言語とアセンブリの間に置く[[スタックマシン|stack-machine]]である(`docs/VM.md`)。"

- id: stack
  term: "スタック"
  short: "値を積んだ山で、上に載せる(プッシュ)か一番上を取る(ポップ)ことしかできない。最後に入れたものが最初に出る。"

- id: stack-machine
  term: "スタックマシン"
  short: "命令がレジスタを名指しする代わりに、スタックの一番上からオペランドを取り、結果をプッシュする機械。"

- id: stack-pointer
  term: "スタックポインタ"
  short: "スタックの一番上のアドレスを保持するレジスタ(SP)。プッシュで一方へ、ポップで逆へ動く。"

- id: stack-frame
  term: "スタックフレーム"
  short: "一回の関数呼び出しに属するスタックの部分。引数、戻りアドレス、呼び出し元のフレームポインタ、ローカル変数が入る。"

- id: calling-convention
  term: "呼び出し規約"
  reading: "よびだしきやく"
  short: "呼び出しの仕組みについての取り決め。引数と結果をどこに置くか、フレームに何を入れるか、関数がどのレジスタを変えてよいか。"

- id: recursion
  term: "再帰"
  reading: "さいき"
  short: "関数が自分自身を呼ぶこと。呼び出しごとに自分のフレームをもつ。factorial(n) = n × factorial(n − 1) のように。"

- id: interpreter
  term: "インタプリタ"
  short: "ほかのプログラムのコマンドを、先に機械語へ変換せずに一つずつ実行するプログラム。"

- id: high-level-language
  term: "高水準言語"
  reading: "こうすいじゅんげんご"
  short: "機械の命令ではなく、問題の言葉(変数、式、ループ、関数)で書くプログラミング言語。"

- id: compiler
  term: "コンパイラ"
  short: "ある言語のプログラムを、より低水準の別の言語に変換するプログラム。ここでは C Shard を VM コードに変換する。"

- id: token
  term: "トークン"
  short: "プログラムの文字列のうち、意味をもつ最小のかけら。名前、数、キーワード、`<=` のような記号。"

- id: syntax-tree
  term: "構文木"
  reading: "こうぶんぎ"
  short: "木の形にしたプログラム。それぞれの演算子や文が、それが扱う部分の上に置かれるので、まとまり方が一目でわかる。"

- id: precedence
  term: "優先順位"
  reading: "ゆうせんじゅんい"
  short: "どの演算子が先に結びつくか。2 + 3 * 4 では * が + より強く結びつくので、結果は 14 になる。"

- id: recursive-descent
  term: "再帰下降構文解析"
  reading: "さいきかこうこうぶんかいせき"
  short: "文法規則(または優先順位の段)ごとに関数を一つ用意し、それぞれが自分の部分の関数を呼んで構文解析する方法。"

- id: type-checker
  term: "型チェッカー"
  reading: "かたちぇっかー"
  short: "コードを作る前に、すべての値がその型で許される使い方をされているかを確かめる、コンパイラの段階。"

- id: short-circuit-evaluation
  term: "短絡評価"
  reading: "たんらくひょうか"
  short: "早めに打ち切ること。`a and b` では a が偽なら b を評価せず、`a or b` では a が真なら b を評価しない。"

- id: operating-system
  term: "オペレーティングシステム(OS)"
  short: "すべてのプログラムが機械を使うために共有するコード。ここでは描画、文字、キーボード、時間、乱数。大きなシステムは、機械を複数のプログラムで分け合わせ、ファイルも管理する。"

- id: bit-mask
  term: "ビットマスク"
  short: "操作したい位置を 1 にしたワード。これと OR を取るとそのビットがセットされ、その反転と AND を取るとクリアされ、ほかのビットはそのまま残る。"

- id: bitmap-font
  term: "ビットマップフォント"
  short: "1 ピクセルを 1 ビットとして、小さな絵の形で保存したフォント。ここでは 1 文字が 3 × 5 ピクセルで、ワード一つに収まる。"

- id: pseudo-random
  term: "疑似乱数"
  reading: "ぎじらんすう"
  short: "数式から作る、ランダムに見える数。同じ出発点からは、いつも同じ数列が出る。"

- id: random-seed
  term: "シード"
  short: "疑似乱数生成器の最初の値。シードが違えば、出てくる数列も違う。"

- id: collision-detection
  term: "衝突判定"
  reading: "しょうとつはんてい"
  short: "ゲームの中で二つのものが重なっているかを調べること。Bitfall では、ピースの行とその下の盤面の行の AND が 0 になるのは、重なっていないときだけである。"

- id: game-loop
  term: "ゲームループ"
  short: "ゲームの中心にあるループ。入力を読み、タイマーに合わせてゲームを進め、変わったところを描く。これを繰り返す。"

- id: fixed-point
  term: "固定小数点"
  reading: "こていしょうすうてん"
  short: "整数で小数を扱う方法。値に決まった倍率(16 や 256 など)を掛けて保存するので、倍率 16 なら 1.5 は 24 になる。浮動小数点のない機械で、なめらかな動きや角度に使う。"

- id: double-buffering
  term: "ダブルバッファリング"
  short: "1 フレームをメモリ上の画面のコピーに描き、そのコピーを一度に表示すること。見る人に描きかけのフレームが見えない。"

- id: ray-casting
  term: "レイキャスティング"
  short: "2D の地図から 3D の視界を描く方法。画面の列ごとに、プレイヤーから光線をたどって壁に当たるまで進める。壁が近いほど、その列を高く描く。"
