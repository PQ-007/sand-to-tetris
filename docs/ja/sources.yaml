# 出典の主張の日本語訳。リンクと確認日は docs/sources.yaml から来る。
# ここで訳すのは主張(claim)、異論の説明(uncertain)、確認方法(checked)、
# 概算の注記(note)だけ。id は原文のファイルと同じでなければならない。

- id: ishango-bone
  claim: >-
    現在のコンゴ民主共和国で見つかったイシャンゴの骨は、およそ 2 万年前のもので、刻み目のまとまりがある。
  uncertain: >-
    年代の推定は約 2 万 5000 年前から 1 万 6000 年前まで幅がある。刻み目が数え、算術、太陰暦、あるいは数とは関係のないもの(握りの跡など)のどれを記録したものかは、いまも議論されている。
  checked: ウェブ検索、2026-10-31

- id: lebombo-bone
  claim: >-
    アフリカ南部のボーダー洞窟で見つかったヒヒの腓骨、レボンボの骨は、約 4 万 3000 年前のもので、29 本の刻み目がある。
  uncertain: >-
    骨が折れているため 29 本がすべてとは限らず、数取りなのか太陰暦なのかも議論されている。
  checked: ウェブ検索、2026-10-31

- id: abacus
  claim: >-
    計算盤とそろばんは古くからある。正確な起源は不明で、メソポタミアが出発点としてよく挙げられる。ローマの手そろばんと中国の算盤(スワンパン)は、のちの時代の、よく記録された形である。
  uncertain: >-
    起源と年代ははっきりしない。最古のそろばんと、算盤の最初の文字記録の年代について、資料によって食い違いがある。
  checked: ウェブ検索、2026-10-31

- id: antikythera
  claim: >-
    アンティキティラ島の機械は、太陽、月、惑星の動きを再現し、日食や月食を予測した、古代ギリシャの手回し式の青銅の歯車機構である。紀元前 60 年ごろとされる沈没より前に作られた。
  uncertain: >-
    製作年代には議論がある。推定の多くは紀元前 2 世紀(しばしば紀元前 150〜100 年)で、外側の範囲はおよそ紀元前 205〜60 年である。
  checked: ウェブ検索、2026-10-31

- id: napier-logarithms
  claim: >-
    ジョン・ネイピアは 1614 年に対数を発表し、掛け算を足し算に変えた。
  checked: ウェブ検索、2026-10-31

- id: slide-rule
  claim: >-
    エドマンド・ガンターは 1620 年に定規に対数目盛りを描いた。その後 10 年ほどのうちに、そうした目盛り二本を互いに滑らせる計算尺が生まれた。
  uncertain: >-
    功績は分け合われており、年代も異なる。ふつうはウィリアム・オートレッドの功績とされ(年代は約 1622 年から 1632 年まで。後者は円形の計算尺)、エドマンド・ウィンゲートも 1630 年ごろに滑らせる目盛りを説明している。
  checked: ウェブ検索、2026-10-31

- id: pascaline
  claim: >-
    ブレーズ・パスカルは 1642 年から、歯車で動く加算機パスカリーヌを設計した。
  uncertain: >-
    資料によって 1642 年(設計の開始)と 1645 年(最初の機械の披露)がある。
  checked: ウェブ検索、2026-10-31

- id: leibniz-stepped-reckoner
  claim: >-
    ゴットフリート・ライプニッツは 1672 年に段付き歯車式計算機の設計を始めた。足し算だけでなく掛け算と割り算もできた。1694 年に最初の動く機械を完成させた。
  checked: ウェブ検索、2026-10-31

- id: jacquard
  claim: >-
    1804 年ごろ、ジョゼフ=マリー・ジャカールは、パンチカードの連なりで動く織機の装置を導入した。穴がどの糸を持ち上げるかを選ぶので、カードを替えると模様が変わった。
  uncertain: >-
    ブリタニカは 1804〜05 年としている。ほかの資料は 1801 年の実演と 1804 年の特許に触れている。
  checked: ウェブ検索、2026-10-31

- id: babbage-difference-engine
  claim: >-
    チャールズ・バベッジは 1822 年、数表を計算する機械である階差機関の小さな模型を披露した。彼は完全な機械を完成させなかった。動く機関は、のちにロンドンのサイエンス・ミュージアムが彼の設計図から作った。
  checked: ウェブ検索、2026-10-31

- id: babbage-analytical-engine
  claim: >-
    1830 年代、バベッジは解析機関を設計した。ストア(メモリ)とミル(プロセッサ)を別々にもち、ジャカールの織機から借りたパンチカードでプログラムする汎用の機械である。作られることはなかった。
  checked: ウェブ検索、2026-10-31

- id: lovelace-notes
  claim: >-
    1843 年、エイダ・ラブレスは解析機関についての詳しい注釈を発表した。注釈 G は、機関がベルヌーイ数をどう計算できるかを一歩ずつ示し、彼女はこうした機械が数だけでなく記号も扱えると論じた。
  uncertain: >-
    これでラブレスが「最初のプログラマ」になるかには議論がある。バベッジはそれより前にプログラムの例を書いており、注釈 G のどこまでをどちらが書いたのか、「プログラム」をどう定義するかについて、歴史家の意見は分かれている。
  checked: ウェブ検索、2026-10-31

- id: hollerith
  claim: >-
    1890 年のアメリカ国勢調査では、ハーマン・ホレリスの集計機がパンチカードを電気で読んだ。穴を通り抜けたピンが水銀に浸かって回路を閉じ、カウンタを進めた。1880 年の国勢調査は、手作業での集計に何年もかかっていた。
  uncertain: >-
    1880 年の集計には 7 年または 8 年かかったと資料は述べている。
  checked: ウェブ検索、2026-10-31

- id: differential-analyzer
  claim: >-
    1931 年には稼働していた MIT のヴァネヴァー・ブッシュの微分解析機は、部屋いっぱいの機械式アナログコンピュータで、軸、歯車、円盤と車輪の積分器で微分方程式を解いた。
  checked: ウェブ検索、2026-10-31

- id: boole
  claim: >-
    ジョージ・ブールは、The Mathematical Analysis of Logic(1847 年)と An Investigation of the Laws of Thought(1854 年)で、論理を代数として書けることを示した。
  checked: ウェブ検索、2026-10-31

- id: turing
  claim: >-
    アラン・チューリングの 1936 年の論文「On Computable Numbers」は、どんな手順でも実行できる単純な想像上の機械と、ほかの機械の記述を与えればそれを真似できる万能機械を説明した。
  checked: ウェブ検索、2026-10-31

- id: shannon
  claim: >-
    クロード・シャノンの 1937 年の MIT の修士論文は、ブール代数がスイッチ(リレー)の回路を記述することを示した。だから論理はスイッチで作れ、スイッチ回路は代数で簡単にできる。論文は 1938 年に発表された。
  checked: ウェブ検索、2026-10-31

- id: von-neumann-edvac
  claim: >-
    ジョン・フォン・ノイマンの「First Draft of a Report on the EDVAC」(1945 年 6 月)は、プログラムをデータと同じメモリに置くコンピュータを説明した。それ以来ほとんどすべてのコンピュータが使っているプログラム内蔵方式である。
  uncertain: >-
    報告書にはフォン・ノイマンの名前しかなかったが、その考えは ENIAC チームの J・プレスパー・エッカート、ジョン・モークリーらとの議論から育ったもので、彼らはフォン・ノイマンが加わる前から命令をメモリに置くことを検討していた。功績の分け方はいまも議論されている。
  checked: ウェブ検索、2026-10-31

- id: harvard-mark-i
  claim: >-
    1944 年に稼働したハーバード Mark I(IBM ASCC)は、リレー、スイッチ、回転軸で作られた大型の電気機械式コンピュータだった。
  checked: ウェブ検索、2026-10-31

- id: eniac
  claim: >-
    1945 年に完成した ENIAC は、真空管を 17,468 本使っていた。
  checked: ウェブ検索、2026-10-31

- id: point-contact-transistor
  claim: >-
    1947 年 12 月 16 日、ベル研究所でジョン・バーディーンとウォルター・ブラッテンが最初のトランジスタを動かした。ゲルマニウムの板に二つの金の接点を押し当てたもので、信号を最大 100 倍に増幅した。12 月 23 日にベル研究所の経営陣に披露され、ベル研究所は 1948 年 6 月 30 日にトランジスタを公表した。グループを率いたのはウィリアム・ショックレーだった。
  checked: ウェブ検索、2026-10-31

- id: germanium-vs-silicon
  claim: >-
    ゲルマニウムのバンドギャップ(約 0.66 eV)はシリコン(約 1.1 eV)よりずっと小さいので、ゲルマニウムでは熱でより多くの電子が自由になる。漏れ電流がずっと大きく、温度とともに急速に増える。初期にはゲルマニウムのほうが精製しやすかったので、先に使われた。
  checked: ウェブ検索、2026-10-31

- id: germanium-oxide
  claim: >-
    シリコンは丈夫で安定した絶縁性の酸化膜(二酸化ケイ素)を育てる。ゲルマニウムの酸化物は水に溶け、不安定なので、同じ役割を果たせない。
  checked: ウェブ検索、2026-10-31

- id: silicon-abundance
  claim: >-
    シリコンは地殻で 2 番目に多い元素である(質量でおよそ 4 分の 1 から 30% 近く)。ゲルマニウムは希少で、主に亜鉛鉱石の処理の副産物として回収される。
  checked: ウェブ検索、2026-10-31

- id: silicon-transistor-1954
  claim: >-
    1954 年 1 月、ベル研究所のモリス・タネンバウムが最初のシリコントランジスタを作った。1954 年、テキサス・インスツルメンツはゴードン・ティールとともに最初の商用シリコントランジスタを作って販売し、1954 年 5 月 10 日に発表した。
  uncertain: >-
    「最初のシリコントランジスタ」はよく TI の功績とされる。ベル研究所の 1954 年 1 月の素子のほうが先だったが、当時は公表されなかった。
  checked: ウェブ検索、2026-10-31

- id: integrated-circuit
  claim: >-
    テキサス・インスツルメンツのジャック・キルビーは、1958 年 9 月 12 日にゲルマニウム製の最初の集積回路を実演した。1959 年、フェアチャイルドのロバート・ノイスは、ジャン・ヘルニのプレーナ技術で作るシリコンの集積回路を考案し、業界がこの方式を採用した。キルビーは 2000 年のノーベル物理学賞を受けた。ノイスは 1990 年に亡くなっていた。
  checked: ウェブ検索、2026-10-31

- id: mosfet
  claim: >-
    ベル研究所のモハメド(ジョン)・アタラとカーン・ダウォンが、1959〜60 年に最初の動く MOSFET(金属・酸化膜・半導体の電界効果トランジスタ)を作った。それはシリコンの安定した酸化膜に頼っていた。
  uncertain: >-
    資料は発明を 1959 年、実演を 1960 年としている。
  checked: ウェブ検索、2026-10-31

- id: cmos
  claim: >-
    1963 年、フェアチャイルドのフランク・ワンラスとチータン・サーは、n チャネルと p チャネルの MOS トランジスタの相補的な組で作った論理(CMOS)が、切り替わっていない間ほとんど電力を使わないことを示した。
  checked: ウェブ検索、2026-10-31

- id: moores-law
  claim: >-
    1965 年、ゴードン・ムーアはチップに載る部品の数が毎年倍になっていることに気づいた。1975 年、彼はそれを 2 年ごとに改めた。彼は「18 か月ごと」とは予言していない。
  checked: ウェブ検索、2026-10-31

- id: intel-4004
  claim: >-
    1971 年 11 月 15 日に発売された Intel 4004 は、4 ビットのプロセッサ全体を一つのチップに収めた。10 マイクロメートルのプロセスで約 2,300 個のトランジスタ、約 740 kHz で動いた。
  checked: ウェブ検索、2026-10-31

- id: mg-silicon
  claim: >-
    石英の砂(二酸化ケイ素)を電気アーク炉で約 1900 °C 以上で炭素により還元すると、純度約 98〜99% の金属級シリコンが得られる。
  checked: ウェブ検索、2026-10-31

- id: siemens-process
  claim: >-
    シーメンス法では、金属級シリコンを塩化水素と反応させてトリクロロシランにする。これは蒸留で精製される液体で、それを熱したシリコンの棒(約 1100 °C)の上で分解すると、純度 99.99999% を超える電子級の多結晶シリコンが得られる。
  checked: ウェブ検索、2026-10-31

- id: czochralski
  claim: >-
    ヤン・チョクラルスキーは 1916 年に結晶の引き上げ法を発見した(1918 年発表)。ベル研究所のゴードン・ティールと J・B・リトルが 1948 年にそれを応用し、ゲルマニウムの単結晶を育てた。今日では、電子級シリコンを石英のるつぼで 1400 °C 以上に溶かし、種結晶から単結晶をゆっくり引き上げる。
  checked: ウェブ検索、2026-10-31

- id: switch-scales
  claim: >-
    スイッチの年表で使っている、歯車、リレー、真空管、トランジスタのおおよその大きさと切り替え時間。
  uncertain: >-
    説明のための大まかな桁であって、測定値ではない。
  checked: 桁の概算、2026-10-31
  note: >-
    比較のために選んだ説明用の桁であって、特定の素子の測定値ではない。実際の素子は大きくばらつく。

- id: eccles-jordan
  claim: >-
    1918 年 6 月、ウィリアム・エクルズと F・W・ジョーダンは、互いに結合した二本の真空管の回路の特許を出願した。設定した信号が消えたあとも二つの状態のどちらかにとどまる回路で、最初のフリップフロップである。のちに Colossus と ENIAC のコンピュータに使われた。
  checked: ウェブ検索と IEEE Spectrum の記事を読んで確認、2026-11-01

- id: core-memory
  claim: >-
    何人もが磁気コアメモリの特許を出願した。フレデリック・ヴィーヘが 1947 年、アン・ワンが 1949 年、ジャン・ラジチマン(RCA)が 1950 年、ジェイ・フォレスター(MIT)が 1951 年である。フォレスターの率いる MIT の Whirlwind コンピュータが、1953 年 8 月に初めてコアメモリを実演した。1,024 個のコアを並べた 32 × 32 の面で、問題の多かった蓄積管メモリに取って代わった。コアメモリは約 20 年間、1955 年ごろから 1975 年ごろまで、コンピュータのメモリの主流で、電源を切っても内容を保った。
  uncertain: >-
    誰がコアメモリを発明したかには異論がある。ワンの 1949 年の設計はコアを遅延線として使い、フォレスターのチームはそれを格子に編んでランダムアクセスにした。特許の争いは 1960 年代まで続いた。1953 年の正確な設置日も資料によって異なる。
  checked: ウェブ検索と Computer History Museum のページを読んで確認(今回は computerhistory.org にアクセスできた)、2026-11-01

- id: dennard-dram
  claim: >-
    IBM のロバート・デナードが、今日の DRAM の基礎である 1 トランジスタのメモリセル(トランジスタ一つとコンデンサ一つ)を考案した。米国特許 3,387,286 は 1968 年 6 月に認められた。IBM は当初、より危険が少ないと考えた 6 トランジスタのスタティックメモリ(SRAM)を代わりに載せたコンピュータを出荷した。
  uncertain: >-
    資料はこの着想を 1966 年または 1967 年としている。デナードは 1966 年末からこれに取り組み、1967 年に IBM のノートに記録した。
  checked: ウェブ検索と IEEE Spectrum の記事を読んで確認、2026-11-01

- id: intel-1103
  claim: >-
    1970 年 10 月に発表されたインテルの 1103 は、市販された最初の DRAM チップだった。1 ビットあたりトランジスタ 3 個で 1,024 ビットを保持し、多くのコンピュータで磁気コアメモリに取って代わった。
  checked: ウェブ検索と両方のページを読んで確認、2026-11-01

- id: harvard-architecture
  claim: >-
    ハーバード Mark I は命令を穿孔紙テープから読み、数は別の電気機械式カウンタに置いていた。命令とデータを別々のメモリに置くコンピュータは、これにちなんで「ハーバード・アーキテクチャ」とよく呼ばれる。
  uncertain: >-
    名前の由来には異論がある。リチャード・ポーソンの記事「The Myth of the Harvard Architecture」(IEEE Annals of the History of Computing、2022 年)は、この用語は数十年後にマイクロコントローラの設計の中で作られ、あとからハーバードの機械に当てはめられたものだと論じている(要旨は読んだ。全文は有料)。
  checked: ウェブ検索、2026-11-01。記事の要旨を読んで確認、2026-11-08

- id: risc
  claim: >-
    IBM のジョン・コックのもとのチームが 1975 年ごろに 801 を始めた。完全に RISC の流儀で作られた最初のコンピュータである。1980 年、デイビッド・パターソンとデイビッド・ディッツェルが「The Case for the Reduced Instruction Set Computer」を発表し、バークレーの RISC-I マイクロプロセッサのプロジェクトが 1980 年から 1982 年まで行われた。
  checked: ウェブ検索、2026-11-01

- id: arm-link-register
  claim: >-
    ARM プロセッサは「リンク付き分岐」でサブルーチンを呼び、戻りアドレスをリンクレジスタであるレジスタ r14 に保存する。最初の ARM チップ、エイコーンの ARM1 は 1985 年 4 月に動いた。
  checked: ウェブ検索、2026-11-01

- id: avr-harvard
  claim: >-
    マイクロチップ社の AVR マイクロコントローラは、プログラムとデータに別々のバスを使う。今の命令を実行しながら次の命令をフェッチするので、ほとんどの命令は 1 クロックサイクルで済む。
  checked: ウェブ検索、2026-11-01

- id: booth-contracted-notation
  claim: >-
    キャスリーン・ブースは、バークベックの ARC2 コンピュータのために、命令を 2 進数ではなく略号で書く記号的な「短縮記法(contracted notation)」を考案した。これは広く最初のアセンブリ言語とされている。アンドリュー・ブースとの 1947 年の報告書「General Considerations in the Design of an All-Purpose Electronic Digital Computer」がふつうの参照先である。
  uncertain: >-
    「最初のアセンブリ言語」はのちに付いた呼び名である。この用語が使われ始めたのは 1950 年代後半で、1947 年の報告書が示しているのはアセンブリ言語そのものではなく機械の言語の記法だと論じる記事もある。1947 年の一次資料は確認していない。
  checked: ウェブ検索、2026-11-01

- id: edsac-initial-orders
  claim: >-
    1949 年 5 月、デイビッド・ウィーラーはケンブリッジの EDSAC のための「初期命令(initial orders)」を書いた。英字の略号で書かれた紙テープからプログラムを読み、メモリに置く数十ワードである。1949 年の後半(資料により 8 月、9 月、10 月)にできた Initial Orders 2 は、アセンブラと再配置ローダを 41 命令に収めた。
  uncertain: >-
    世界最初のアセンブラとよく呼ばれるが、それは「最初」についての主張であり、ほかの初期のシステム(ブースの記法など)にも似た考えの功績があるとされる。
  checked: ウェブ検索、2026-11-01

- id: burroughs-b5000
  claim: >-
    ロバート・バートンの率いるチームが設計し、1961 年 5 月の Datamation で発表された Burroughs B5000 は、アセンブリではなく高水準言語(ALGOL 60)のために作られたスタックマシンだった。すべての算術がスタック上のオペランドを使うので、命令がレジスタや一時的な場所を名指しする必要はなかった。
  checked: ウェブ検索と両方のページを読んで確認、2026-11-01

- id: pascal-p-code
  claim: >-
    チューリッヒ工科大学のニクラウス・ヴィルトのグループは、Pascal コンパイラを Pascal-P として配布した。仮想スタックマシンのための p コードを出力するコンパイラと、そのインタプリタで、Pascal を新しいコンピュータに移すにはインタプリタだけを書けばよかった。Pascal-P2 をもとにし、1977 年に最初に公開された UCSD Pascal は、同じ考えの上に移植可能なシステム(p-System)を築いた。それは IBM が最初の IBM PC 向けに提供したオペレーティングシステムの一つだった。
  uncertain: >-
    最初の Pascal-P コンパイラの年は、一つの参照だけが 1973 年としている。章では B5000 の「その 10 年後」とだけ述べている。
  checked: ウェブ検索と UCSD Pascal の記事を読んで確認、2026-11-01

- id: jvm-operand-stack
  claim: >-
    Java 仮想マシンでは、メソッドが呼ばれるたびに、自分のローカル変数とオペランドスタックをもつ新しいフレームが作られる。命令はオペランドスタックからオペランドを取り、結果を戻す(iadd は int を二つポップして、その和をプッシュする)。ティム・リンドホルムとフランク・イェリンによる仕様の第 1 版は 1996 年に出た。
  checked: 仕様の 2.6 節と 2.6.2 節を読んで確認、2026-11-01

- id: webassembly-stack
  claim: >-
    WebAssembly Core Specification は 2019 年 12 月 5 日に W3C 勧告になった。そこには「The computational model of WebAssembly is based on a stack machine.」(WebAssembly の計算モデルはスタックマシンに基づく)とある。
  checked: 仕様の概要を読んで確認、2026-11-01

- id: hopper-a0
  claim: >-
    グレース・ホッパーは 1951 年から 1952 年に UNIVAC I のために A-0 システムを書いた。よく最初のコンパイラと呼ばれるが、今日の意味でのコンパイラというより、出来合いのルーチンをつなぐローダやリンカとして働いた。
  uncertain: >-
    「最初のコンパイラ」という呼び名には異論がある。記事自体が A-0 を「コンパイラに関連する初期の道具」と呼び、「ローダやリンカのように機能した」と述べている。
  checked: 記事を読んで確認、2026-11-01

- id: fortran-1957
  claim: >-
    ジョン・バッカスの率いるチームが IBM で作った最初の FORTRAN コンパイラは、1957 年 4 月に IBM 704 向けに提供された(最初のマニュアルは 1956 年 10 月に出た)。アセンブリ言語のプログラマが、その代わりに高水準言語を受け入れるほど効率の良いコードを生み出した。
  checked: 記事を読んで確認、2026-11-01

- id: c-language
  claim: >-
    C は 1969 年から 1973 年にかけてベル研究所で生まれ、最も創造的な時期は 1972 年だった。データ型が機械のワードだけだった B から育ち、変数に型を加えることは、デニス・リッチーが最初に行った変更の一つだった。
  checked: ウェブ検索、2026-11-01。ベル研究所にあるリッチーの論文はリクエストを拒否した(HTTP 403)ため、論文の文言は検索結果と大学のミラーで確認した

- id: gm-naa-io
  claim: >-
    GM-NAA I/O は 1956 年、ゼネラルモーターズ研究所のロバート・L・パトリックとノースアメリカン・アビエーションのオーウェン・モックが IBM 704 のために開発した。IBM 704 のための最初のオペレーティングシステムとされ、主な仕事は、今のプログラムが終わったら次のプログラムを自動的に始めること(バッチ処理)だった。
  checked: 記事を読んで確認、2026-11-01

- id: marsaglia-xorshift
  claim: >-
    ジョージ・マルサリアは「Xorshift RNGs」(Journal of Statistical Software 8(14)、2003 年)で、xorshift 乱数生成器を「simple, extremely fast random number generators」(単純で、きわめて速い乱数生成器)として説明した。
  checked: 学術誌の記事のページを読んで確認、2026-11-01

- id: tetris-origin
  claim: >-
    テトリスは、ソビエト科学アカデミーのドロドニーツィン計算センターのソフトウェア技術者アレクセイ・パジトノフが、1980 年代半ばにエレクトロニカ 60(PDP-11 のソビエト製の複製)の上で作った。パズルビデオゲームの市場を確立したとされている。
  uncertain: >-
    最初の版は 1984 年とも 1985 年ともされる(記事の制作の節は 1984〜1985 年を扱っている)ので、章では「1980 年代半ば」としている。記事は、テトリスがこのジャンルを生み出したというより、このジャンルで影響力があったと述べている。
  checked: 記事を読んで確認、2026-11-01
