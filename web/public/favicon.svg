<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The header's chip mark, drawn heavier so it reads at 16px. Ink on
       light tab bars, paper on dark ones. -->
  <style>
    .ink { stroke: #0a0a0a; fill: none; }
    .core { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ededed; }
      .core { fill: #ededed; }
    }
  </style>
  <path class="ink" stroke-width="2.2" stroke-linecap="round"
    d="M10 2.5v3.5M16 2.5v3.5M22 2.5v3.5M10 26v3.5M16 26v3.5M22 26v3.5M2.5 10h3.5M2.5 16h3.5M2.5 22h3.5M26 10h3.5M26 16h3.5M26 22h3.5"/>
  <rect class="ink" stroke-width="2.4" x="7" y="7" width="18" height="18" rx="3"/>
  <rect class="core" x="12" y="12" width="8" height="8" rx="1.5"/>
</svg>
