# Түвшин бүрийн нэр, зорилго, зөвлөмжийн монгол орчуулга. Зөвхөн
# суралцагчийн харах бичвэр (жишиг шийдэл биш). Түлхүүр нь level.toml-ын
# id; hints-ийн түлхүүрүүд level.toml-ын [hints]-тэй ижил байх ёстой.

nand:
  name: NAND
  goal: |
    NAND («БА биш») бүтээ: хоёр оролт хоёулаа 1 үед л гаралт 0 болно.
    NAND онцгой: бусад бүх логик хаалгыг зөвхөн NAND-аас бүтээж болно.
  hints:
    floating: "Оролтын хослол бүрд out нь VDD эсвэл GND-тэй холбогдох ёстой. Гаралтыг зөвхөн a ба b хоёулаа 1 үед GND руу татах ёстой: хоёр NMOS транзисторыг хэрхэн байрлуулбал хоёулаа асаалттай үед л гүйдэл дамжуулах вэ?"
    short: "Pull-up (PMOS) ба pull-down (NMOS) network хэзээ ч зэрэг асаалттай байх ёсгүй. Цуваа NMOS-ууд зөвхөн хоёр оролт 1 үед доош татна; PMOS сүлжээ нь түүний толин тусгал буюу зэрэгцээ байх ёстой."
    wrong: "NOT-тойгоо харьцуул: оролт бүрд нэг PMOS, нэг NMOS. GND рүү цуваа хоёр NMOS, VDD рүү зэрэгцээ хоёр PMOS."
    unknown: "Транзистор бүрийн gate оролттой холбогдсон уу?"

nor:
  name: NOR
  goal: |
    NOR («ЭСВЭЛ биш») бүтээ: хоёр оролт хоёулаа 0 үед л гаралт 1 болно.
    Зөвлөгөө: "энэ нь NAND-ийн толин тусгал."
  hints:
    floating: "Оролтын хослол бүрд out нь VDD эсвэл GND-тэй холбогдох ёстой. Гаралтыг зөвхөн хоёр оролт 0 үед VDD руу татах ёстой: хоёр PMOS транзисторыг хэрхэн байрлуулбал хоёулаа асаалттай үед л гүйдэл дамжуулах вэ?"
    short: "Pull-up ба pull-down network хэзээ ч зэрэг асаалттай байх ёсгүй. NOR-д NMOS pull-down network зэрэгцээ (аль ч оролт out-ыг 0 болгоно) тул PMOS pull-up network цуваа байх ёстой."
    wrong: "NOR нь NAND-ийн байрлалыг сольдог: VDD рүү цуваа хоёр PMOS, GND рүү зэрэгцээ хоёр NMOS."
    unknown: "Транзистор бүрийн gate оролттой холбогдсон уу?"

not:
  name: NOT
  goal: |
    Урвуулагч бүтээ: оролт 0 үед гаралт 1, оролт 1 үед гаралт 0 болно.
    Гаралтыг VDD-тэй холбох нэг PMOS, GND-тэй холбох нэг NMOS ашигла.
  hints:
    floating: "Оролтын утга бүрд нэг транзистор out-ыг тэжээлтэй холбох ёстой: PMOS (a = 0 үед асна) VDD-тэй, NMOS (a = 1 үед асна) GND-тэй."
    short: "Хоёр транзистор зэрэг асаж чадвал VDD ба GND холбогдоно. PMOS-ийн gate нь 0 үед, NMOS-ийн gate нь 1 үед асдаг: PMOS-ыг VDD талд, NMOS-ыг GND талд тавь."
    wrong: "Транзистор бүр аль тэжээлтэй холбогдсоныг шалга. PMOS нь VDD ба out-ын хооронд, NMOS нь out ба GND-ийн хооронд байх ёстой."
    unknown: "Транзистор бүрийн gate a оролттой холбогдсон уу?"

one:
  name: Тогтмол 1
  goal: |
    Гаралт нь үргэлж 1 байх бүрэлдэхүүн.
  hints:
    wrong: "Аль тэжээлийн шугам үргэлж 1 вэ?"
    floating: "out-ыг тэжээлийн шугамтай холбо."

zero:
  name: Тогтмол 0
  goal: |
    Гаралт нь үргэлж 0 байх бүрэлдэхүүн.
    Дараагийн давхаргууд тэжээлийн шугамыг шууд ашиглаж чадахгүй тул тогтмолуудыг энд нэг удаа бүтээж, цаашид эд анги болгон ашиглана.
  hints:
    wrong: "Аль тэжээлийн шугам үргэлж 0 вэ?"
    floating: "out-ыг тэжээлийн шугамтай холбо."

add16:
  name: ADD16
  goal: |
    16 битийн хоёр тоог нэм. 16 бүтэн нэмэгчийг гинжлэн холбо: гараар нэмэхтэй адил багана бүрийн carry дараагийн багана руу орно.
    Эхний баганад орж ирэх carry байхгүй: Тогтмол 0-оо ашигла. Сүүлийн баганаас гарах carry хаягдана, тиймээс 0xffff + 1 = 0.
  hints:
    wrong: "a-ийн i-р бит ба b-ийн i-р бит i-р бүтэн нэмэгч рүү орно; түүний carry i+1-р бүтэн нэмэгчийн c руу орно. Аль нэг carry баганаа алгассан уу?"

addc16:
  name: Carry-тэй ADD16
  goal: |
    16 битийн хоёр тоо ба орж ирэх carry (cin)-г нэмж, хамгийн дээд баганаас гарах carry-г (cout) бас гарга.
    Энэ нь carry гинжний хоёр үзүүрийг хөл болгон гаргасан ADD16. ALU-д эдгээр хэрэгтэй: cin = 1 нь a + NOT b-г хасах үйлдэл болгодог, cout нь үр дүнгийн тухай мэдээлэл өгнө.
  hints:
    wrong: "cin-ийг эхний бүтэн нэмэгчийн c руу оруулж, сүүлийн бүтэн нэмэгчийн carry-г cout болгон ав."

alu:
  name: ALU
  goal: |
    ALU (arithmetic logic unit) бүтээ: төв процессорын тооцоолдог хэсэг. Бид үүнийг хамтдаа зохиосон:
    - invb эхлээд b-ийн бүх битийг урвуулна (invb-тэй XOR).
    - f үр дүнг сонгоно: 0 = ADD (a + b + cin), 1 = AND, 2 = OR, 3 = XOR.
    - Flags: z = 1 хэрэв out нь 0; n = 1 хэрэв out сөрөг (дээд бит нь); c = нэмэгчийн гарах carry, AND/OR/XOR үед 0.
    Ингэснээр a − b нь invb = 1, cin = 1 үеийн ADD болно.
  hints:
    wrong: "Шатлан бүтээ: b-г XOR16-аар урвуул (invb-г хуваалцаж), a ба урвуулсан b-ийн ADD, AND, OR, XOR-ыг тооц, дараа нь 4 замт MUX16-аар f-ийн дагуу нэгийг сонго. Дараа нь flags: n нь үр дүнгийн 15-р бит; z нь NOT (аль нэг бит 1); c нь нэмэгчийн cout, гэхдээ зөвхөн f = 0 үед."

and:
  name: AND
  goal: |
    AND бүтээ: хоёр оролт хоёулаа 1 үед л гаралт 1 болно.
    Эндээс эхлэн транзистороор биш, өөрийн бүтээсэн хаалгануудаар бүтээнэ. AND нь араас нь NOT залгасан NAND.
  hints:
    wrong: "AND нь NAND-ийн эсрэг. NAND-ийн гаралтыг NOT руу оруулбал юу гарах вэ?"
    floating: "NOT-ийн гаралт out-тай, NAND-ийн гаралт NOT-ийн оролттой холбогдсон уу?"
    unknown: "NAND-ийн хоёр оролт хоёулаа холбогдсон уу?"

and16:
  name: AND16
  goal: |
    16 битийн AND бүтээ: a-ийн бит бүрийг b-ийн ижил битэй AND хий.
  hints:
    wrong: "Давтах-ыг ашигла: 16 удаа давтсан нэг хаалга бүх 16 бит дээр зэрэг ажиллана."

dmux:
  name: Demultiplexer
  goal: |
    Demultiplexer (DMUX) бүтээ: MUX-ын эсрэг. sel нь 0 үед оролтоо a гаралт руу, 1 үед b гаралт руу илгээнэ. Нөгөө гаралт 0 байна.
  hints:
    wrong: "a гаралт нь «in AND NOT sel», b гаралт нь «in AND sel» байх ёстой."

dmux4way:
  name: 4 замт demultiplexer
  goal: |
    Оролтыг дөрвөн гаралтын нэг рүү илгээ: sel = 0 → a, 1 → b, 2 → c, 3 → d. Бусад гаралт 0.
    sel-ийг хоёр бит болгон салга. Дээд бит (1-р бит) хосыг сонгоно (a/b эсвэл c/d), доод бит (0-р бит) хос доторх нэгийг сонгоно. Гурван DMUX хангалттай.
  hints:
    wrong: "sel-ийн 1-р бит a/b хос ба c/d хосын хооронд сонгох ёстой; 0-р бит хос дотроо сонгоно."

dmux8way:
  name: 8 замт demultiplexer
  goal: |
    Оролтыг 3 битийн sel-ээр сонгосон a-аас h хүртэлх найман гаралтын нэг рүү илгээ. RAM8 үүнийг «load»-ыг найман регистрийнхээ яг нэг рүү нь илгээхэд ашиглана.
    sel-ийн дээд бит (2-р бит) хоёр 4 замт DMUX-ын хооронд сонгож, хоёуланд нь sel-ийн доод хоёр битийг өг.
  hints:
    wrong: "sel-ийн 2-р бит хагасыг сонгоно (a–d эсвэл e–h); 0 ба 1-р битүүд 2 битийн тоо болгон нийлүүлэгдэж хагас дотроо сонгоно."

fulladder:
  name: Бүтэн нэмэгч
  goal: |
    Гурван битийг нэм: a, b ба баруун талын баганаас орж ирэх carry c. Энэ нь бичгээр нэмэх үйлдлийн нэг багана.
  hints:
    wrong: "a ба b-г нэг хагас нэмэгчээр нэмээд, тэр нийлбэр дээр c-г хоёр дахь хагас нэмэгчээр нэм. Аль нэг хагас нэмэгч carry гаргавал гарах carry байна."

halfadder:
  name: Хагас нэмэгч
  goal: |
    Хоёр битийг нэм. Үр дүн 0, 1 эсвэл 2 байж болох тул хоёр гаралтын бит хэрэгтэй: sum (нэгжийн орон) ба carry (хоёрын орон).
  hints:
    wrong: "sum баганыг XOR-ын үнэний хүснэгттэй, carry баганыг AND-ынхтай харьцуул."

inc16:
  name: INC16
  goal: |
    16 битийн тоон дээр 1 нэм. ADD16-аа хоёр дахь оролтод нь 1 тоотой ашигла: 16 битийн 1-ийг тогтмолуудаас joiner-ээр бүтээ.
  hints:
    wrong: "Хоёртын тоололд 1 нь 0-р бит = 1, бусад бүх бит 0."

mux:
  name: Multiplexer
  goal: |
    Multiplexer (MUX) бүтээ: өгөгдлийн унтраалга. sel нь 0 үед гаралт a-г, 1 үед b-г хуулна.
    MUX-ууд компьютерт утгуудын хооронд сонгох боломж олгодог, жишээ нь аль регистрийг унших.
  hints:
    wrong: "a-г зөвхөн sel 0 үед нэвтрүүл (NOT sel-тэй AND хий), b-г зөвхөн sel 1 үед нэвтрүүл, дараа нь хоёрыг OR хий."

mux16:
  name: MUX16
  goal: |
    16 битийн MUX бүтээ: нэг sel битээр 16 битийн хоёр тооны хооронд сонго.
    MUX-аа 16 удаа давт, гэхдээ бүх хуулбар нэг sel-ийг хуваалцах ёстой.
  hints:
    wrong: "MUX-ыг ×16 давтаж, sel-ийг хуваалцсан гэж тэмдэглэ, тэгвэл хуулбар бүр нэг сонголтын битийг уншина."

mux4way16:
  name: 4 замт MUX16
  goal: |
    2 битийн sel-ээр 16 битийн дөрвөн оролтын нэгийг сонго: 0 нь a, 1 нь b, 2 нь c, 3 нь d.
    sel-ийг хоёр бит болгон салга. Нэг бит хос дотроо, нөгөө нь хосуудын хооронд сонгоно.
  hints:
    wrong: "sel-ийн 0-р бит a/b ба c/d-ээс сонгоно; 1-р бит тэр хоёр үр дүнгийн хооронд сонгоно."

mux8way16:
  name: 8 замт MUX16
  goal: |
    3 битийн sel-ээр a-аас h хүртэлх 16 битийн найман оролтын нэгийг сонго. RAM8 үүнийг тухайн хаяг дахь регистрийг уншихад ашиглана.
    Хоёр 4 замт MUX16 тус бүр sel-ийн доод хоёр битээр өөрийн хагасаас нэгийг сонгоно; дараа нь MUX16 sel-ийн дээд битээр тэдгээрийн хооронд сонгоно.
  hints:
    wrong: "sel-ийн дээд бит (2-р бит) a–d хагас ба e–h хагасын хооронд сонгоно."

not16:
  name: NOT16
  goal: |
    16 битийн NOT бүтээ: bus-ын бүх 16 битийг зэрэг урвуул.
    Bus гэдэг нь бүхэл тоо дамжуулдаг утасны багц. NOT-оо Давтах ×16-тай ашигла.
  hints:
    wrong: "Давтах-ыг ашигла: 16 удаа давтсан нэг хаалга бүх 16 бит дээр зэрэг ажиллана."

or:
  name: OR
  goal: |
    OR бүтээ: аль нэг оролт 1 (эсвэл хоёулаа) үед гаралт 1 болно.
    Зөвлөгөө: "OR нь зөвхөн хоёр оролт 0 үед 0 байдаг. Урвуулсан оролтуудтай NAND юу хийхийг бод."
  hints:
    wrong: "NAND хоёр оролт хоёулаа 1-ээс бусад үед 1 гаргадаг. a ба b-г эхлээд урвуулбал урвуулсан хоёр оролт хэзээ хоёулаа 1 байх вэ?"

or16:
  name: OR16
  goal: |
    16 битийн OR бүтээ: a-ийн бит бүрийг b-ийн ижил битэй OR хий.
  hints:
    wrong: "Давтах-ыг ашигла: 16 удаа давтсан нэг хаалга бүх 16 бит дээр зэрэг ажиллана."

or8way:
  name: OR8WAY
  goal: |
    8 замт OR бүтээ: 8 оролтын битийн аль нэг нь 1 бол гаралт 1.
    Bus-ыг нэг битүүдэд салгаад, OR-уудаар нийлүүл.
  hints:
    wrong: "Splitter-ээр 8 битийг ав, дараа нь хоёр хоёроор нь OR хий: мод хэлбэр хамгийн хурдан."

xor:
  name: XOR
  goal: |
    XOR («онцгой ЭСВЭЛ») бүтээ: оролтууд ялгаатай үед гаралт 1 болно.
    Энэ нь хоёр битийг (carry-г тооцохгүйгээр) нэмдэг хаалга.
  hints:
    wrong: "XOR нь «a OR b, гэхдээ хоёулаа биш». Аль хаалга «хоёулаа биш» гэдгийг хэлдэг вэ?"

xor16:
  name: XOR16
  goal: |
    16 битийн XOR бүтээ: a-ийн бит бүрийг b-ийн ижил битэй XOR хий.
    XOR бас удирдаж болох урвуулагч: x XOR 0 = x, харин x XOR 1 = NOT x. ALU тань үүнийг B-г хүссэн үедээ урвуулахад ашиглана.
  hints:
    wrong: "Давтах-ыг ашигла: 16 удаа давтсан нэг хаалга бүх 16 бит дээр зэрэг ажиллана."

bit:
  name: Бит
  goal: |
    1 битийн регистр: таны удирддаг санах ой. clk-ийн өсөх ирмэг бүр дээр load нь 1 бол d-г хадгална; load нь 0 бол байгаа битээ хадгалсаар байна.
    Flip-flop өсөх ирмэг бүр дээр ямар нэг зүйл хадгалдаг тул юу хадгалахыг нь сонго: MUX өөрийнх нь гаралт q (хадгалах) эсвэл d (ачаалах)-ийн аль нэгийг сонгоно.
  hints:
    wrong: "load=0 үед flip-flop өөрийн гаралтаа дахин хадгалах ёстой. q-г MUX руу буцааж оруулж, load-оор q ба d-ийн хооронд сонгуул."
    unknown: "Ачаалсны дараа q тодорхойгүй хэвээр байвал MUX-ын гаралт flip-flop-ын d-д, clk flip-flop-д хүрч байгаа эсэхийг шалга."

dff:
  name: D flip-flop
  goal: |
    Flip-flop зөвхөн нэг агшинд өөрчлөгддөг: clk 0-ээс 1 болоход q нь d-ийн утгыг авна. Бусад үед d юу ч хийсэн q хадгалсаар байна. Бүх flip-flop-ыг зэрэг цохилуулдаг clock компьютерийг алхам алхмаар хөдөлгөдөг.
    Хоёр D latch-ийг гинжлэн холбо. Эхнийх (эзэн) clk 0 үед нээлттэй; хоёр дахь (дагагч) clk 1 үед нээлттэй. Хэзээ ч хоёулаа зэрэг нээлттэй байдаггүй.
  hints:
    wrong: "clk 1 хэвээр байхад q өөрчлөгдөж байвал та flip-flop биш, latch бүтээжээ. Хоёр дахь latch зөвхөн эхнийх нь хаалттай үед нээгдэх ёстой: тэдэнд эсрэг идэвхжүүлэлт, clk ба NOT clk өг."
    unknown: "Эхний өсөх ирмэг хүртэл юу ч хадгалагдахгүй. Түүний дараа ч q тодорхойгүй бол эзэн latch-ийн гаралт дагагчийн d руу орж байгаа эсэхийг шалга."

dlatch:
  name: D latch
  goal: |
    Latch-ийг хэрэглэхэд хялбар болго: тусдаа тохируулах, арилгах оролтын оронд нэг өгөгдлийн оролт d. en (идэвхжүүлэх) 1 үед q нь d-г дагана. en буцаж 0 болоход q тэр агшин дахь d-ийн утгыг хадгална.
    SR latch-ээ ашигла: d нь 1 ба en нь 1 үед тохируулж, d нь 0 ба en нь 1 үед арилга.
  hints:
    wrong: "en 0 үед тохируулах ч, арилгах ч 1 байж болохгүй, тэгвэл latch хадгална. en 1 үед d-ээс хамаарч яг нэг нь 1 байна."
    unknown: "en дор хаяж нэг удаа 1 болох хүртэл latch тодорхойгүй. en хоёр AND хаалганд хүрч байгаа эсэхийг шалга."

pc:
  name: Програмын тоолуур
  goal: |
    Програмын тоолуур дараагийн зааврын хаягийг хадгална. clk-ийн өсөх ирмэг бүр дээр: reset 1 бол 0 болно; үгүй бол load 1 бол d болно (үсрэлт); үгүй бол inc 1 бол нэгээр нэмэгдэнэ; эсвэл утгаа хадгална.
    Ирмэг бүр дээр ачаалдаг Регистр ашиглаж, юу ачаалахыг гурван MUX16-ийн гинжээр сонго: хадгалах эсвэл q+1 (inc), дараа нь d (load), дараа нь 0 (reset). Сүүлийнх нь шийддэг тул reset хамгийн сүүлд байна.
  hints:
    wrong: "Эрэмбэ нь reset, дараа нь load, дараа нь inc. MUX-уудын гинжинд сүүлийнх нь шийддэг тул reset-ийн MUX-ыг хамгийн төгсгөлд, регистрийн яг өмнө тавь."
    unknown: "Эхний reset эсвэл load хүртэл тоолуур тодорхойгүй. reset-ийн дараа ч тодорхойгүй бол регистр ирмэг бүр дээр ачаалж байгаа эсэхийг (load = 1) шалга."

ram4k:
  name: RAM4K
  goal: |
    Найман RAM512-оос бүтсэн 4,096 үгийн санах ой. Хаяг нь 12 бит: дээд 3 бит аль RAM512-ыг сонгох, доод 9 бит түүн доторх хаяг.
    addr-ыг салгаж, доод битүүдийг RAM512 бүрд зориулан нэг 9 битийн хаяг болгон нийлүүлж, дээд 3 битийг DMUX8WAY (load-д) ба MUX8WAY16 (q-д)-тай RAM8-ийнх шиг ашигла.
  hints:
    wrong: "addr-ын дээд 3 бит RAM512-ыг сонгоно; доод 9 бит RAM512 бүрд өөрийнх нь хаяг болж очно. Splitter-ийн аль битүүд аль joiner рүү орж байгааг шалга."
    unknown: "Үг дотор юм хадгалах хүртэл тодорхойгүй уншигдана. Нэг RAM512 руу бичих нь бусдад нөлөөлөх ёсгүй."

ram512:
  name: RAM512
  goal: |
    Найман RAM64-өөс бүтсэн 512 үгийн санах ой. Хаяг нь 9 бит: дээд 3 бит аль RAM64-ийг сонгох, доод 6 бит түүн доторх хаяг.
    addr-ыг салгаж, доод битүүдийг RAM64 бүрд зориулан нэг 6 битийн хаяг болгон нийлүүлж, дээд 3 битийг DMUX8WAY (load-д) ба MUX8WAY16 (q-д)-тай RAM8-ийнх шиг ашигла.
  hints:
    wrong: "addr-ын дээд 3 бит RAM64-ийг сонгоно; доод 6 бит RAM64 бүрд өөрийнх нь хаяг болж очно. Splitter-ийн аль битүүд аль joiner рүү орж байгааг шалга."
    unknown: "Үг дотор юм хадгалах хүртэл тодорхойгүй уншигдана. Нэг RAM64 руу бичих нь бусдад нөлөөлөх ёсгүй."

ram64:
  name: RAM64
  goal: |
    Найман RAM8-аас бүтсэн 64 үгийн санах ой. Хаяг нь 6 бит: дээд 3 бит аль RAM8-ыг сонгох, доод 3 бит түүн доторх хаяг.
    addr-ыг салгаж, доод битүүдийг RAM8 бүрд зориулан нэг 3 битийн хаяг болгон нийлүүлж, дээд 3 битийг DMUX8WAY (load-д) ба MUX8WAY16 (q-д)-тай RAM8-ийнх шиг ашигла.
  hints:
    wrong: "addr-ын дээд 3 бит RAM8-ыг сонгоно; доод 3 бит RAM8 бүрд өөрийнх нь хаяг болж очно. Splitter-ийн аль битүүд аль joiner рүү орж байгааг шалга."
    unknown: "Үг дотор юм хадгалах хүртэл тодорхойгүй уншигдана. Нэг RAM8 руу бичих нь бусдад нөлөөлөх ёсгүй."

ram8:
  name: RAM8
  goal: |
    Хаягтай санах ой: 16 битийн найман регистр. q нь үргэлж addr дахь регистрийг харуулна. clk-ийн өсөх ирмэг дээр load=1 үед d нь addr дахь регистрт, зөвхөн тэнд хадгалагдана.
    load-ыг DMUX8WAY (sel = addr)-аар нэг регистр рүү илгээж, сонгосон регистрийг MUX8WAY16 (sel = addr)-аар унш. Регистр бүр ижил d ба clk авна.
  hints:
    wrong: "Зөвхөн addr дахь регистр ачаалж болно: load-ыг бүх регистр рүү шууд биш, DMUX-аар дамжуул. Мөн ижил addr-тай MUX-аар унш."
    unknown: "Регистрт юм хадгалах хүртэл тодорхойгүй уншигдана. Бичсэн хаяг дээр q тодорхойгүй хэвээр бол clk ба d бүх регистрт хүрч байгаа эсэхийг шалга."

register:
  name: Регистр
  goal: |
    16 битийн регистр: хамт ачаалагддаг, хажуу хажуудаа байрлах арван зургаан Бит. clk-ийн өсөх ирмэг дээр load=1 үед 16 битийн d тоог хадгална; эс бөгөөс тоогоо хадгалсаар байна.
    Бит-ээ Давтах ×16-аар давтаж, load ба clk-ийг хуваалц, тэгвэл хуулбар бүр ижил утгыг авна.
  hints:
    wrong: "Бит-ийн хуулбар бүрд ижил load ба clk хэрэгтэй: хоёуланд нь «хуваалцах»-ыг тэмдэглэ. d ба q бит битээр хуваагдана."

srlatch:
  name: SR latch
  goal: |
    Анхны санах ойгоо бүтээ. s-ийг 1 болговол q нь 1 болно; r (арилгах)-ийг 1 болговол q нь 0 болно. Хоёулаа 0 рүү буцахад q сүүлийн утгаа хадгална: хэлхээ санаж үлдэнэ.
    Хоёр NOR хаалга ашигла, тус бүрийн гаралтыг нөгөөгийнх нь оролттой холбо. Тэр гогцоо нь санах ой. s ба r-ийг зэрэг 1 болгож болохгүй.
  hints:
    wrong: "s=0 ба r=0 үед q өмнөх утгаа хадгалах ёстой. Үүнд эргэх холбоо хэрэгтэй: NOR бүрийн гаралтыг нөгөө NOR-ын оролттой холбо."
    unknown: "Latch анх тохируулагдах эсвэл арилгагдах хүртэл тодорхойгүй (X). s=1 болсны дараа ч q нь X хэвээр бол s ба r тус бүр нэг NOR-т хүрч байгаа эсэх, q нь NOR-ын гаралтаас ирж байгаа эсэхийг шалга."
