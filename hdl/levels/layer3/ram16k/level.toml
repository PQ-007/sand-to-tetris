id = "ram16k"
name = "RAM16K"
layer = 3
goal = """
16,384 words: the computer's main memory, from four RAM4Ks. The address is 14 bits: the top 2 choose the RAM4K, the low 12 are the address inside it.
It's the same pattern as RAM4K, with a DMUX4WAY for load and a MUX4WAY16 for q.
"""
sequential = true
inputs = ["d", "addr", "load", "clk"]
outputs = ["q"]
requires = ["ram4k", "dmux4way", "mux4way16"]
widths = { d = 16, addr = 14, q = 16 }
model = "ram16k"
random_tests = 200
truth_table = """
d addr load clk | q
100 0 1 0 | -
100 0 1 1 | 100
200 4096 1 0 | -
200 4096 1 1 | 200
300 16383 1 0 | -
300 16383 1 1 | 300
0 0 0 0 | 100
0 4096 0 0 | 200
0 8192 0 0 | -
400 8192 1 0 | -
400 8192 1 1 | 400
0 16383 0 0 | 300
0 4096 0 1 | 200
"""

[hints]
wrong = "The top 2 bits of addr (bits 12 and 13) pick the RAM4K; the low 12 bits go to every RAM4K as its own address."
unknown = "A word reads as unknown until something is stored in it. Writing to one RAM4K must not disturb the others."
