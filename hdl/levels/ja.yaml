# 各レベルの名前・目標・ヒントの日本語訳。学習者が見る文章だけ(参照解答では
# ない)。キーは level.toml の id。hints のキーは level.toml の [hints] と同じで
# なければならない。用語は docs/ja/TERMS.md。

nand:
  name: NAND
  goal: |
    NAND(「AND ではない」)を作る: 2 つの入力が両方 1 のときだけ出力が 0 になる。
    NAND は特別: ほかのすべての論理ゲートは NAND だけで作れる。
  hints:
    nudge: "a と b が両方 1 のときだけ out は 0 になる。そのとき out を GND につなぐには、どのトランジスタが両方オンになればよいか?"
    floating: "どの入力の組み合わせでも、out は VDD か GND につながらなければならない。出力を GND へ引き下げるのは a と b が両方 1 のときだけ: 2 つの NMOS トランジスタをどう並べれば、両方オンのときだけ電流が流れるか?"
    short: "プルアップ(PMOS)とプルダウン(NMOS)の回路網が同時にオンになってはいけない。直列の NMOS は両方の入力が 1 のときだけ引き下げる。PMOS の回路網はその鏡像、つまり並列にする。"
    wrong: "NOT と比べてみよう: 入力ごとに PMOS と NMOS を 1 個ずつ。GND へは NMOS 2 個を直列に、VDD へは PMOS 2 個を並列に。"
    unknown: "すべてのトランジスタのゲートが入力につながっているか?"

nor:
  name: NOR
  goal: |
    NOR(「OR ではない」)を作る: 2 つの入力が両方 0 のときだけ出力が 1 になる。
    ヒント: NAND の鏡像。
  hints:
    nudge: "NOR は NAND の鏡像: 両方の入力が 0 のときだけ out は 1。直列だったものが並列に、並列だったものが直列になる。"
    floating: "どの入力の組み合わせでも、out は VDD か GND につながらなければならない。出力を VDD へ引き上げるのは両方の入力が 0 のときだけ: 2 つの PMOS トランジスタをどう並べれば、両方オンのときだけ電流が流れるか?"
    short: "プルアップとプルダウンの回路網が同時にオンになってはいけない。NOR では NMOS のプルダウンが並列(どちらの入力でも out を 0 にする)なので、PMOS のプルアップは直列でなければならない。"
    wrong: "NOR は NAND の並びを入れ替えたもの: VDD へは PMOS 2 個を直列に、GND へは NMOS 2 個を並列に。"
    unknown: "すべてのトランジスタのゲートが入力につながっているか?"

not:
  name: NOT
  goal: |
    インバータを作る: 入力が 0 のとき出力は 1、入力が 1 のとき出力は 0。
    PMOS 1 個で出力を VDD に、NMOS 1 個で出力を GND につなぐ。
  hints:
    nudge: "PMOS はゲートが 0 のとき、NMOS はゲートが 1 のとき電流を通す。それぞれ 1 個で足り、両方のゲートを a につなぐ。"
    floating: "入力のどの値でも、トランジスタの一つが out を電源につながなければならない: PMOS(a = 0 でオン)は VDD へ、NMOS(a = 1 でオン)は GND へ。"
    short: "両方のトランジスタが同時にオンになれると、VDD と GND がつながってしまう。PMOS はゲートが 0 でオン、NMOS はゲートが 1 でオン: PMOS を VDD 側に、NMOS を GND 側に置く。"
    wrong: "各トランジスタがどの電源につながっているか確かめよう。PMOS は VDD と out の間に、NMOS は out と GND の間に置く。"
    unknown: "すべてのトランジスタのゲートが入力 a につながっているか?"

one:
  name: 定数 1
  goal: |
    出力がいつも 1 になる部品。
  hints:
    nudge: "定数には入力がまったくない: out を、いつも 1 であるものにつなぐだけでよい。"
    wrong: "いつも 1 なのはどちらの電源レールか?"
    floating: "out を電源レールにつなごう。"

zero:
  name: 定数 0
  goal: |
    出力がいつも 0 になる部品。
    後の層ではむき出しの電源レールが使えないので、ここで一度だけ定数を作り、それからは部品として使う。
  hints:
    nudge: "定数 1 と同じ考えで、もう一方の電源レールを使う。"
    wrong: "いつも 0 なのはどちらの電源レールか?"
    floating: "out を電源レールにつなごう。"

add16:
  name: ADD16
  goal: |
    2 つの 16 ビットの数を足す。全加算器を 16 個つなぎ、各列のキャリーを次の列に送る。手で足し算をするように。
    最初の列には入ってくるキャリーがない: 定数 0 を使う。最後の列からのキャリーは捨てられるので、0xffff + 1 = 0 になる。
  hints:
    nudge: "紙の上で足すように、右から一列ずつ足す: 各列のキャリーが次の列に入る。"
    wrong: "a のビット i と b のビット i が全加算器 i に入り、そのキャリーが全加算器 i+1 の c に入る。列を飛ばしたキャリーはないか?"

addc16:
  name: キャリー付き ADD16
  goal: |
    2 つの 16 ビットの数と入力キャリー(cin)を足し、最上位の列からのキャリー出力(cout)も出す。
    キャリーの連鎖の両端をピンとして外に出した ADD16。ALU にはこれが必要: cin = 1 で a + NOT b が引き算になり、cout は結果について教えてくれる。
  hints:
    nudge: "ADD16 と同じだが、最初の列は外からキャリーを受け取り、最後の列のキャリーを外に出す。"
    wrong: "cin を最初の全加算器の c に入れ、最後の全加算器のキャリーを cout にする。"

alu:
  name: ALU
  goal: |
    算術論理演算装置を作る: CPU の中で計算をする部分。一緒に設計したもの:
    - invb はまず b の全ビットを反転する(invb との XOR)。
    - f が結果を選ぶ: 0 = ADD(a + b + cin)、1 = AND、2 = OR、3 = XOR。
    - フラグ: out が 0 なら z = 1、out が負(最上位ビット)なら n = 1、c = 加算器のキャリー出力(AND/OR/XOR では 0)。
    これで、a − b は invb = 1、cin = 1 の ADD になる。
  hints:
    nudge: "考えられる結果(ADD、AND、OR、XOR)を全部一度に計算し、f にどれか一つを選ばせる。フラグは最後に。"
    wrong: "段階ごとに: XOR16 で b を反転(invb は共有)し、a と反転した b の ADD、AND、OR、XOR を計算して、4 ウェイ MUX16 に f で一つ選ばせる。次にフラグ: n は結果のビット 15、z は NOT(どれかのビットが 1)、c は加算器の cout だが f = 0 のときだけ。"

and:
  name: AND
  goal: |
    AND を作る: 両方の入力が 1 のときだけ出力が 1 になる。
    ここからはトランジスタではなく、自分で作ったゲートで組み立てる。AND は NAND の後に NOT を置いたもの。
  hints:
    nudge: "もう NAND がある。それは AND の後に NOT が続いたもの。NOT を打ち消すにはどうすればよいか?"
    wrong: "AND は NAND の逆。NAND の出力を NOT に入れると何が得られるか?"
    floating: "NOT の出力が out に、NAND の出力が NOT の入力につながっているか?"
    unknown: "NAND の両方の入力がつながっているか?"

and16:
  name: AND16
  goal: |
    16 ビットの AND を作る: a の各ビットと b の同じビットの AND をとる。
    バスは、一つの数を運ぶ配線の束。AND を繰り返し ×16 で使う: 1 つのゲートを、ビットごとに 1 つずつ複製する。
  hints:
    nudge: "AND を 16 個置かなくてよい: AND を 1 つ選び、オプションで繰り返し ×16 にする。すると a、b、out はそれぞれバス 1 本で済む。"
    wrong: "繰り返しを使おう: 16 回繰り返した 1 つのゲートが、16 ビット全部に一度に働く。"

dmux:
  name: デマルチプレクサ
  goal: |
    デマルチプレクサ(DMUX)を作る: MUX の逆。sel が 0 なら入力を出力 a に、1 なら出力 b に送る。もう一方の出力は 0。
  hints:
    nudge: "各出力は「in、ただし sel がそう言うときだけ」。別の信号が 1 のときだけ信号を通すゲートはどれか?"
    wrong: "出力 a は「in AND NOT sel」、出力 b は「in AND sel」にする。"

dmux4way:
  name: 4 ウェイ デマルチプレクサ
  goal: |
    入力を 4 つの出力のどれか一つに送る: sel = 0 → a、1 → b、2 → c、3 → d。ほかの出力は 0。
    sel を 2 つのビットに分ける。上位ビット(ビット 1)が組(a/b か c/d)を、下位ビット(ビット 0)が組の中を選ぶ。デマルチプレクサ 3 個で足りる。
  hints:
    nudge: "4 ウェイ MUX16 を逆にしたように、2 段階で送る: まず組へ、次に組の中へ。"
    wrong: "sel のビット 1 で a/b の組と c/d の組を選び、ビット 0 で組の中を選ぶ。"

dmux8way:
  name: 8 ウェイ デマルチプレクサ
  goal: |
    入力を、3 ビットの sel で選んだ 8 つの出力 a〜h のどれか一つに送る。RAM8 はこれで「load」を 8 つのレジスタのちょうど一つに送る。
    sel の最上位ビット(ビット 2)で 2 つの 4 ウェイ デマルチプレクサのどちらかを選び、両方に sel の下位 2 ビットを与える。
  hints:
    nudge: "sel の最上位ビットで半分を選び、それぞれの半分では 4 ウェイ デマルチプレクサに下位ビットを任せる。"
    wrong: "sel のビット 2 が半分(a–d か e–h)を選ぶ。ビット 0 と 1 を 2 ビットの数にまとめたものが、半分の中を選ぶ。"

fulladder:
  name: 全加算器
  goal: |
    3 つのビットを足す: a、b と、右の列から入ってくるキャリー c。筆算の足し算の一列分。
  hints:
    nudge: "全加算器は 3 ビットを足す。3 つの数は 2 つずつ足せる。"
    wrong: "半加算器 1 つで a と b を足し、2 つ目でその和に c を足す。どちらかの半加算器が桁上げすれば、キャリーが出る。"

halfadder:
  name: 半加算器
  goal: |
    2 つのビットを足す。結果は 0、1、2 のどれかなので、出力ビットが 2 つ要る: sum(1 の位)と carry(2 の位)。
  hints:
    nudge: "2 ビットを足すと答えは 2 ビット: 1 + 1 = 10。sum と carry の列を、知っているゲートと比べてみよう。"
    wrong: "sum の列を XOR の真理値表と、carry の列を AND の真理値表と比べよう。"

inc16:
  name: INC16
  goal: |
    16 ビットの数に 1 を足す。ADD16 の 2 つ目の入力に数 1 を与える: 16 ビットの 1 を、定数とジョイナで作る。
  hints:
    nudge: "a + 1 は足し算。どの 16 ビットの数を足すか、それを定数からどう作るか?"
    wrong: "数 1 を 2 進数で書くと、ビット 0 が 1 で、ほかのビットはすべて 0。"

mux:
  name: マルチプレクサ
  goal: |
    マルチプレクサ(MUX)を作る: データのスイッチ。sel が 0 なら出力は a を、1 なら b を写す。
    マルチプレクサのおかげで、コンピュータは値の中から選べる。例えば、どのレジスタを読むか。
  hints:
    nudge: "a 用と b 用の 2 つのゲートを考えよう。それぞれ、sel が正しい値のときだけ入力を通す。そして 2 つを合わせる。"
    wrong: "a は sel が 0 のときだけ通し(NOT sel と AND をとる)、b は sel が 1 のときだけ通して、2 つの OR をとる。"

mux16:
  name: MUX16
  goal: |
    16 ビットのマルチプレクサを作る: 1 つの sel ビットで、2 つの 16 ビットの数のどちらかを選ぶ。
    MUX を 16 回繰り返すが、すべての複製が同じ sel を共有しなければならない。
  hints:
    nudge: "また繰り返し ×16 だが、どの複製も同じ sel を読まなければならない。繰り返した部品のオプションの一つが、まさにそれをする。"
    wrong: "MUX を ×16 繰り返し、sel を共有にして、すべての複製が同じ選択ビットを読むようにする。"

mux4way16:
  name: 4 ウェイ MUX16
  goal: |
    2 ビットの sel で 4 つの 16 ビット入力から一つを選ぶ: 0 は a、1 は b、2 は c、3 は d。
    sel を 2 つのビットに分ける。一方のビットが組の中を、もう一方が組の間を選ぶ。
  hints:
    nudge: "2 段階で選ぶ: まず a と b の間、c と d の間で選び、次に 2 つの勝者の間で選ぶ。"
    wrong: "sel のビット 0 で a/b と c/d を選び、sel のビット 1 でその 2 つの結果から選ぶ。"

mux8way16:
  name: 8 ウェイ MUX16
  goal: |
    3 ビットの sel で 8 つの 16 ビット入力 a〜h から一つを選ぶ。RAM8 はこれで、アドレスのレジスタを読む。
    4 ウェイ MUX16 が 2 つ、それぞれ sel の下位 2 ビットで自分の半分から一つを選び、MUX16 が sel の最上位ビットでそのどちらかを選ぶ。
  hints:
    nudge: "4 ウェイ MUX16 がある: 8 つの入力を 4 つずつ 2 組に分けよう。"
    wrong: "sel の最上位ビット(ビット 2)が、a–d の半分と e–h の半分のどちらかを選ぶ。"

not16:
  name: NOT16
  goal: |
    16 ビットの NOT を作る: バスの 16 ビットすべてを一度に反転する。
    バスは、一つの数を運ぶ配線の束。NOT を繰り返し ×16 で使う。
  hints:
    nudge: "NOT を 16 個置かなくてよい: 繰り返し ×16 にした NOT 1 つ(部品のオプションで設定)が、バスをまるごと受け取る。"
    wrong: "繰り返しを使おう: 16 回繰り返した 1 つのゲートが、16 ビット全部に一度に働く。"

or:
  name: OR
  goal: |
    OR を作る: どちらかの入力(または両方)が 1 なら出力が 1 になる。
    ヒント: OR が 0 になるのは両方の入力が 0 のときだけ。反転した入力で NAND が何をするか考えよう。
  hints:
    nudge: "a OR b は NOT (NOT a AND NOT b) と同じ。NAND は「NOT (… AND …)」の部分をすでに与えてくれる。"
    wrong: "NAND は両方の入力が 1 でない限り 1 を出す。先に a と b を反転すると、反転した入力が両方 1 になるのはいつか?"

or16:
  name: OR16
  goal: |
    16 ビットの OR を作る: a の各ビットと b の同じビットの OR をとる。
  hints:
    nudge: "AND16 と同じように、OR を使う。"
    wrong: "繰り返しを使おう: 16 回繰り返した 1 つのゲートが、16 ビット全部に一度に働く。"

or8way:
  name: OR8WAY
  goal: |
    8 ウェイ OR を作る: 8 つの入力ビットのどれかが 1 なら出力が 1。
    バスを 1 ビットずつに分け、OR で合わせる。
  hints:
    nudge: "8 ビットのどれかが 1 なら out は 1。バスを分け、1 ビットになるまで OR で合わせる。"
    wrong: "スプリッタで 8 ビットを取り出し、OR で合わせる: 2 つずつ(木の形)が一番速い。"

shifter:
  name: バレルシフタ
  goal: |
    in のビットを n 桁(0〜15)一度にずらす。right = 0 なら左(ビット 15 の方)へずらして 0 で埋める。right = 1 なら右へずらして 0 で埋めるが、arith = 1 ならビット 15 の複製で埋める(負の数が負のままになる)。左へのシフトでは arith は関係ない。
    段階ごとに作る: 1 ずらすかどうかの MUX16(n のビット 0)、次に 2 ずらすかどうか(ビット 1)、次に 4、次に 8。5 ずらすのは段階 1 と 3 を合わせたもの。ずらすこと自体はただの配線: バスを分け、ビットを 1 つずらして結合し直す。左の連鎖と右の連鎖を作り、最後の MUX16 に right で選ばせる。
  hints:
    nudge: "n ずらすことは、n の 1 であるビットごとに 8、4、2、1 ずらすこと。n のビットごとに一段作り、MUX16 が「ずらした」か「ずらさない」かを選ぶ。"
    wrong: "一段ずつ確かめよう: n = 1、2、4、8 では一つの段だけがずらす。左へ k ずらす段では、ずらしたバスのビット i はビット i − k から来る(下位 k ビットは 0)。右へずらすなら、ビット i + k から来る(上位 k ビットは埋める値)。"

xor:
  name: XOR
  goal: |
    XOR(「排他的論理和」)を作る: 入力が異なるとき出力が 1 になる。
    2 つのビットを足す(キャリーは無視する)ゲート。
  hints:
    nudge: "XOR は入力のちょうど一つが 1 のとき 1: OR と同じだが、両方 1 のときは違う。"
    wrong: "XOR は「a OR b、ただし両方ではない」。「両方ではない」を教えてくれるゲートはどれか?"

xor16:
  name: XOR16
  goal: |
    16 ビットの XOR を作る: a の各ビットと b の同じビットの XOR をとる。
    XOR は制御できるインバータでもある: x XOR 0 = x、x XOR 1 = NOT x。ALU はこれで、必要なときに B を反転する。
  hints:
    nudge: "AND16 と同じように、XOR を使う。"
    wrong: "繰り返しを使おう: 16 回繰り返した 1 つのゲートが、16 ビット全部に一度に働く。"

bit:
  name: ビット
  goal: |
    1 ビットのレジスタ: 自分で制御できる記憶。clk の立ち上がりエッジごとに、load が 1 なら d を保存し、load が 0 なら持っているビットを保つ。
    フリップフロップは立ち上がりエッジのたびに何かを保存するので、何を保存するか選ぶ: マルチプレクサが自分の出力 q(保持)か d(読み込み)を選ぶ。
  hints:
    nudge: "フリップフロップはクロックエッジのたびに何かを保存する。古いビットを保つには、自分の出力をもう一度保存しなければならない。"
    wrong: "load=0 のとき、フリップフロップは自分の出力をもう一度保存しなければならない。q をマルチプレクサに戻し、load に q と d のどちらかを選ばせる。"
    unknown: "読み込み後も q が不明のままなら、マルチプレクサの出力がフリップフロップの d に、clk がフリップフロップに届いているか確かめよう。"

dff:
  name: D フリップフロップ
  goal: |
    フリップフロップは一瞬だけ変わる: clk が 0 から 1 に上がるとき、q が d の値をとる。それ以外のときは、d が何をしても q は保たれる。すべてのフリップフロップを同時に刻むクロックが、コンピュータを一歩ずつ動かす。
    D ラッチを 2 つつなぐ。1 つ目(マスター)は clk が 0 の間開き、2 つ目(スレーブ)は clk が 1 の間開く。両方が同時に開くことはない。
  hints:
    nudge: "2 つの D ラッチを一列に。決して同時には開かない 2 つの扉がある部屋のように。"
    wrong: "clk が 1 のままなのに q が変わるなら、作ったのはフリップフロップではなくラッチ。2 つ目のラッチは 1 つ目が閉じている間だけ開くようにする: 逆のイネーブル、clk と NOT clk を与える。"
    unknown: "最初の立ち上がりエッジまでは何も保存されない。その後も q が不明のままなら、マスターの出力がスレーブの d に入っているか確かめよう。"

dlatch:
  name: D ラッチ
  goal: |
    ラッチを使いやすくする: セットとリセットの代わりにデータ入力 d が 1 つ。en(イネーブル)が 1 の間、q は d に従う。en が 0 に戻ると、q はその瞬間の d の値を保つ。
    SR ラッチを使う: d が 1 で en が 1 ならセット、d が 0 で en が 1 ならリセットする。
  hints:
    nudge: "SR ラッチの前に一段置く: d と en から s と r を作り、en が 1 の間だけ変わるようにする。"
    wrong: "en が 0 のとき、セットもリセットも 1 になってはいけない。そうすればラッチは保持する。en が 1 のとき、d に応じてちょうど一方が 1 になる。"
    unknown: "en が少なくとも一度 1 になるまで、ラッチは不明のまま。en が両方の AND ゲートに届いているか確かめよう。"

pc:
  name: プログラムカウンタ
  goal: |
    プログラムカウンタは次の命令のアドレスを持つ。clk の立ち上がりエッジごとに: reset が 1 なら 0 になる。そうでなく load が 1 なら d になる(ジャンプ)。そうでなく inc が 1 なら 1 増える。それ以外は値を保つ。
    エッジごとに必ず読み込むレジスタを使い、何を読み込むかを 3 つの MUX16 の連鎖で選ぶ: 保持か q+1(inc)、次に d(load)、次に 0(reset)。最後のものが勝つので、reset を最後に置く。
  hints:
    nudge: "次の値は、そのまま、+1、d、0 のどれか。全部を用意し、MUX16 に一つ選ばせて、レジスタに保存する。"
    wrong: "優先順位は reset、load、inc の順。マルチプレクサの連鎖では最後のものが決めるので、reset のマルチプレクサを最後、レジスタの直前に置く。"
    unknown: "カウンタは最初のリセットか読み込みまで不明。リセット後も不明のままなら、レジスタがエッジごとに読み込んでいるか(load = 1)確かめよう。"

ram16k:
  name: RAM16K
  goal: |
    16,384 ワード: コンピュータのメインメモリを、4 つの RAM4K から作る。アドレスは 14 ビット: 上位 2 ビットが RAM4K を選び、下位 12 ビットがその中のアドレス。
    RAM4K と同じ形で、load には DMUX4WAY を、q には MUX4WAY16 を使う。
  hints:
    nudge: "同じ形だが、今度は RAM4K が 4 つ。4 つから 1 つを選ぶには、アドレスのビットが何個要るか?"
    wrong: "addr の上位 2 ビット(ビット 12 と 13)が RAM4K を選び、下位 12 ビットが各 RAM4K の自分のアドレスとしてすべてに届く。"
    unknown: "ワードは何かを保存するまで不明として読まれる。一つの RAM4K に書いても、ほかを乱してはいけない。"

ram4k:
  name: RAM4K
  goal: |
    8 つの RAM512 から作る 4,096 ワードのメモリ。アドレスは 12 ビット: 上位 3 ビットがどの RAM512 かを選び、下位 9 ビットがその中のアドレス。
    addr を分け、下位ビットを結合し直してすべての RAM512 用の 9 ビットのアドレスにし、上位 3 ビットを DMUX8WAY(load 用)と MUX8WAY16(q 用)に使う。RAM8 と同じように。
  hints:
    nudge: "また同じ形: RAM512 が 8 つ。"
    wrong: "addr の上位 3 ビットが RAM512 を選び、下位 9 ビットが各 RAM512 の自分のアドレスとしてすべてに届く。分けたビットがどのジョイナに入っているか確かめよう。"
    unknown: "ワードは何かを保存するまで不明として読まれる。一つの RAM512 に書いても、ほかを乱してはいけない。"

ram512:
  name: RAM512
  goal: |
    8 つの RAM64 から作る 512 ワードのメモリ。アドレスは 9 ビット: 上位 3 ビットがどの RAM64 かを選び、下位 6 ビットがその中のアドレス。
    addr を分け、下位ビットを結合し直してすべての RAM64 用の 6 ビットのアドレスにし、上位 3 ビットを DMUX8WAY(load 用)と MUX8WAY16(q 用)に使う。RAM8 と同じように。
  hints:
    nudge: "一段上で同じ形: RAM64 が 8 つ。"
    wrong: "addr の上位 3 ビットが RAM64 を選び、下位 6 ビットが各 RAM64 の自分のアドレスとしてすべてに届く。分けたビットがどのジョイナに入っているか確かめよう。"
    unknown: "ワードは何かを保存するまで不明として読まれる。一つの RAM64 に書いても、ほかを乱してはいけない。"

ram64:
  name: RAM64
  goal: |
    8 つの RAM8 から作る 64 ワードのメモリ。アドレスは 6 ビット: 上位 3 ビットがどの RAM8 かを選び、下位 3 ビットがその中のアドレス。
    addr を分け、下位ビットを結合し直してすべての RAM8 用の 3 ビットのアドレスにし、上位 3 ビットを DMUX8WAY(load 用)と MUX8WAY16(q 用)に使う。RAM8 と同じように。
  hints:
    nudge: "RAM8 が 8 つ。アドレスの一部のビットが RAM8 を選び、残りがその中のワードを選ぶ。"
    wrong: "addr の上位 3 ビットが RAM8 を選び、下位 3 ビットが各 RAM8 の自分のアドレスとしてすべてに届く。分けたビットがどのジョイナに入っているか確かめよう。"
    unknown: "ワードは何かを保存するまで不明として読まれる。一つの RAM8 に書いても、ほかを乱してはいけない。"

ram8:
  name: RAM8
  goal: |
    アドレス付きのメモリ: 16 ビットのレジスタが 8 つ。q はいつも addr のレジスタを示す。load=1 で clk が立ち上がると、d は addr のレジスタに、そこにだけ保存される。
    DMUX8WAY(sel = addr)で load を一つのレジスタに送り、MUX8WAY16(sel = addr)で選んだレジスタを読む。どのレジスタも同じ d と clk を受け取る。
  hints:
    nudge: "レジスタが 8 つ。アドレスが、どれが読み込んでよいか、どれを読むかを決める。"
    wrong: "読み込んでよいのは addr のレジスタだけ: load をすべてのレジスタに直接つながず、デマルチプレクサを通す。読むのも同じ addr でマルチプレクサを通す。"
    unknown: "レジスタは何かを保存するまで不明として読まれる。書いたアドレスで q が不明のままなら、clk と d がすべてのレジスタに届いているか確かめよう。"

regfile:
  name: レジスタファイル
  goal: |
    CPU の 8 つのレジスタ r0〜r7。書き込みポートが 1 つ、読み出しポートが 2 つ。qa は番号 ra のレジスタを、qb は番号 rb のレジスタを同時に示す。clk の立ち上がりエッジで we(書き込みイネーブル)が 1 なら、レジスタ wa が d を保存する。
    8 つのレジスタが d と clk を共有する。DMUX8WAY が we を wa で選んだものに送り、2 つの MUX8WAY16 が ra と rb で読む。
  hints:
    nudge: "レジスタが 8 つ: 一つのアドレスがどれが読み込んでよいかを、マルチプレクサがどれを読むかを選ぶ。ここでは 2 つを同時に読む。"
    wrong: "どのレジスタも同じ d と clk を受け取る。読み込んでよいのは wa が選んだものだけで、それも we が 1 のときだけ。2 つの読み出しポートは独立: ra が一方の MUX8WAY16 を、rb がもう一方を動かす。"
    unknown: "レジスタは書き込まれるまで不明として読まれる。書いたレジスタが不明のままなら、その load が、その番号の DMUX8WAY の出力から来ているか確かめよう。"

register:
  name: レジスタ
  goal: |
    16 ビットのレジスタ: 一緒に読み込む 16 個のビットを並べたもの。load=1 で clk が立ち上がると 16 ビットの数 d を保存し、そうでなければ自分の数を保つ。
    ビットを繰り返し ×16 で使い、load と clk を共有にして、どの複製も同じものを受け取るようにする。
  hints:
    nudge: "ビットを 16 個並べる: 繰り返し ×16 にしたビット 1 つ。"
    wrong: "ビットのどの複製も同じ load と clk が必要: 両方を共有にチェックする。d と q はビットごとに分かれる。"

srlatch:
  name: SR ラッチ
  goal: |
    最初のメモリを作る。s を 1 にすると q は 1 に、r(リセット)を 1 にすると q は 0 になる。両方を 0 に戻すと、q は最後の値を保つ: 回路が覚えている。
    2 つの NOR ゲートを使い、それぞれの出力をもう一方の入力につなぐ。そのループが記憶になる。s と r を同時に 1 にしてはいけない。
  hints:
    nudge: "出力が自分の入力に戻ると、回路は覚えるようになる。互いに入力し合う 2 つの NOR を試そう。"
    wrong: "s=0、r=0 のとき、q は前の値を保たなければならない。それにはフィードバックが必要: 各 NOR の出力をもう一方の NOR の入力につなぐ。"
    unknown: "ラッチは最初にセットかリセットされるまで不明(X)。s=1 にしても q が X のままなら、s と r がそれぞれ NOR の一つに届いているか、q が NOR の出力から来ているか確かめよう。"

computer:
  name: コンピュータ
  goal: |
    全部をまとめる: CPU と、そのデータメモリとしてのメモリマップ。CPU の addrM、outM、writeM がメモリの addr、d、load を動かし、メモリの q が CPU の inM に戻る。key と timer はメモリへ。CPU の 4 つのピンをコンピュータの出力として示す。
    プログラム ROM は外から差し込まれる: テストは、本物の ROM チップのように、pc の位置の命令を instr に与える。
  hints:
    nudge: "部品は 2 つ: CPU が書いたものはメモリへ、メモリが読んだものは CPU へ戻る。プログラム ROM は外にある: instr はもう入力になっている。"
    wrong: "このトレースは値を保存してから読み戻す: LOAD の 1 ステップ後に outM の値が違うなら、メモリの q が CPU の inM に、writeM がメモリの load に届いているか確かめよう。"

cpu:
  name: CPU
  goal: |
    プロセッサ全体: instr の命令を 1 クロックサイクルで実行する。プログラム ROM は外にあり、pc の位置の命令を示す。
    データパスは正確にこのとおりに配線する(テストはこれらのピンを確かめる):
    - 制御ユニット(decode)は instr と 3 つのフラグのビット(z、n、c)を読む。フラグのビットは setflags = 1 のとき ALU のフラグを読み込む。
    - レジスタファイルは ra(qa)と rb(qb)を読む。ALU は a = qa と、b = qb(useimm = 1 なら imm)を受け取る。
    - シフタは qa を右(instr のビット 5)か左にずらす。arith = ビット 4、ずらす量は instr のビット 3–0、ビット 6 = 1 なら qb のビット 3–0。
    - レジスタ wa に書くもの(we = 1 のとき)は rsel で選ぶ: 0 は ALU の出力、1 はシフタの出力、2 は SET: instr のビット 7–0(上位バイトは 0)、3 は SETH: instr のビット 7–0 を上位バイトに、qa の下位バイトを下位に、4 は inM、5 は pc + 1。
    - PC は jump = 1 のとき読み込む: jr = 1 なら qa、そうでなければ pc + off。それ以外は 1 ずつ増える。reset で 0 になる(そのサイクルでも instr の命令は実行される)。
    - ピン: pc = PC。addrM = ALU の出力(LOAD と STORE はこれをアドレスに使う)。outM = qb。writeM は制御ユニットから。
  hints:
    nudge: "一つの命令を追ってみよう: 制御ユニットが読み、レジスタが ALU に値を送り、結果がレジスタに戻り、PC が進む。その経路を先に配線し、残りは後で加える。"
    wrong: "各命令は 2 ステップ: clk が low(ピンにこのサイクルの仕事が出る)と clk が high(結果が保存される)。失敗したステップの上の `#` の行を読んでどの命令が実行されたか確かめ、その信号を制御ユニットからデータパスへたどろう。"
    unknown: "レジスタとフラグは何かが書くまで不明、PC は最初のリセットまで不明。書いた後も値が不明のままなら、書き込みポートを確かめよう: d は結果の MUX8WAY16 から、we と wa は制御ユニットから来る。"

decode:
  name: 制御ユニット
  goal: |
    命令を、CPU を動かす信号に変える(形式は docs/ISA.md か第 4 章を参照)。op = ビット 15–13、rd = ビット 12–10、ra = 9–7、rb = 6–4。
    - wa: rd。ただし CALL と CALLR(ビット 15–12 = 1110、または 1111 でビット 11 = 1)では 7。we = 1 は ALU(op 0)、IMM(2)、SHIFT(3)、LOAD(4)、CALL と CALLR。
    - ra: IMM では rd、JR/CALLR(op 7、ビット 12 = 1)ではビット 10–8、それ以外はビット 9–7。rb: STORE(5)ではビット 12–10、SHIFT ではビット 2–0、それ以外はビット 6–4。
    - f、invb、cin: ALU と CMP(op 0、1)ではビット 3–2、1、0。SUBI(op 2、ビット 9–8 = 11)では SUB(f 0、invb 1、cin 1)。それ以外は ADD(すべて 0)。
    - useimm = 1 は IMM、LOAD、STORE。imm: IMM ではビット 7–0、それ以外はビット 6–0、ゼロ拡張。
    - rsel は書くものを選ぶ: 0 は ALU、1 はシフタ(op 3)、2 は SET(op 2、k 0)、3 は SETH(k 1)、4 はメモリ(LOAD)、5 は PC + 1(CALL、CALLR)。それ以外は 0。
    - setflags = 1 は ALU、CMP、ADDI、SUBI。writeM = 1 は STORE。
    - jump = 1 は op 7、および op 6 で条件(ビット 12–10)が成り立つとき: 0 常に、1 z、2 z でない、3 n、4 n でない、5 c、6 c でない、7 c かつ z でない。jr = 1 は op 7 でビット 12 = 1。
    - off: op 6 ではビット 9–0 を符号拡張、それ以外はビット 11–0 を符号拡張。
    コツ: in = 1、sel = op の DMUX8WAY で、命令のグループごとに 1 本の配線が得られる。
  hints:
    nudge: "一度に全部やらないこと: 一度に出力一つ。まず op(ビット 15–13)を、命令のグループごとに 1 本の配線にする。"
    wrong: "失敗した行の命令のグループ(op = ビット 15–13)を見つけ、そのグループの信号を一つずつ確かめよう。レジスタのフィールドから 3 ビットを選ぶのは、sel を共有にして ×3 繰り返した MUX。"

memory:
  name: メモリマップ
  goal: |
    CPU が届くすべてのデータアドレス。docs/ISA.md のマップどおり:
    - 0x0000–0x3FFF: RAM16K(アドレスのビット 15–14 = 00)。
    - 0x4000–0x42FF: 画面の 768 ワード。アドレスの下位 12 ビットで RAM4K を使う。そこに属するのは、ビット 15–13 が 010 で 0x4300 未満のアドレスだけ。
    - 0x6000: キーボード: q は key。0x6001: タイマー: q は timer。どちらに書いても何も起きない。
    - それ以外のアドレスは 0 として読まれ、書き込みは無視される。
    in = 1、sel = アドレスのビット 15–13 の DMUX8WAY で領域が分かる。次に、画面(ビット 12、11、10 = 0 で、9 と 8 が両方 1 ではない)と、キーボードとタイマー(ビット 12–1 がすべて 0、ビット 0 でどちらか)に絞り込む。
  hints:
    nudge: "アドレスの上位ビットが、どの装置かを教えてくれる: RAM、画面、またはキーボードとタイマー。まずそれを見分けよう。"
    wrong: "失敗したアドレスの領域を上位 3 ビットから見つけよう。RAM が load を受けるのは 000 と 001 だけ、画面は 0x4300 未満の 010 だけ。キーボード、タイマー、そのほかは何も保存しない。"
    unknown: "RAM と画面のワードは何かを保存するまで不明として読まれる。RAM、画面、キーボード以外のアドレスは、不明ではなく 0 と読まれなければならない: そこには 0 のバスを選ぼう。"
