layer = 4
goal = """
Put it together: your CPU with the memory map as its data memory. The CPU's addrM, outM and writeM drive memory's addr, d and load; memory's q comes back as the CPU's inM; key goes to the memory. Show the CPU's four pins as the computer's outputs.
The program ROM is plugged in from outside: the tests feed instr with the instruction at pc, like a real ROM chip would.
"""
