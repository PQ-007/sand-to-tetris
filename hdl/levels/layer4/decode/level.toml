id = "decode"
name = "Control unit"
layer = 4
goal = """
Turn an instruction into the signals that steer the CPU (see docs/ISA.md, or Chapter 4, for the formats). op = bits 15–13; rd = bits 12–10, ra = 9–7, rb = 6–4.
- wa: rd, but 7 for CALL and CALLR (bits 15–12 = 1110, or 1111 with bit 11 = 1). we = 1 for ALU (op 0), IMM (2), SHIFT (3), LOAD (4), CALL and CALLR.
- ra: rd for IMM, bits 10–8 for JR/CALLR (op 7, bit 12 = 1), else bits 9–7. rb: bits 12–10 for STORE (5), bits 2–0 for SHIFT, else bits 6–4.
- f, invb, cin: bits 3–2, 1, 0 for ALU and CMP (op 0, 1); SUB (f 0, invb 1, cin 1) for SUBI (op 2, bits 9–8 = 11); otherwise ADD (all 0).
- useimm = 1 for IMM, LOAD, STORE. imm: bits 7–0 for IMM, bits 6–0 for everything else, zero-extended.
- rsel picks what's written: 0 ALU, 1 shifter (op 3), 2 SET (op 2, k 0), 3 SETH (k 1), 4 memory (LOAD), 5 PC + 1 (CALL, CALLR); 0 otherwise.
- setflags = 1 for ALU, CMP, ADDI, SUBI. writeM = 1 for STORE.
- jump = 1 for op 7, and for op 6 when its condition (bits 12–10) holds: 0 always, 1 z, 2 not z, 3 n, 4 not n, 5 c, 6 not c, 7 c and not z. jr = 1 for op 7 with bit 12 = 1.
- off: bits 9–0 sign-extended for op 6, else bits 11–0 sign-extended.
Tip: a DMUX8WAY with in = 1 and sel = op gives one wire per instruction group.
"""
inputs = ["instr", "z", "n", "c"]
outputs = ["wa", "we", "ra", "rb", "f", "invb", "cin", "useimm", "imm", "rsel", "setflags", "writeM", "jump", "jr", "off"]
requires = ["dmux8way", "mux", "and", "or", "not", "one", "zero"]
widths = { instr = 16, wa = 3, ra = 3, rb = 3, f = 2, imm = 16, rsel = 3, off = 16 }
model = "decode"
random_tests = 1000
truth_table = """
