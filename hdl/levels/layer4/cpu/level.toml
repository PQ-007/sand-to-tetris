id = "cpu"
name = "CPU"
layer = 4
goal = """
The whole processor: it runs the instruction on instr in one clock cycle. The program ROM sits outside: it shows the instruction at pc.
Wire the datapath exactly like this (the tests check these pins):
- The control unit (decode) reads instr and three flag Bits (z, n, c), which load the ALU's flags when setflags = 1.
- The register file reads ra (qa) and rb (qb). The ALU gets a = qa and b = qb, or imm when useimm = 1.
- The shifter shifts qa right (instr bit 5) or left, arith = bit 4, by bits 3–0 of instr, or by bits 3–0 of qb when bit 6 = 1.
- What's written to register wa (when we = 1) is chosen by rsel: 0 the ALU's out, 1 the shifter's out, 2 SET: instr bits 7–0 (high byte 0), 3 SETH: instr bits 7–0 as the high byte and qa's low byte, 4 inM, 5 pc + 1.
- The PC loads when jump = 1: qa when jr = 1, else pc + off. Otherwise it counts up; reset sets it to 0 (the instruction on instr still runs during that cycle).
- Pins: pc = the PC; addrM = the ALU's out (LOAD and STORE use it as the address); outM = qb; writeM from the control unit.
"""
sequential = true
inputs = ["instr", "inM", "reset", "clk"]
outputs = ["pc", "addrM", "outM", "writeM"]
requires = ["decode", "regfile", "alu", "shifter", "pc", "bit", "mux16", "mux8way16", "mux", "add16", "inc16", "one", "zero"]
widths = { instr = 16, inM = 16, pc = 16, addrM = 16, outM = 16 }
model = "cpu"
random_tests = 300
truth_table = """
