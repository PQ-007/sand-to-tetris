id = "or8way"
name = "OR8WAY"
layer = 2
goal = """
Build an 8-way OR: the output is 1 if any of the 8 input bits is 1.
Split the bus into single bits, then combine them with ORs.
"""
role = "says whether any of 8 bits is 1"
why = """
The ALU uses two of these for its zero flag: if no bit of the result is 1, the result is 0. That flag is how a program asks "are these equal?": subtract them and see whether the answer is zero.
"""
inputs = ["in"]
outputs = ["out"]
requires = ["or"]
widths = { in = 8 }
model = "or8way"
truth_table = """
in | out
0 | 0
1 | 1
0x80 | 1
0x10 | 1
0xff | 1
"""

[hints]
nudge = "out is 1 if any of the 8 bits is 1. Split the bus, then OR bits together until one is left."
wrong = "Use a splitter to get the 8 bits, then OR them together: in pairs (a tree) is fastest."
