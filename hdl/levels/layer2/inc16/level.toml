id = "inc16"
name = "INC16"
layer = 2
goal = """
Add 1 to a 16-bit number. Use your ADD16 with the number 1 as its second input: build the 16-bit 1 from constants with a joiner.
"""
role = "adds 1"
why = """
Counting is everywhere in a computer. The program counter adds 1 after every instruction to move on to the next one, and every loop counts with i + 1. INC16 is what makes the PC step forward on its own.
"""
inputs = ["a"]
outputs = ["out"]
requires = ["add16", "one", "zero"]
widths = { a = 16, out = 16 }
model = "inc16"
truth_table = """
a | out
0 | 1
41 | 42
0x00ff | 0x0100
0xffff | 0
"""

[hints]
nudge = "a + 1 is an addition. Which 16-bit number do you add, and how do you build it from constants?"
wrong = "The number 1 in binary is bit 0 = 1 and every other bit 0."
