id = "one"
name = "Constant 1"
layer = 1
goal = """
A component whose output is always 1.
"""
role = "a steady 1 for later parts"
why = """
From Layer 2 on you build with parts, not supply rails, so a fixed 1 has to come from a part. Computers need fixed values all the time: the 1 in "add 1 to the program counter", a signal that's always on, the bits of a small constant.
"""
inputs = []
outputs = ["out"]
requires = ["not"]
truth_table = """
| out
| 1
"""

[hints]
nudge = "A constant has no inputs at all: out just has to be tied to something that is always 1."
wrong = "Which supply rail is always 1?"
floating = "Connect out to a supply rail."
